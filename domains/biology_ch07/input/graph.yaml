domain: biology_2e_ch7
primitives:
  redox_reaction:
    defines: A coupled pair of reactions in which oxidation (loss of an electron from a compound) and
      reduction (gain of that electron by another compound) occur simultaneously.
    tier: 0
  electron_carrier:
    defines: A small class of compounds (e.g., NAD+, FAD) derived from B vitamins that shuttle high-energy
      electrons between compounds in metabolic pathways by being reversibly oxidized and reduced.
    tier: 0
  atp:
    defines: The "energy currency" of the cell, a nucleotide with three phosphate groups whose terminal
      phosphate can be removed to release usable free energy.
    tier: 0
concepts:
  phosphorylation:
    defines: The addition of a phosphate group to a molecule, often via an ATP-substrate-enzyme intermediate
      complex, activating the molecule or driving a reaction.
    composed_of:
    - atp
    tier: 1
  substrate_level_phosphorylation:
    defines: Direct generation of ATP from ADP when a phosphate group is transferred from a phosphorylated
      intermediate reactant during a catabolic pathway reaction.
    composed_of:
    - phosphorylation
    tier: 2
  glycolysis:
    defines: The anaerobic, cytoplasmic pathway that splits one six-carbon glucose molecule into two three-carbon
      pyruvate molecules, yielding a net gain of 2 ATP and 2 NADH.
    composed_of:
    - substrate_level_phosphorylation
    - electron_carrier
    - redox_reaction
    tier: 3
  pyruvate_oxidation:
    defines: The three-step mitochondrial conversion of pyruvate into acetyl CoA, releasing CO2 and producing
      NADH, which prepares the carbon skeleton for the citric acid cycle.
    composed_of:
    - glycolysis
    - electron_carrier
    - redox_reaction
    tier: 4
  citric_acid_cycle:
    defines: A closed-loop series of eight redox and decarboxylation reactions in the mitochondrial matrix
      that oxidizes the acetyl group of acetyl CoA, regenerating oxaloacetate and producing CO2, NADH,
      FADH2, and ATP/GTP.
    composed_of:
    - pyruvate_oxidation
    - substrate_level_phosphorylation
    - electron_carrier
    - redox_reaction
    tier: 5
  electron_transport_chain:
    defines: A series of four membrane-embedded protein complexes and mobile carriers that pass electrons
      from NADH and FADH2 to molecular oxygen, pumping protons across the inner mitochondrial membrane
      in the process.
    composed_of:
    - electron_carrier
    - redox_reaction
    tier: 1
  chemiosmosis:
    defines: The process by which the proton gradient generated by the electron transport chain drives
      protons through ATP synthase, producing ATP.
    composed_of:
    - electron_transport_chain
    - atp
    tier: 2
  oxidative_phosphorylation:
    defines: The production of ATP via chemiosmosis coupled to the electron transport chain, accounting
      for about 90 percent of ATP generated during aerobic glucose catabolism.
    composed_of:
    - chemiosmosis
    - electron_transport_chain
    tier: 3
  fermentation:
    defines: A process that uses an organic molecule (e.g., pyruvate or acetaldehyde) as the final electron
      acceptor to regenerate NAD+ from NADH in the absence of oxygen, allowing glycolysis to continue.
    composed_of:
    - glycolysis
    - electron_carrier
    - redox_reaction
    tier: 4
  anaerobic_cellular_respiration:
    defines: A respiration process in certain prokaryotes in which an inorganic molecule other than oxygen
      serves as the final electron acceptor of the electron transport chain.
    composed_of:
    - electron_transport_chain
    - redox_reaction
    tier: 2
  metabolic_pathway_integration:
    defines: The interconnection of catabolic and anabolic pathways for sugars, amino acids, and lipids
      with glycolysis and the citric acid cycle, allowing diverse macromolecules to be broken down for
      energy or synthesized from shared intermediates.
    composed_of:
    - glycolysis
    - citric_acid_cycle
    tier: 6
applications:
  regulation_of_cellular_respiration:
    defines: Control of glucose catabolism via glucose transporters and allosteric feedback effectors
      (ATP, ADP, AMP, NADH, citrate) acting on rate-limiting enzymes at each stage of the pathway.
    needs:
    - glycolysis
    - citric_acid_cycle
    - oxidative_phosphorylation
    - atp
    - electron_carrier
    tier: 6
  cellular_respiration:
    defines: The overall set of metabolic pathways (glycolysis, pyruvate oxidation, citric acid cycle,
      and oxidative phosphorylation) that extract energy from glucose and store it in ATP.
    needs:
    - glycolysis
    - pyruvate_oxidation
    - citric_acid_cycle
    - oxidative_phosphorylation
    tier: 6
