domain: biology_2e_ch36
primitives:
  stimulus:
    defines: A physical or chemical signal (light, sound, chemical, pressure, temperature) in the internal
      or external environment that can activate a sensory receptor.
    tier: 0
  sensory_receptor:
    defines: A specialized neuron or associated cell modified to detect a specific type of stimulus.
    tier: 0
  receptive_field:
    defines: The region in space in which a given sensory receptor can respond to a stimulus.
    tier: 0
  mechanoreceptor:
    defines: A sensory receptor that senses stimuli through physical deformation of its plasma membrane
      via mechanically gated ion channels.
    tier: 0
  thermoreceptor:
    defines: A receptor activated by changes in temperature, located in the dermis, skeletal muscles,
      liver, and hypothalamus.
    tier: 0
  chemoreceptor:
    defines: A receptor that transduces chemical stimuli, underlying both taste and smell.
    tier: 0
  sound_wave:
    defines: A mechanical pressure wave traveling through a medium, characterized by frequency (pitch)
      and amplitude (volume).
    tier: 0
  hair_cell:
    defines: A mechanoreceptor bearing stereocilia that transduces mechanical bending into an electrical
      signal, used in both hearing and vestibular sensation.
    tier: 0
  light_wave:
    defines: Electromagnetic radiation that needs no medium to travel, whose wavelength manifests as hue
      and amplitude as brightness.
    tier: 0
  photoreceptor:
    defines: Retinal receptor cells (rods for dim-light achromatic vision and cones for bright-light color
      vision) that transduce light into neural signals.
    tier: 0
concepts:
  sensory_transduction:
    defines: The conversion of a sensory stimulus into an electrical signal (receptor potential) in the
      nervous system.
    composed_of:
    - stimulus
    - sensory_receptor
    tier: 1
  receptor_potential:
    defines: A graded change in a sensory receptor's membrane potential produced by transduction, whose
      magnitude varies with stimulus strength.
    composed_of:
    - sensory_transduction
    tier: 2
  sensory_coding:
    defines: The representation of stimulus type, location, duration, and intensity through which afferent
      axon and receptor activity encode a stimulus.
    composed_of:
    - receptor_potential
    - receptive_field
    tier: 3
  perception:
    defines: An individual's interpretation of a sensation, occurring in the brain after sensory signals
      are routed through the thalamus to the cortex.
    composed_of:
    - sensory_coding
    tier: 4
  somatosensation:
    defines: The general sense (touch) that includes sensation from the skin, mucous membranes, limbs,
      and joints, responding to temperature, pain, pressure, and vibration.
    composed_of:
    - mechanoreceptor
    - thermoreceptor
    tier: 1
  nociceptor_pain:
    defines: The neural processing of injurious stimuli by pain receptors (nociceptors), perceived as
      pain once communicated to the brain.
    composed_of:
    - somatosensation
    - perception
    tier: 5
  skin_mechanoreceptor_types:
    defines: The specific tactile mechanoreceptors in human skin—Merkel's disks, Meissner's corpuscles,
      Ruffini endings, Pacinian corpuscles, and hair receptors—each specialized for particular touch qualities.
    composed_of:
    - mechanoreceptor
    - somatosensation
    tier: 2
  proprioception_kinesthesia:
    defines: The sense of limb, joint, and muscle position (proprioception) and of limb movement (kinesthesia),
      detected via muscle spindles and Golgi tendon organs.
    composed_of:
    - mechanoreceptor
    - somatosensation
    tier: 2
  gustation:
    defines: The sense of taste, mediated by taste buds that detect five primary tastes—sweet, sour, bitter,
      salty, and umami—via dissolved food molecules (tastants).
    composed_of:
    - chemoreceptor
    - sensory_transduction
    tier: 2
  olfaction:
    defines: The sense of smell, in which airborne odorant molecules bind olfactory receptors in the olfactory
      epithelium to stimulate specialized bipolar neurons.
    composed_of:
    - chemoreceptor
    - sensory_transduction
    tier: 2
  audition:
    defines: The sense of hearing, in which sound waves are transduced by the ear into neural signals
      interpreted as pitch and volume.
    composed_of:
    - sound_wave
    - sensory_transduction
    tier: 2
  ear_anatomy:
    defines: The structures—auricle, tympanum, ossicles, oval window, and cochlea—that collect and transmit
      sound energy from the environment to the inner ear.
    composed_of:
    - sound_wave
    tier: 1
  cochlear_transduction:
    defines: The process by which pressure waves in cochlear fluid flex the basilar membrane, bending
      stereocilia in the organ of Corti to generate neural signals.
    composed_of:
    - ear_anatomy
    - hair_cell
    tier: 2
  place_theory_pitch:
    defines: The model that pitch is determined by the specific location along the basilar membrane that
      is maximally stimulated by a given sound frequency.
    composed_of:
    - cochlear_transduction
    tier: 3
  vestibular_sense:
    defines: The sense of spatial orientation and balance, detecting linear and angular acceleration/deceleration
      via the utricle, saccule, and semicircular canals.
    composed_of:
    - hair_cell
    tier: 1
  vision:
    defines: The sense of sight, the detection of light patterns from the environment and their interpretation
      into images.
    composed_of:
    - light_wave
    - sensory_transduction
    tier: 2
  eye_anatomy:
    defines: The structures of the eye that focus and regulate light before it reaches the photoreceptors
      of the retina.
    composed_of:
    - light_wave
    - photoreceptor
    tier: 1
  phototransduction:
    defines: The process by which light striking rhodopsin isomerizes retinal, closing Na+ channels and
      hyperpolarizing the photoreceptor.
    composed_of:
    - photoreceptor
    - light_wave
    tier: 1
  trichromatic_coding:
    defines: The perception of color arising from the differential activity ratio of three cone types
      (S, M, L) each maximally sensitive to a different wavelength.
    composed_of:
    - phototransduction
    tier: 2
  retinal_processing:
    defines: The processing of visual signals within the retina by bipolar, horizontal, amacrine, and
      ganglion cells before signals leave via the optic nerve.
    composed_of:
    - phototransduction
    - eye_anatomy
    tier: 2
applications:
  just_noticeable_difference:
    defines: The smallest detectible difference between stimuli, which Weber's Law states is proportional
      to the magnitude of the original stimulus.
    needs:
    - sensory_coding
    tier: 4
  two_point_discrimination:
    defines: An experimental method for estimating the density and receptive field size of pressure receptors
      in skin using two simultaneous touch points.
    needs:
    - skin_mechanoreceptor_types
    - receptive_field
    tier: 3
  pheromone_detection:
    defines: The sensing of pheromones—chemicals released by an animal that affect behavior or physiology
      of the same species—via the vomeronasal organ, distinct from general olfaction.
    needs:
    - olfaction
    tier: 3
  cochlear_implant:
    defines: A device that restores hearing by converting sound to electrical impulses sent directly to
      the auditory nerve, bypassing a nonfunctional cochlea.
    needs:
    - cochlear_transduction
    tier: 3
  refractive_vision_defects:
    defines: Visual defects (myopia, hyperopia, presbyopia) arising from mismatches between eyeball/lens
      shape and where the image focuses relative to the retina.
    needs:
    - eye_anatomy
    tier: 2
