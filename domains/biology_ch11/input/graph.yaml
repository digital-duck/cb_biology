domain: biology_2e_ch11
primitives:
  haploid_diploid:
    defines: Haploid cells contain one set of chromosomes while diploid cells contain two sets, one inherited
      from each parent.
    tier: 0
  homologous_chromosomes:
    defines: Matched pairs of chromosomes containing the same genes in identical locations, one inherited
      from each parent.
    tier: 0
  gametes:
    defines: Specialized haploid cells (egg and sperm) that unite during fertilization to form a diploid
      zygote.
    tier: 0
  sister_chromatids:
    defines: Two identical copies of a replicated chromosome held together at the centromere by cohesin
      proteins.
    tier: 0
  mitosis:
    defines: A single nuclear division producing two genetically identical daughter nuclei with the same
      ploidy as the parent cell.
    tier: 0
  fertilization:
    defines: The union of two haploid gametes to restore the diploid chromosome number in a zygote.
    tier: 0
concepts:
  synapsis:
    defines: The tight pairing of homologous chromosomes during prophase I, mediated by the synaptonemal
      complex.
    composed_of:
    - homologous_chromosomes
    tier: 1
  independent_assortment:
    defines: The random orientation of homologous chromosome pairs at the metaphase plate during metaphase
      I, producing varied combinations of maternal and paternal chromosomes in gametes.
    composed_of:
    - homologous_chromosomes
    tier: 1
  crossing_over:
    defines: The exchange of chromosomal segments between homologous nonsister chromatids during prophase
      I, producing recombinant chromosomes.
    composed_of:
    - synapsis
    tier: 2
  tetrad:
    defines: Two duplicated homologous chromosomes (four chromatids) held together by chiasmata following
      synapsis and crossover.
    composed_of:
    - synapsis
    - crossing_over
    - sister_chromatids
    tier: 3
  genetic_variation_in_meiosis:
    defines: The genetic diversity among gametes generated by crossing over and independent assortment
      during meiosis.
    composed_of:
    - crossing_over
    - independent_assortment
    tier: 3
  meiosis_i:
    defines: The first meiotic division, in which homologous chromosomes pair, undergo crossover, and
      separate, reducing ploidy from diploid to haploid.
    composed_of:
    - synapsis
    - crossing_over
    - tetrad
    - independent_assortment
    tier: 4
  meiosis_ii:
    defines: The second meiotic division, mechanically similar to mitosis, in which sister chromatids
      separate to produce four haploid daughter cells.
    composed_of:
    - sister_chromatids
    - mitosis
    tier: 1
  meiosis:
    defines: The nuclear division process consisting of one round of DNA replication followed by two rounds
      of division (meiosis I and II) that produces four genetically unique haploid cells from a diploid
      cell.
    composed_of:
    - meiosis_i
    - meiosis_ii
    - haploid_diploid
    tier: 5
  meiosis_vs_mitosis:
    defines: The distinction between meiosis, which produces four genetically distinct haploid cells via
      two divisions, and mitosis, which produces two genetically identical diploid (or haploid) cells
      via one division.
    composed_of:
    - meiosis
    - mitosis
    tier: 6
  sexual_reproduction:
    defines: A reproductive strategy involving meiosis and fertilization that produces genetically unique
      offspring through combination of parental genomes.
    composed_of:
    - meiosis
    - fertilization
    - gametes
    tier: 6
  life_cycle:
    defines: The sequence of events in an organism's development and reproduction, including alternation
      between haploid and diploid stages.
    composed_of:
    - sexual_reproduction
    - haploid_diploid
    tier: 7
applications:
  diploid_dominant_life_cycle:
    defines: A life-cycle strategy, used by animals, in which the only haploid cells are gametes produced
      by germ cells within gonads.
    needs:
    - life_cycle
    - gametes
    tier: 8
  haploid_dominant_life_cycle:
    defines: A life-cycle strategy, used by most fungi and algae, in which the dominant multicellular
      body is haploid and the zygote immediately undergoes meiosis to form spores.
    needs:
    - life_cycle
    tier: 8
  alternation_of_generations:
    defines: A life-cycle strategy, used by plants and some algae, involving both multicellular haploid
      (gametophyte) and diploid (sporophyte) stages.
    needs:
    - life_cycle
    tier: 8
  evolutionary_advantage_of_sex:
    defines: The hypothesis that genetic variation produced by sexual reproduction enhances survival and
      reproductive success relative to asexual reproduction, including in coevolutionary contexts like
      the Red Queen hypothesis.
    needs:
    - genetic_variation_in_meiosis
    - sexual_reproduction
    tier: 7
