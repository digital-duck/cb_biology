primitives:
  biology:
    defines: The study of life, encompassing scales from microscopic cells to the
      whole living planet.
    tier: 0
    source_domain: biology_ch01
  science:
    defines: Knowledge covering general truths or the operation of general laws, especially
      when acquired and tested by the scientific method.
    tier: 0
    source_domain: biology_ch01
  hypothesis:
    defines: A suggested, testable explanation for an observed event.
    tier: 0
    source_domain: biology_ch01
  inductive_reasoning:
    defines: A form of logical thinking that uses related observations to arrive at
      a general conclusion.
    tier: 0
    source_domain: biology_ch01
  deductive_reasoning:
    defines: A form of logical thinking that uses a general principle or law to predict
      specific results.
    tier: 0
    source_domain: biology_ch01
  variable:
    defines: Any part of an experiment that can vary or change during the experiment.
    tier: 0
    source_domain: biology_ch01
  atom:
    defines: The smallest and most fundamental unit of matter that retains the properties
      of an element.
    tier: 0
    source_domain: biology_ch01
    also_in:
    - biology_ch02
  matter:
    defines: Any substance that occupies space and has mass.
    tier: 0
    source_domain: biology_ch02
  element:
    defines: A unique form of matter with specific chemical and physical properties
      that cannot be broken down into smaller substances by ordinary chemical reactions.
    tier: 0
    source_domain: biology_ch02
  proton:
    defines: A positively charged subatomic particle located in the nucleus with a
      mass of about one atomic mass unit.
    tier: 0
    source_domain: biology_ch02
  neutron:
    defines: An uncharged subatomic particle located in the nucleus with a mass of
      about one atomic mass unit.
    tier: 0
    source_domain: biology_ch02
  electron:
    defines: A negatively charged subatomic particle found in orbitals surrounding
      the nucleus, with negligible mass.
    tier: 0
    source_domain: biology_ch02
  biological_macromolecule:
    defines: A large molecule necessary for life, built from smaller organic monomer
      subunits.
    tier: 0
    source_domain: biology_ch03
  monomer:
    defines: The smallest single subunit or building block that combines with others
      to form a larger polymer.
    tier: 0
    source_domain: biology_ch03
  monosaccharide:
    defines: A simple sugar monomer, such as glucose, galactose, or fructose, that
      is the building block of carbohydrates.
    tier: 0
    source_domain: biology_ch03
  fatty_acid:
    defines: A long hydrocarbon chain with a carboxyl group that combines with glycerol
      to form fats, and which may be saturated or unsaturated.
    tier: 0
    source_domain: biology_ch03
  amino_acid:
    defines: The monomer of proteins, consisting of a central carbon bonded to an
      amino group, a carboxyl group, a hydrogen atom, and a variable R group.
    tier: 0
    source_domain: biology_ch03
    also_in:
    - biology_ch15
  nucleotide:
    defines: The monomer of nucleic acids, composed of a nitrogenous base, a pentose
      sugar, and one or more phosphate groups.
    tier: 0
    source_domain: biology_ch03
    also_in:
    - biology_ch14
  microscope:
    defines: An instrument that magnifies an object so scientists can study cells
      too small to see with the naked eye.
    tier: 0
    source_domain: biology_ch04
  prokaryotic_cell:
    defines: A simple, mostly single-celled organism that lacks a nucleus or any other
      membrane-bound organelle.
    tier: 0
    source_domain: biology_ch04
    also_in:
    - biology_ch23
  eukaryotic_cell:
    defines: A cell that has a membrane-bound nucleus and several other membrane-bound
      organelles.
    tier: 0
    source_domain: biology_ch04
  plasma_membrane:
    defines: A phospholipid bilayer with embedded proteins that separates a cell's
      interior from its surrounding environment.
    tier: 0
    source_domain: biology_ch04
    also_in:
    - biology_ch05
  cytoplasm:
    defines: The entire region between the plasma membrane and the nuclear envelope,
      consisting of organelles suspended in cytosol.
    tier: 0
    source_domain: biology_ch04
  dna:
    defines: The cell's genetic material, present in all cells and organized differently
      in prokaryotes versus eukaryotes.
    tier: 0
    source_domain: biology_ch04
    also_in:
    - biology_ch10
    - biology_ch15
  amphiphilic_molecule:
    defines: A molecule possessing both a polar/charged (hydrophilic) region and a
      nonpolar/uncharged (hydrophobic) region.
    tier: 0
    source_domain: biology_ch05
  cholesterol_membrane_role:
    defines: A four-ringed lipid situated among the phospholipids that buffers temperature
      effects on membrane fluidity and organizes lipid rafts.
    tier: 0
    source_domain: biology_ch05
  membrane_protein_types:
    defines: Integral proteins that span or embed within the phospholipid layer and
      peripheral proteins attached to the membrane surface, serving structural, enzymatic,
      or recognition roles.
    tier: 0
    source_domain: biology_ch05
  concentration_gradient:
    defines: A physical space in which a substance's concentration varies, creating
      a difference in concentration between regions.
    tier: 0
    source_domain: biology_ch05
  channel_protein:
    defines: A transmembrane protein with a hydrophilic core that forms a pore allowing
      specific substances to pass through the membrane, sometimes in a gated manner.
    tier: 0
    source_domain: biology_ch05
  carrier_protein:
    defines: A membrane protein that binds a specific substance and changes shape
      to move it across the plasma membrane.
    tier: 0
    source_domain: biology_ch05
  osmolarity:
    defines: A measure of the total solute concentration in a solution.
    tier: 0
    source_domain: biology_ch05
  energy:
    defines: The ability to do work.
    tier: 0
    source_domain: biology_ch06
  thermodynamics:
    defines: The study of energy and energy transfer involving physical matter.
    tier: 0
    source_domain: biology_ch06
  system_and_surroundings:
    defines: The matter and environment relevant to an energy transfer (system) versus
      everything outside of it (surroundings), classified as open or closed.
    tier: 0
    source_domain: biology_ch06
  enthalpy:
    defines: A system's total energy, denoted as delta H in free energy calculations.
    tier: 0
    source_domain: biology_ch06
  metabolism:
    defines: All the chemical reactions that take place inside cells, including anabolism
      and catabolism.
    tier: 0
    source_domain: biology_ch06
  substrate:
    defines: The reactant molecule(s) to which an enzyme binds at its active site.
    tier: 0
    source_domain: biology_ch06
  redox_reaction:
    defines: A coupled pair of reactions in which oxidation (loss of an electron from
      a compound) and reduction (gain of that electron by another compound) occur
      simultaneously.
    tier: 0
    source_domain: biology_ch07
  electron_carrier:
    defines: A small class of compounds (e.g., NAD+, FAD) derived from B vitamins
      that shuttle high-energy electrons between compounds in metabolic pathways by
      being reversibly oxidized and reduced.
    tier: 0
    source_domain: biology_ch07
  photoautotroph:
    defines: An organism, such as a plant, alga, or cyanobacterium, that uses light
      energy to manufacture its own organic food.
    tier: 0
    source_domain: biology_ch08
  heterotroph:
    defines: An organism that must consume organic substances or other organisms for
      energy because it cannot photosynthesize.
    tier: 0
    source_domain: biology_ch08
    also_in:
    - biology_ch46
  chemoautotroph:
    defines: An organism that builds organic molecules using energy derived from inorganic
      chemicals rather than sunlight.
    tier: 0
    source_domain: biology_ch08
  thylakoid:
    defines: A disc-shaped, membrane-bound structure inside a chloroplast, stacked
      into grana, where the light-dependent reactions occur.
    tier: 0
    source_domain: biology_ch08
  stroma:
    defines: The fluid-filled space surrounding the grana inside a chloroplast where
      the light-independent reactions take place.
    tier: 0
    source_domain: biology_ch08
  stoma:
    defines: A regulated opening, typically on the underside of a leaf, that controls
      gas exchange and water evaporation.
    tier: 0
    source_domain: biology_ch08
  photon:
    defines: A distinct "packet" of light energy that can be absorbed by a pigment
      molecule.
    tier: 0
    source_domain: biology_ch08
  wavelength:
    defines: The distance between two consecutive equivalent points of a light wave,
      inversely related to the energy it carries.
    tier: 0
    source_domain: biology_ch08
  pigment:
    defines: A molecule that absorbs specific wavelengths of light and reflects or
      transmits others, giving it its color.
    tier: 0
    source_domain: biology_ch08
  chlorophyll:
    defines: A pigment embedded in the thylakoid membrane, including chlorophyll a
      and b, responsible for absorbing light and giving leaves their green color.
    tier: 0
    source_domain: biology_ch08
  carotenoid:
    defines: A class of accessory photosynthetic pigments that absorb excess light
      energy and safely dissipate it as heat.
    tier: 0
    source_domain: biology_ch08
  reduction:
    defines: The gain of an electron by an atom or molecule.
    tier: 0
    source_domain: biology_ch08
  ligand:
    defines: A molecule produced by a signaling cell that binds a specific receptor,
      delivering a signal in the process.
    tier: 0
    source_domain: biology_ch09
  receptor:
    defines: A protein in or on a target cell that binds to ligands.
    tier: 0
    source_domain: biology_ch09
  kinase:
    defines: An enzyme that transfers a phosphate group from ATP to another molecule.
    tier: 0
    source_domain: biology_ch09
  gene:
    defines: A segment of DNA that codes for a specific protein and occupies a specific
      locus on a chromosome.
    tier: 0
    source_domain: biology_ch10
    also_in:
    - biology_ch13
    - biology_ch15
  trait:
    defines: A variation of a characteristic determined by the specific combination
      of alleles of a gene inherited from both parents.
    tier: 0
    source_domain: biology_ch10
    also_in:
    - biology_ch12
  histone:
    defines: A low molecular weight, conserved protein that DNA wraps around to form
      the first level of chromosome compaction.
    tier: 0
    source_domain: biology_ch10
    also_in:
    - biology_ch16
  mitotic_spindle:
    defines: The microtubule-based apparatus, organized by centrosomes, that orchestrates
      chromosome movement during mitosis.
    tier: 0
    source_domain: biology_ch10
  cyclin:
    defines: A protein whose fluctuating concentration, when bound to a Cdk, drives
      progression of the cell cycle through its checkpoints.
    tier: 0
    source_domain: biology_ch10
  cdk:
    defines: An enzyme that, when bound to cyclin and phosphorylated, phosphorylates
      other proteins to advance the cell cycle.
    tier: 0
    source_domain: biology_ch10
  negative_regulators:
    defines: Tumor-suppressor proteins including retinoblastoma protein, p53, and
      p21 that halt the cell cycle, primarily at the G1 checkpoint, until conditions
      are met.
    tier: 0
    source_domain: biology_ch10
  ftsz:
    defines: A tubulin-homologous prokaryotic protein that assembles into a ring directing
      cytokinesis during binary fission.
    tier: 0
    source_domain: biology_ch10
  haploid_diploid:
    defines: Haploid cells contain one set of chromosomes while diploid cells contain
      two sets, one inherited from each parent.
    tier: 0
    source_domain: biology_ch11
  gametes:
    defines: Specialized haploid cells (egg and sperm) that unite during fertilization
      to form a diploid zygote.
    tier: 0
    source_domain: biology_ch11
  fertilization:
    defines: The union of two haploid gametes to restore the diploid chromosome number
      in a zygote.
    tier: 0
    source_domain: biology_ch11
    also_in:
    - biology_ch43
  heredity:
    defines: The passing of traits from parents to offspring, studied through Mendel's
      experiments with pea plants.
    tier: 0
    source_domain: biology_ch12
  true_breeding:
    defines: A highly inbred organism that always produces offspring identical to
      the parent for a given trait.
    tier: 0
    source_domain: biology_ch12
  filial_generations:
    defines: The successive parental and offspring generations (P0, F1, F2) produced
      by crossing and self-crossing true-breeding plants.
    tier: 0
    source_domain: biology_ch12
  probability_basics:
    defines: Mathematical measures of likelihood, calculated empirically or theoretically,
      underlying Mendel's analysis of cross ratios.
    tier: 0
    source_domain: biology_ch12
  diploidy_and_alleles:
    defines: Diploid organisms carry two homologous copies of each chromosome, and
      alleles are gene variants at the same locus.
    tier: 0
    source_domain: biology_ch12
  karyotype:
    defines: The number and appearance of an individual's chromosomes, including their
      length, banding pattern, and centromere position.
    tier: 0
    source_domain: biology_ch13
  nitrogenous_base:
    defines: A purine (adenine, guanine) or pyrimidine (cytosine, thymine) ring structure
      attached to the sugar of a nucleotide.
    tier: 0
    source_domain: biology_ch14
  transformation:
    defines: A process, first shown by Griffith, in which external DNA is taken up
      by a cell and changes its morphology and physiology.
    tier: 0
    source_domain: biology_ch14
  bacteriophage:
    defines: A virus, consisting of a protein capsid and a nucleic acid core, that
      infects bacteria and was used by Hershey and Chase to identify the genetic material.
    tier: 0
    source_domain: biology_ch14
  origin_of_replication:
    defines: A specific nucleotide sequence where DNA replication begins and the double
      helix first opens.
    tier: 0
    source_domain: biology_ch14
  helicase:
    defines: An enzyme that unwinds the DNA double helix by breaking hydrogen bonds
      between base pairs, using energy from ATP hydrolysis.
    tier: 0
    source_domain: biology_ch14
  dna_polymerase:
    defines: An enzyme that adds nucleotides one-by-one in the 5' to 3' direction
      to a growing DNA strand complementary to a template.
    tier: 0
    source_domain: biology_ch14
  nucleotide_triplet:
    defines: A group of three consecutive nucleotides, the basic unit by which nucleic
      acid sequence is read during transcription and translation.
    tier: 0
    source_domain: biology_ch15
  gene_expression:
    defines: The process of turning on a gene to produce RNA and protein, controlled
      by internal chemical mechanisms.
    tier: 0
    source_domain: biology_ch16
  transcription:
    defines: The synthesis of RNA from a DNA template.
    tier: 0
    source_domain: biology_ch16
  operon:
    defines: A collection of genes involved in a pathway that are transcribed together
      as a single mRNA in prokaryotic cells.
    tier: 0
    source_domain: biology_ch16
  repressor:
    defines: A protein that binds to the operator of prokaryotic genes to prevent
      transcription.
    tier: 0
    source_domain: biology_ch16
  activator:
    defines: A protein that binds to prokaryotic promoters to increase transcription.
    tier: 0
    source_domain: biology_ch16
  inducer:
    defines: A small molecule that either activates or represses transcription depending
      on cellular needs.
    tier: 0
    source_domain: biology_ch16
  transcription_factor:
    defines: A protein that binds to DNA at the promoter or enhancer region and influences
      transcription of a gene.
    tier: 0
    source_domain: biology_ch16
  dna_rna_structure:
    defines: Nucleic acids are macromolecules made of nucleotides (sugar, phosphate,
      nitrogenous base) linked by phosphodiester bonds, with DNA having two complementary
      strands and RNA leaving the nucleus.
    tier: 0
    source_domain: biology_ch17
  genome:
    defines: The entire set of DNA molecules present in the nucleus of an organism.
    tier: 0
    source_domain: biology_ch17
  restriction_endonuclease:
    defines: An enzyme that recognizes specific DNA sequences and cuts them in a predictable
      manner, often producing sticky ends.
    tier: 0
    source_domain: biology_ch17
  plasmid:
    defines: A small circular DNA molecule that replicates independently of chromosomal
      DNA and can serve as a vector for foreign DNA.
    tier: 0
    source_domain: biology_ch17
  genetic_recombination:
    defines: The exchange of DNA between homologous chromosome pairs through crossing
      over, underlying linkage analysis.
    tier: 0
    source_domain: biology_ch17
  heritable_variation:
    defines: Genetic differences among individuals in a population that can be passed
      from parent to offspring.
    tier: 0
    source_domain: biology_ch18
  allele:
    defines: A variant form of a gene that codes for a particular trait associated
      with a character.
    tier: 0
    source_domain: biology_ch19
  phylogeny:
    defines: The evolutionary history and relationship of an organism or group of
      organisms.
    tier: 0
    source_domain: biology_ch20
  branch_point:
    defines: The point on a phylogenetic tree where a single lineage splits into two
      or more distinct new lineages.
    tier: 0
    source_domain: biology_ch20
  taxonomy:
    defines: The science of classifying organisms using a hierarchical model with
      internationally shared classification systems.
    tier: 0
    source_domain: biology_ch20
  taxon:
    defines: A single named level or group within the taxonomic classification system.
    tier: 0
    source_domain: biology_ch20
  homology:
    defines: Similarity in form and genetics between organisms resulting from shared
      evolutionary ancestry.
    tier: 0
    source_domain: biology_ch20
  analogy:
    defines: Similar characteristics that arise from similar environmental constraints
      rather than close evolutionary relationship.
    tier: 0
    source_domain: biology_ch20
  virus:
    defines: A noncellular, obligate intracellular parasitic entity consisting of
      a nucleic acid genome surrounded by a protein capsid, lacking independent metabolism
      or the ability to divide by cell division.
    tier: 0
    source_domain: biology_ch21
  virion:
    defines: A single, complete virus particle existing outside a host cell, consisting
      of a nucleic acid core, protein capsid, and sometimes an envelope.
    tier: 0
    source_domain: biology_ch21
  viral_genome:
    defines: The total genetic content of a virus, which may be DNA or RNA, single-
      or double-stranded, linear or circular, and segmented or non-segmented.
    tier: 0
    source_domain: biology_ch21
  prion:
    defines: An infectious, proteinaceous particle lacking nucleic acid that causes
      disease by converting normal host protein (PrPc) into a misfolded infectious
      form (PrPsc).
    tier: 0
    source_domain: biology_ch21
  viroid:
    defines: A small, single-stranded, circular RNA plant pathogen that lacks a capsid
      and does not encode any proteins.
    tier: 0
    source_domain: biology_ch21
  prokaryote:
    defines: A unicellular organism (domain Bacteria or Archaea) that lacks a nucleus
      and other membrane-bound organelles.
    tier: 0
    source_domain: biology_ch22
  hydrothermal_vent:
    defines: A fissure in Earth's surface that releases geothermally heated water,
      providing an early energy source for microbial mats.
    tier: 0
    source_domain: biology_ch22
  culturing_prokaryotes:
    defines: The laboratory technique of growing prokaryotes in a medium containing
      needed nutrients, pioneered by Robert Koch, used to identify and study organisms.
    tier: 0
    source_domain: biology_ch22
  binary_fission:
    defines: The asexual reproductive process in prokaryotes in which the circular
      chromosome is replicated and the cell divides into two identical clones.
    tier: 0
    source_domain: biology_ch22
  macronutrients_micronutrients:
    defines: Elements required by prokaryotes in large amounts versus trace amounts
      for growth and enzyme function.
    tier: 0
    source_domain: biology_ch22
  pathogen:
    defines: A bacterium or other infectious agent that causes harm or disease to
      its host.
    tier: 0
    source_domain: biology_ch22
    also_in:
    - biology_ch42
  disease_epidemiology_terms:
    defines: Terms describing disease occurrence patterns in populations, ranging
      from endemic to epidemic to pandemic.
    tier: 0
    source_domain: biology_ch22
  domain_classification:
    defines: Organisms are classified into three domains — Archaea, Bacteria, and
      Eukarya — based on cellular organization and ancestry.
    tier: 0
    source_domain: biology_ch23
  flagella_cilia:
    defines: Whip-like or hair-like organelles built from cytoskeletal elements that
      provide cell motility.
    tier: 0
    source_domain: biology_ch23
  histone_chromosomes:
    defines: Linear DNA molecules coiled around basic histone proteins to form eukaryotic
      chromosomes.
    tier: 0
    source_domain: biology_ch23
  prokaryotic_metabolism:
    defines: Metabolic processes, including oxygenic photosynthesis and aerobic respiration,
      that arose in prokaryotes such as cyanobacteria and alpha-proteobacteria before
      being inherited by eukaryotes.
    tier: 0
    source_domain: biology_ch23
  fungus:
    defines: A eukaryotic, heterotrophic organism with chitin cell walls that absorbs
      nutrients externally, distinct from plants and animals.
    tier: 0
    source_domain: biology_ch24
  eukaryotic_cell_structure:
    defines: Fungal cells contain a membrane-bound nucleus, mitochondria, endoplasmic
      reticulum, and Golgi apparatus, but lack chloroplasts.
    tier: 0
    source_domain: biology_ch24
  chitin_cell_wall:
    defines: A rigid fungal cell wall composed of chitin and glucans that provides
      structural support and protection.
    tier: 0
    source_domain: biology_ch24
  heterotrophic_nutrition:
    defines: Fungi obtain carbon and energy from complex organic compounds rather
      than photosynthesis, digesting externally via exoenzymes before absorbing nutrients.
    tier: 0
    source_domain: biology_ch24
  hypha:
    defines: A single fungal filament, either septate or coenocytic, that is the basic
      structural unit of multicellular fungi.
    tier: 0
    source_domain: biology_ch24
  septum:
    defines: A perforated or solid endwall dividing a hypha into separate cells, allowing
      or restricting flow of nutrients between cells.
    tier: 0
    source_domain: biology_ch24
  spore:
    defines: A haploid reproductive cell produced by fungi that can undergo mitosis
      to form a new multicellular haploid individual.
    tier: 0
    source_domain: biology_ch24
  plasmogamy:
    defines: The fusion of cytoplasm from two haploid fungal cells, producing a dikaryotic
      stage without nuclear fusion.
    tier: 0
    source_domain: biology_ch24
  karyogamy:
    defines: The fusion of two haploid nuclei to form a diploid zygote nucleus, following
      plasmogamy in fungal sexual reproduction.
    tier: 0
    source_domain: biology_ch24
  archaeplastida:
    defines: A protist supergroup including red algae, green algae, and land plants,
      united by shared photosynthetic ancestry.
    tier: 0
    source_domain: biology_ch25
  green_algae:
    defines: Photosynthetic Archaeplastida (chlorophytes and charophytes) sharing
      chlorophyll a/b, carotenoids, starch storage, and cellulose walls with land
      plants.
    tier: 0
    source_domain: biology_ch25
  desiccation:
    defines: The drying out of tissues exposed to air, the central survival challenge
      plants faced in colonizing land.
    tier: 0
    source_domain: biology_ch25
  gametophyte:
    defines: The multicellular haploid phase of a plant life cycle that produces gametes
      by mitosis.
    tier: 0
    source_domain: biology_ch25
    also_in:
    - biology_ch26
    - biology_ch32
  sporophyte:
    defines: The multicellular diploid phase of a plant life cycle, arising from the
      zygote, that produces spores by meiosis.
    tier: 0
    source_domain: biology_ch25
    also_in:
    - biology_ch26
    - biology_ch32
  gametangium:
    defines: A structure on the gametophyte (antheridium or archegonium) in which
      gametes are produced by mitosis.
    tier: 0
    source_domain: biology_ch25
  sporangium:
    defines: A reproductive sac on the sporophyte in which diploid sporocytes undergo
      meiosis to form haploid spores.
    tier: 0
    source_domain: biology_ch25
  sporopollenin:
    defines: A tough, degradation-resistant polymer that forms the thick walls of
      spores and pollen grains.
    tier: 0
    source_domain: biology_ch25
  apical_meristem:
    defines: A zone of mitotically active, undifferentiated cells at shoot and root
      tips that drives plant elongation.
    tier: 0
    source_domain: biology_ch25
  lignin:
    defines: A rigid, hydrophobic polymer incorporated into cell walls that provides
      mechanical support and waterproofing.
    tier: 0
    source_domain: biology_ch25
  cuticle:
    defines: A waterproof covering on leaves and stems that resists desiccation.
    tier: 0
    source_domain: biology_ch25
  heterospory:
    defines: The production of two distinct spore types—megaspores (female) and microspores
      (male)—by a single sporophyte, characteristic of all seed plants.
    tier: 0
    source_domain: biology_ch26
  eukaryotic_multicellular_heterotroph:
    defines: Eukaryotic, multicellular, heterotrophic organization distinguishing
      animals from autotrophs
    tier: 0
    source_domain: biology_ch27
  differentiated_tissue:
    defines: Specialized tissue types carrying out specific functions, distinguishing
      Eumetazoa
    tier: 0
    source_domain: biology_ch27
  fertilization_and_zygote:
    defines: Combination of haploid gametes to produce a diploid zygote, starting
      embryonic development
    tier: 0
    source_domain: biology_ch27
  body_symmetry:
    defines: Arrangement of body parts as asymmetrical, radial, or bilateral
    tier: 0
    source_domain: biology_ch27
    also_in:
    - biology_ch33
  phylogeny_and_evidence:
    defines: Study of evolutionary branching relationships informed by morphological,
      fossil, and molecular data
    tier: 0
    source_domain: biology_ch27
  geologic_time_periods:
    defines: Sequential geological periods used to date animal origins (Cryogenian,
      Ediacaran, Cambrian)
    tier: 0
    source_domain: biology_ch27
  invertebrate:
    defines: An animal that lacks a cranium and a defined vertebral column or spine,
      comprising about 97 percent of animal species.
    tier: 0
    source_domain: biology_ch28
  choanocyte:
    defines: A flagellated "collar cell" lining sponge feeding chambers that generates
      water current and traps food by phagocytosis.
    tier: 0
    source_domain: biology_ch28
  diploblastic:
    defines: Development from two embryonic germ layers, ectoderm and endoderm, characteristic
      of cnidarians.
    tier: 0
    source_domain: biology_ch28
  cnidocyte:
    defines: A specialized stinging cell containing a nematocyst used by cnidarians
      to capture prey and deter predators.
    tier: 0
    source_domain: biology_ch28
  triploblastic_bilateral:
    defines: Development from three germ layers producing an animal divisible into
      superficially symmetrical left and right sides.
    tier: 0
    source_domain: biology_ch28
  protostomy:
    defines: A developmental pattern in which the blastopore becomes the mouth opening
      of the alimentary canal.
    tier: 0
    source_domain: biology_ch28
  lophophore_trochophore:
    defines: A ciliated tentacle feeding structure or a free-swimming ciliated larva
      characteristic of many lophotrochozoans.
    tier: 0
    source_domain: biology_ch28
  metamerism:
    defines: Repetition of internal and external body structures in a series of segments,
      allowing efficient growth and movement.
    tier: 0
    source_domain: biology_ch28
  cuticle_ecdysis:
    defines: A tough, protective exoskeleton periodically shed and replaced through
      the molting process called ecdysis.
    tier: 0
    source_domain: biology_ch28
  deuterostome_development:
    defines: A developmental pattern featuring radial, indeterminate cleavage and
      enterocoelom formation, distinguishing deuterostomes from protostomes.
    tier: 0
    source_domain: biology_ch28
  notochord:
    defines: A flexible, rod-shaped mesodermal support structure found in the embryonic
      stage of all chordates and in the adult stage of some.
    tier: 0
    source_domain: biology_ch29
  dorsal_hollow_nerve_cord:
    defines: A hollow, tubular nerve structure derived from ectoderm, located dorsal
      to the notochord in chordates.
    tier: 0
    source_domain: biology_ch29
  pharyngeal_slits:
    defines: Openings in the pharynx that extend to the outside environment, used
      for feeding or gas exchange in chordates.
    tier: 0
    source_domain: biology_ch29
  post_anal_tail:
    defines: A muscular, posterior elongation of the body extending beyond the anus,
      found in chordates.
    tier: 0
    source_domain: biology_ch29
  endostyle:
    defines: A ciliated, mucus-producing strip of tissue in the pharynx floor that
      traps food and is homologous to the vertebrate thyroid gland.
    tier: 0
    source_domain: biology_ch29
  cranium:
    defines: A bony, cartilaginous, or fibrous structure surrounding the brain, jaw,
      and facial bones, defining the clade Craniata.
    tier: 0
    source_domain: biology_ch29
  lateral_line_system:
    defines: A sensory organ system running along a fish's body that detects movement
      and vibration in surrounding water.
    tier: 0
    source_domain: biology_ch29
  temporal_fenestrae:
    defines: Post-orbital skull openings whose number distinguishes anapsids, synapsids,
      and diapsids.
    tier: 0
    source_domain: biology_ch29
  ectothermy_endothermy:
    defines: Two strategies of body temperature regulation—relying on environmental
      heat versus internally generated metabolic heat.
    tier: 0
    source_domain: biology_ch29
  feathers:
    defines: Keratinous integumentary structures unique to birds (and their dinosaur
      ancestors) providing insulation and enabling flight.
    tier: 0
    source_domain: biology_ch29
  hair:
    defines: A keratin-based integumentary structure characteristic of mammals, providing
      insulation, sensation, and signaling.
    tier: 0
    source_domain: biology_ch29
  mammary_glands:
    defines: Modified skin glands in mammals that produce milk to nourish newborn
      offspring.
    tier: 0
    source_domain: biology_ch29
  plant_cell_structures:
    defines: Plant cells contain organelles including cell walls, plastids, and a
      large central vacuole, which are not found in animal cells.
    tier: 0
    source_domain: biology_ch30
  shoot_system:
    defines: The aboveground organ system of a plant consisting of vegetative parts
      (leaves, stems) and reproductive parts (flowers, fruits).
    tier: 0
    source_domain: biology_ch30
  root_system:
    defines: The usually underground organ system that anchors the plant and absorbs
      water and minerals.
    tier: 0
    source_domain: biology_ch30
  meristematic_tissue:
    defines: Plant tissue of undifferentiated or incompletely differentiated cells
      located in meristems that continuously divide and drive growth.
    tier: 0
    source_domain: biology_ch30
  parenchyma_cell:
    defines: The most common plant cell type, responsible for metabolic functions
      such as photosynthesis and starch storage.
    tier: 0
    source_domain: biology_ch30
  collenchyma_cell:
    defines: Elongated, living plant cells with unevenly thickened walls that provide
      structural support to stems and leaves.
    tier: 0
    source_domain: biology_ch30
  sclerenchyma_cell:
    defines: Plant cells with lignified secondary walls, often dead at maturity, that
      provide structural support (fibers and sclereids).
    tier: 0
    source_domain: biology_ch30
  water_potential:
    defines: A measure of the potential energy of water, expressed relative to pure
      water, determined by solute, pressure, gravity, and matric components.
    tier: 0
    source_domain: biology_ch30
  phytochrome_system:
    defines: A photoreceptor system with interconvertible Pr and Pfr forms that mediates
      plant responses to red and far-red light, such as germination and flowering
      timing.
    tier: 0
    source_domain: biology_ch30
  plant_hormones:
    defines: Chemical messengers (auxins, cytokinins, gibberellins, abscisic acid,
      ethylene, and others) that regulate plant growth, development, and stress responses.
    tier: 0
    source_domain: biology_ch30
  plant_nutrient:
    defines: An essential substance, organic or inorganic, that plant cells require
      to sustain life and complete their biochemical functions.
    tier: 0
    source_domain: biology_ch31
  organic_compound:
    defines: A chemical compound that contains carbon and is made by a living organism,
      such as carbohydrates, lipids, proteins, and nucleic acids.
    tier: 0
    source_domain: biology_ch31
  inorganic_compound:
    defines: A chemical compound that does not contain carbon (except CO2) and is
      not part of, or produced by, a living organism.
    tier: 0
    source_domain: biology_ch31
  soil:
    defines: The outer loose layer covering the surface of Earth that serves as a
      natural medium for land plants, supplying water and inorganic nutrients.
    tier: 0
    source_domain: biology_ch31
  parent_material:
    defines: The organic and inorganic material, such as weathered bedrock or transported
      sediment, from which soil forms.
    tier: 0
    source_domain: biology_ch31
  exoskeleton_endoskeleton:
    defines: External or internal hard support structures that constrain and enable
      animal size, shape, and movement.
    tier: 0
    source_domain: biology_ch33
  atp_energy_storage:
    defines: The short-term (ATP), medium-term (glycogen), and long-term (triglyceride)
      forms in which animals store energy obtained from food.
    tier: 0
    source_domain: biology_ch33
  epithelial_tissue:
    defines: Tissue that covers the outside of organs and lines organ lumens in single
      or multiple layers of cells.
    tier: 0
    source_domain: biology_ch33
  connective_tissue:
    defines: Tissue made up of living cells embedded in a nonliving matrix of ground
      substance and protein fibers.
    tier: 0
    source_domain: biology_ch33
  muscle_tissue:
    defines: Contractile tissue of the animal body, classified as smooth, skeletal,
      or cardiac based on striations, nuclei, and control.
    tier: 0
    source_domain: biology_ch33
  nervous_tissue:
    defines: Tissue made of neurons and glial cells specialized to receive and transmit
      electrical impulses.
    tier: 0
    source_domain: biology_ch33
  heat_exchange_mechanisms:
    defines: The four physical mechanisms (radiation, evaporation, convection, and
      conduction) by which heat moves between an animal and its environment.
    tier: 0
    source_domain: biology_ch33
  dietary_classification:
    defines: Animals are classified by diet as herbivores (plant-eaters), carnivores
      (meat-eaters), or omnivores (both).
    tier: 0
    source_domain: biology_ch34
  ingestion:
    defines: The act of taking in food through the mouth.
    tier: 0
    source_domain: biology_ch34
  digestion:
    defines: The mechanical and chemical breakdown of food into small organic fragments.
    tier: 0
    source_domain: biology_ch34
  absorption:
    defines: The cellular uptake of nutrients from digested food across the digestive
      epithelium into the bloodstream.
    tier: 0
    source_domain: biology_ch34
  elimination:
    defines: The removal of undigested food content and waste products from the body.
    tier: 0
    source_domain: biology_ch34
  peristalsis:
    defines: Wave-like smooth muscle contractions that propel food through the digestive
      tract.
    tier: 0
    source_domain: biology_ch34
  sphincter:
    defines: A ring-like band of muscle that forms a valve controlling movement of
      material between segments of the digestive tract.
    tier: 0
    source_domain: biology_ch34
  vitamin:
    defines: An organic molecule required in small quantities as a coenzyme for many
      enzyme functions.
    tier: 0
    source_domain: biology_ch34
  mineral:
    defines: An inorganic essential nutrient that serves structural and regulatory
      roles.
    tier: 0
    source_domain: biology_ch34
  hormone:
    defines: A chemical messenger released by endocrine cells to regulate digestive
      processes.
    tier: 0
    source_domain: biology_ch34
    also_in:
    - biology_ch37
  neuron:
    defines: A specialized cell that can receive and transmit electrical or chemical
      signals, forming the basic signaling unit of the nervous system.
    tier: 0
    source_domain: biology_ch35
  glia:
    defines: Non-neuronal cells that provide support functions for neurons, including
      nutrient supply, structural support, myelination, and waste removal.
    tier: 0
    source_domain: biology_ch35
  ion_channel:
    defines: A membrane-spanning protein that allows ions to pass into or out of a
      neuron, including voltage-gated channels.
    tier: 0
    source_domain: biology_ch35
  meninges_csf:
    defines: The three protective membrane layers covering the CNS and the cerebrospinal
      fluid that cushions and circulates within it.
    tier: 0
    source_domain: biology_ch35
  stimulus:
    defines: A physical or chemical signal (light, sound, chemical, pressure, temperature)
      in the internal or external environment that can activate a sensory receptor.
    tier: 0
    source_domain: biology_ch36
  sensory_receptor:
    defines: A specialized neuron or associated cell modified to detect a specific
      type of stimulus.
    tier: 0
    source_domain: biology_ch36
  receptive_field:
    defines: The region in space in which a given sensory receptor can respond to
      a stimulus.
    tier: 0
    source_domain: biology_ch36
  mechanoreceptor:
    defines: A sensory receptor that senses stimuli through physical deformation of
      its plasma membrane via mechanically gated ion channels.
    tier: 0
    source_domain: biology_ch36
  thermoreceptor:
    defines: A receptor activated by changes in temperature, located in the dermis,
      skeletal muscles, liver, and hypothalamus.
    tier: 0
    source_domain: biology_ch36
  chemoreceptor:
    defines: A receptor that transduces chemical stimuli, underlying both taste and
      smell.
    tier: 0
    source_domain: biology_ch36
  sound_wave:
    defines: A mechanical pressure wave traveling through a medium, characterized
      by frequency (pitch) and amplitude (volume).
    tier: 0
    source_domain: biology_ch36
  hair_cell:
    defines: A mechanoreceptor bearing stereocilia that transduces mechanical bending
      into an electrical signal, used in both hearing and vestibular sensation.
    tier: 0
    source_domain: biology_ch36
  light_wave:
    defines: Electromagnetic radiation that needs no medium to travel, whose wavelength
      manifests as hue and amplitude as brightness.
    tier: 0
    source_domain: biology_ch36
  photoreceptor:
    defines: Retinal receptor cells (rods for dim-light achromatic vision and cones
      for bright-light color vision) that transduce light into neural signals.
    tier: 0
    source_domain: biology_ch36
  endocrine_gland:
    defines: A gland that secretes hormones into interstitial fluid, which diffuse
      into blood and travel to target organs and tissues.
    tier: 0
    source_domain: biology_ch37
  target_cell:
    defines: A cell that possesses a receptor for a specific hormone and therefore
      responds to it.
    tier: 0
    source_domain: biology_ch37
  negative_feedback:
    defines: A control mechanism in which rising hormone levels inhibit further release
      of that hormone, keeping blood concentrations within a narrow range.
    tier: 0
    source_domain: biology_ch37
  hydrostatic_skeleton:
    defines: A fluid-filled compartment under pressure that supports the body and,
      via surrounding muscle contraction, produces movement.
    tier: 0
    source_domain: biology_ch38
  exoskeleton:
    defines: A hard external encasement that protects, supports, and allows movement
      through muscles attached to its interior.
    tier: 0
    source_domain: biology_ch38
  endoskeleton:
    defines: A skeleton of hard, mineralized structures within soft tissue that supports,
      protects, and enables movement.
    tier: 0
    source_domain: biology_ch38
  bone_tissue:
    defines: A connective tissue of specialized cells and mineralized collagen matrix
      constituting the endoskeleton.
    tier: 0
    source_domain: biology_ch38
  joint:
    defines: The point where two or more bones meet, responsible for movement or stability.
    tier: 0
    source_domain: biology_ch38
  muscle_tissue_types:
    defines: The three muscle tissue types (skeletal, cardiac, smooth) distinguished
      by structure, control, and location.
    tier: 0
    source_domain: biology_ch38
  actin_myosin_filaments:
    defines: The contractile proteins forming thin (actin) and thick (myosin) myofilaments
      that interact to produce muscle contraction.
    tier: 0
    source_domain: biology_ch38
  membrane_action_potential:
    defines: The electrical charge gradient across a cell membrane and its depolarization/repolarization
      cycle that propagates a signal.
    tier: 0
    source_domain: biology_ch38
  gas_exchange:
    defines: The process by which oxygen and carbon dioxide are exchanged between
      an organism and its environment or between blood and tissues.
    tier: 0
    source_domain: biology_ch39
  lung_volume:
    defines: A measurement of the amount of air associated with one respiratory function,
      such as a single inhalation or exhalation.
    tier: 0
    source_domain: biology_ch39
  partial_pressure:
    defines: The pressure exerted by an individual gas within a mixture of gases,
      proportional to its concentration in the mixture.
    tier: 0
    source_domain: biology_ch39
  boyles_law:
    defines: The gas law stating that pressure and volume of a gas are inversely related
      in a closed space.
    tier: 0
    source_domain: biology_ch39
  pleura:
    defines: The tissue layers (visceral and parietal) surrounding the lung and lining
      the thoracic cavity, with fluid between them reducing friction during breathing.
    tier: 0
    source_domain: biology_ch39
  respiratory_rate:
    defines: The number of breaths taken per minute.
    tier: 0
    source_domain: biology_ch39
  hemoglobin:
    defines: A four-subunit, iron-containing protein in red blood cells that reversibly
      binds up to four oxygen molecules for transport.
    tier: 0
    source_domain: biology_ch39
  diffusion_gas_exchange:
    defines: The movement of water, nutrients, waste, and gases directly across cell
      layers without a circulatory system, sufficient for simple animals only a few
      cell layers thick.
    tier: 0
    source_domain: biology_ch40
  hemolymph_interstitial_fluid:
    defines: Hemolymph is the fluid formed when blood mixes with interstitial fluid
      in open circulatory systems, whereas interstitial fluid is the fluid surrounding
      cells that remains separate from blood in closed systems.
    tier: 0
    source_domain: biology_ch40
  blood_composition:
    defines: Blood is composed of plasma and cellular components (red blood cells,
      white blood cells, platelets), roughly 55% plasma and 45% cells in humans.
    tier: 0
    source_domain: biology_ch40
  hemoglobin_respiratory_pigments:
    defines: Iron-containing hemoglobin binds and transports oxygen (and some carbon
      dioxide) within red blood cells; other organisms use alternative pigments such
      as hemocyanin, chlorocruorin, and hemerythrin.
    tier: 0
    source_domain: biology_ch40
  heart_wall_layers:
    defines: The three tissue layers composing the heart wall—endocardium, myocardium,
      and epicardium—surrounded by the pericardium.
    tier: 0
    source_domain: biology_ch40
  cardiomyocytes:
    defines: Specialized, striated heart muscle cells connected by intercalated disks
      that contract rhythmically and involuntarily.
    tier: 0
    source_domain: biology_ch40
  electrolyte:
    defines: A solute that dissociates into ions when dissolved in water.
    tier: 0
    source_domain: biology_ch41
  non_electrolyte:
    defines: A solute that does not dissociate into ions when dissolved in water.
    tier: 0
    source_domain: biology_ch41
  semi_permeable_membrane:
    defines: A membrane that is permeable to certain solutes and water but not others.
    tier: 0
    source_domain: biology_ch41
  passive_diffusion:
    defines: Movement of water or solutes across a membrane without requiring energy
      input.
    tier: 0
    source_domain: biology_ch41
  mole_molarity_molality:
    defines: Units for expressing solute quantity (mole) and concentration (molarity
      per liter of solution, molality per kilogram of solvent).
    tier: 0
    source_domain: biology_ch41
  kidney:
    defines: The main osmoregulatory organ that filters blood and purifies it, producing
      urine.
    tier: 0
    source_domain: biology_ch41
  nitrogenous_waste:
    defines: Toxic waste products, primarily ammonia, generated from the breakdown
      of nitrogen-containing macromolecules like proteins and nucleic acids.
    tier: 0
    source_domain: biology_ch41
  osmoregulatory_hormones:
    defines: Chemical messengers secreted into the bloodstream that act on the kidneys
      and vasculature to regulate osmotic balance and blood pressure.
    tier: 0
    source_domain: biology_ch41
  antigen:
    defines: A foreign or "non-self" macromolecule that reacts with cells of the immune
      system and can trigger an immune response.
    tier: 0
    source_domain: biology_ch42
  innate_immunity:
    defines: Immunity that occurs naturally because of genetic factors or physiology
      and is not induced by infection or vaccination.
    tier: 0
    source_domain: biology_ch42
  pamp:
    defines: Carbohydrate, polypeptide, and nucleic acid "signatures" expressed by
      pathogens but not by host cells.
    tier: 0
    source_domain: biology_ch42
  phagocyte:
    defines: An immune cell type that engulfs and digests pathogens and debris through
      phagocytosis.
    tier: 0
    source_domain: biology_ch42
  cytokine:
    defines: A chemical messenger that regulates cell differentiation, proliferation,
      gene expression, and trafficking to affect immune responses.
    tier: 0
    source_domain: biology_ch42
  mhc_molecules:
    defines: Surface proteins that display antigen fragments to immune cells, signaling
      health status or presenting foreign antigen.
    tier: 0
    source_domain: biology_ch42
  ecology:
    defines: The study of the interactions of living organisms with their environment.
    tier: 0
    source_domain: biology_ch44
    also_in:
    - biology_ch45
  abiotic_factors:
    defines: The nonliving components of the environment, such as air, water, soil,
      temperature, and light.
    tier: 0
    source_domain: biology_ch44
  biotic_factors:
    defines: The living components of the environment.
    tier: 0
    source_domain: biology_ch44
  climate_vs_weather:
    defines: The distinction between climate, the long-term predictable atmospheric
      conditions of an area, and weather, short-term atmospheric conditions.
    tier: 0
    source_domain: biology_ch44
  energy_budget:
    defines: The allocation of an organism's limited energy among metabolism, growth,
      reproduction, parental care, and storage.
    tier: 0
    source_domain: biology_ch45
  behavior:
    defines: A change in an organism's activity in response to a stimulus.
    tier: 0
    source_domain: biology_ch45
  trophic_level:
    defines: The position of a species or group of species in a food chain or food
      web.
    tier: 0
    source_domain: biology_ch46
  autotroph:
    defines: An organism capable of synthesizing its own food using sunlight (photoautotroph)
      or inorganic molecules (chemoautotroph) as an energy source.
    tier: 0
    source_domain: biology_ch46
  biomass:
    defines: The total mass, in a unit area at the time of measurement, of living
      or previously living organisms within a trophic level.
    tier: 0
    source_domain: biology_ch46
  biogeochemical_cycle:
    defines: The cycling of inorganic mineral nutrients between living organisms and
      the nonliving (geologic and atmospheric) world.
    tier: 0
    source_domain: biology_ch46
  biodiversity:
    defines: The number of species and their relative abundance in the biosphere,
      estimated at multiple levels of organization.
    tier: 0
    source_domain: biology_ch47
  extinction:
    defines: The disappearance of a species from Earth, a natural macroevolutionary
      process that also occurs at accelerated rates due to human activity.
    tier: 0
    source_domain: biology_ch47
  habitat_loss:
    defines: The elimination or degradation of an ecosystem, which kills or extirpates
      the species that depend on it and is a leading cause of extinction.
    tier: 0
    source_domain: biology_ch47
  overharvesting:
    defines: Unsustainable extraction of organisms, especially aquatic species and
      bush meat, driven partly by the tragedy of the commons.
    tier: 0
    source_domain: biology_ch47
  tragedy_of_the_commons:
    defines: The economic principle that resources held in common, like fisheries,
      will inevitably be overexploited because no individual has incentive to exercise
      restraint.
    tier: 0
    source_domain: biology_ch47
  exotic_species:
    defines: Species intentionally or unintentionally introduced into an ecosystem
      in which they did not evolve, often threatening native species through competition,
      predation, or disease.
    tier: 0
    source_domain: biology_ch47
  climate_change_threat:
    defines: Anthropogenic warming that alters regional climates, shifts species ranges,
      disrupts timing adaptations, and is predicted to become a major cause of extinction.
    tier: 0
    source_domain: biology_ch47
concepts:
  natural_science:
    defines: A field of science related to the physical world and its phenomena and
      processes.
    composed_of:
    - science
    tier: 1
    source_domain: biology_ch01
  theory:
    defines: A tested and confirmed explanation for observations or phenomena, often
      arising from a verified hypothesis.
    composed_of:
    - hypothesis
    tier: 1
    source_domain: biology_ch01
  falsifiability:
    defines: The requirement that a valid hypothesis be able to be disproven by experimental
      results.
    composed_of:
    - hypothesis
    tier: 1
    source_domain: biology_ch01
  descriptive_science:
    defines: A usually inductive approach to science that aims to observe, explore,
      and discover.
    composed_of:
    - inductive_reasoning
    - science
    tier: 1
    source_domain: biology_ch01
  hypothesis_based_science:
    defines: A usually deductive approach to science that begins with a specific question
      and a testable potential answer.
    composed_of:
    - deductive_reasoning
    - hypothesis
    tier: 1
    source_domain: biology_ch01
  basic_science:
    defines: Science that seeks to expand knowledge and understanding regardless of
      short-term application.
    composed_of:
    - science
    tier: 1
    source_domain: biology_ch01
  peer_review:
    defines: The process by which colleagues evaluate a scientific paper or grant
      proposal for originality, significance, logic, and thoroughness.
    composed_of:
    - science
    tier: 1
    source_domain: biology_ch01
  properties_of_life:
    defines: The eight shared characteristics that together define a living organism.
    composed_of:
    - biology
    tier: 1
    source_domain: biology_ch01
  molecule:
    defines: A chemical structure consisting of at least two atoms held together by
      one or more chemical bonds.
    composed_of:
    - atom
    tier: 1
    source_domain: biology_ch01
    also_in:
    - biology_ch02
  scientific_method:
    defines: A defined-step method of research involving observation, hypothesis formulation,
      testing, and confirming or falsifying the hypothesis.
    composed_of:
    - hypothesis_based_science
    - falsifiability
    tier: 2
    source_domain: biology_ch01
  applied_science:
    defines: A form of science, aided by basic science findings, that aims to solve
      real-world problems.
    composed_of:
    - basic_science
    tier: 2
    source_domain: biology_ch01
  scientific_paper_structure:
    defines: The standard organization of a peer-reviewed scientific paper into introduction,
      methods, results, and discussion sections.
    composed_of:
    - peer_review
    tier: 2
    source_domain: biology_ch01
  homeostasis:
    defines: The ability of an organism to maintain a relatively stable internal environment
      despite external changes.
    composed_of:
    - properties_of_life
    tier: 2
    source_domain: biology_ch01
    also_in:
    - biology_ch33
    - biology_ch34
  evolution:
    defines: The process of gradual change in a population or species over time, driven
      by mutations and natural selection.
    composed_of:
    - properties_of_life
    tier: 2
    source_domain: biology_ch01
    also_in:
    - biology_ch19
  macromolecule:
    defines: A large molecule, such as DNA, typically formed by polymerization of
      smaller monomer units.
    composed_of:
    - molecule
    tier: 2
    source_domain: biology_ch01
  control_group:
    defines: The part of an experiment that contains every feature of the experimental
      group except the manipulation being tested.
    composed_of:
    - variable
    - scientific_method
    tier: 3
    source_domain: biology_ch01
  adaptation:
    defines: A "fit" between an organism and its environment that results from evolution
      by natural selection.
    composed_of:
    - evolution
    tier: 3
    source_domain: biology_ch01
    also_in:
    - biology_ch18
  organelle:
    defines: A small membrane-bound structure within a cell that carries out a specific
      cellular function.
    composed_of:
    - macromolecule
    tier: 3
    source_domain: biology_ch01
  cell:
    defines: The smallest fundamental unit of structure and function in living organisms.
    composed_of:
    - organelle
    tier: 4
    source_domain: biology_ch01
    also_in:
    - biology_ch04
  prokaryote_eukaryote:
    defines: The classification of cells as prokaryotes or eukaryotes.
    composed_of:
    - cell
    tier: 5
    source_domain: biology_ch01
  tissue:
    defines: A group of similar cells carrying out related functions.
    composed_of:
    - cell
    tier: 5
    source_domain: biology_ch01
  organ:
    defines: A collection of related tissues grouped together to perform a common
      function.
    composed_of:
    - tissue
    tier: 6
    source_domain: biology_ch01
  organ_system:
    defines: A level of organization consisting of functionally related, interacting
      organs.
    composed_of:
    - organ
    tier: 7
    source_domain: biology_ch01
  organism:
    defines: An individual living entity.
    composed_of:
    - organ_system
    tier: 8
    source_domain: biology_ch01
  population:
    defines: All the individuals of a species living within a specific area.
    composed_of:
    - organism
    tier: 9
    source_domain: biology_ch01
    also_in:
    - biology_ch45
  community:
    defines: The sum of populations inhabiting a particular area.
    composed_of:
    - population
    tier: 10
    source_domain: biology_ch01
    also_in:
    - biology_ch45
  ecosystem:
    defines: All the living things in a particular area together with the abiotic
      parts of that environment.
    composed_of:
    - community
    tier: 11
    source_domain: biology_ch01
    also_in:
    - biology_ch46
  biosphere:
    defines: The collection of all ecosystems on Earth.
    composed_of:
    - ecosystem
    tier: 12
    source_domain: biology_ch01
    also_in:
    - biology_ch44
  levels_of_biological_organization:
    defines: The hierarchy of living structure from atom to biosphere.
    composed_of:
    - atom
    - biosphere
    tier: 13
    source_domain: biology_ch01
  atomic_number:
    defines: The number of protons in an atom, used to distinguish one element from
      another.
    composed_of:
    - atom
    - proton
    tier: 1
    source_domain: biology_ch02
  mass_number:
    defines: The total number of protons and neutrons in an atom.
    composed_of:
    - proton
    - neutron
    tier: 1
    source_domain: biology_ch02
  isotope:
    defines: A form of an element that has the same number of protons but a different
      number of neutrons than other forms of that element.
    composed_of:
    - atomic_number
    - mass_number
    tier: 2
    source_domain: biology_ch02
  atomic_weight:
    defines: The calculated mean of the atomic masses of an element's naturally occurring
      isotopes.
    composed_of:
    - isotope
    tier: 3
    source_domain: biology_ch02
  radioisotope:
    defines: An unstable isotope that emits subatomic particles or energy to attain
      a more stable atomic configuration.
    composed_of:
    - isotope
    tier: 3
    source_domain: biology_ch02
  half_life:
    defines: The time it takes for half of the original concentration of a radioactive
      isotope to decay back to its more stable form.
    composed_of:
    - radioisotope
    tier: 4
    source_domain: biology_ch02
  periodic_table:
    defines: An organizational chart that groups elements by atomic number and shared
      chemical and physical properties.
    composed_of:
    - element
    - atomic_number
    tier: 2
    source_domain: biology_ch02
  electron_shell:
    defines: A model describing electrons as occupying discrete energy levels at specific
      distances from the nucleus.
    composed_of:
    - atom
    - electron
    tier: 1
    source_domain: biology_ch02
  electron_orbital:
    defines: The region surrounding the nucleus where an electron is most likely to
      be found, described by quantum mechanical wave functions.
    composed_of:
    - atom
    - electron
    tier: 1
    source_domain: biology_ch02
  electron_configuration:
    defines: The arrangement of electrons among an atom's shells and subshells, such
      as 1s2 2s2 2p6.
    composed_of:
    - electron_shell
    - electron_orbital
    tier: 2
    source_domain: biology_ch02
  valence_shell:
    defines: The outermost electron shell of an atom, whose electrons determine its
      chemical reactivity.
    composed_of:
    - electron_shell
    - electron_configuration
    tier: 3
    source_domain: biology_ch02
  octet_rule:
    defines: The principle that atoms (other than the innermost shell) are most stable
      when they have eight electrons in their valence shell.
    composed_of:
    - valence_shell
    tier: 4
    source_domain: biology_ch02
  chemical_bond:
    defines: An interaction between atoms, formed by donating, accepting, or sharing
      electrons, that results in the formation of molecules.
    composed_of:
    - atom
    - valence_shell
    tier: 4
    source_domain: biology_ch02
  chemical_reaction:
    defines: A process, described by reactants forming products, in which atoms bond
      together or bonded atoms break apart.
    composed_of:
    - chemical_bond
    - molecule
    tier: 6
    source_domain: biology_ch02
  ion:
    defines: An atom or chemical group with an unequal number of protons and electrons,
      giving it a net charge.
    composed_of:
    - atom
    - proton
    - electron
    tier: 1
    source_domain: biology_ch02
  ionic_bond:
    defines: A chemical bond that forms between ions of opposite charge, such as a
      cation and an anion.
    composed_of:
    - ion
    - chemical_bond
    tier: 5
    source_domain: biology_ch02
  covalent_bond:
    defines: A strong bond formed when two atoms share one or more pairs of electrons
      to satisfy the octet rule.
    composed_of:
    - octet_rule
    - chemical_bond
    tier: 5
    source_domain: biology_ch02
  electronegativity:
    defines: The ability of an atom to attract shared electrons toward its own nucleus,
      creating partial charges in a bond.
    composed_of:
    - covalent_bond
    tier: 6
    source_domain: biology_ch02
  polar_covalent_bond:
    defines: A covalent bond in which electrons are shared unequally between atoms,
      producing partial positive and negative charges.
    composed_of:
    - covalent_bond
    - electronegativity
    tier: 7
    source_domain: biology_ch02
  nonpolar_covalent_bond:
    defines: A covalent bond in which electrons are shared equally between atoms of
      the same or similar electronegativity.
    composed_of:
    - covalent_bond
    - electronegativity
    tier: 7
    source_domain: biology_ch02
  hydrogen_bond:
    defines: A weak attraction between a slightly positively charged hydrogen atom
      and a slightly negatively charged atom in another (or the same) molecule.
    composed_of:
    - polar_covalent_bond
    tier: 8
    source_domain: biology_ch02
  van_der_waals_interaction:
    defines: A very weak attraction between molecules arising from temporary fluctuations
      in electron density.
    composed_of:
    - molecule
    tier: 6
    source_domain: biology_ch02
  water_polarity:
    defines: The property of the water molecule whereby unequal electron sharing gives
      oxygen a partial negative charge and hydrogen a partial positive charge.
    composed_of:
    - polar_covalent_bond
    - molecule
    tier: 8
    source_domain: biology_ch02
  specific_heat_capacity:
    defines: The amount of heat one gram of a substance must absorb or lose to change
      its temperature by one degree Celsius; unusually high for water due to hydrogen
      bonding.
    composed_of:
    - hydrogen_bond
    - water_polarity
    tier: 9
    source_domain: biology_ch02
  heat_of_vaporization:
    defines: The amount of energy required to change one gram of a liquid substance
      into a gas, which is high for water because of hydrogen bonding.
    composed_of:
    - hydrogen_bond
    - water_polarity
    tier: 9
    source_domain: biology_ch02
  solvent:
    defines: A substance, such as water, capable of dissolving polar molecules and
      ionic compounds.
    composed_of:
    - water_polarity
    - ionic_bond
    tier: 9
    source_domain: biology_ch02
  sphere_of_hydration:
    defines: The shell of water molecules that surrounds and separates a dissolved
      ion or polar particle.
    composed_of:
    - solvent
    - ion
    tier: 10
    source_domain: biology_ch02
  dissociation:
    defines: The breaking off of atoms or ions from a molecule, such as an ionic compound
      splitting into ions in water.
    composed_of:
    - sphere_of_hydration
    - ionic_bond
    tier: 11
    source_domain: biology_ch02
  cohesion:
    defines: The attraction between water molecules to one another due to hydrogen
      bonding, producing surface tension.
    composed_of:
    - hydrogen_bond
    - water_polarity
    tier: 9
    source_domain: biology_ch02
  surface_tension:
    defines: The capacity of a liquid surface to withstand rupture, resulting from
      cohesive forces between molecules.
    composed_of:
    - cohesion
    tier: 10
    source_domain: biology_ch02
  adhesion:
    defines: The attraction between water molecules and other (often charged) molecules
      or surfaces.
    composed_of:
    - hydrogen_bond
    - water_polarity
    tier: 9
    source_domain: biology_ch02
  ph_scale:
    defines: A scale from 0 to 14 that measures the concentration of hydrogen ions
      in a solution as the negative log of that concentration.
    composed_of:
    - ion
    - dissociation
    tier: 12
    source_domain: biology_ch02
  acid:
    defines: A substance that increases the concentration of hydrogen ions (H+) in
      a solution.
    composed_of:
    - ph_scale
    - dissociation
    tier: 13
    source_domain: biology_ch02
  base:
    defines: A substance that provides hydroxide ions or otherwise reduces the hydrogen
      ion concentration of a solution, raising its pH.
    composed_of:
    - ph_scale
    - dissociation
    tier: 13
    source_domain: biology_ch02
  buffer:
    defines: A substance that resists changes in pH by absorbing or releasing hydrogen
      or hydroxide ions.
    composed_of:
    - acid
    - base
    tier: 14
    source_domain: biology_ch02
  carbon_bonding:
    defines: Carbon's ability, due to four electrons in its outer shell, to form up
      to four covalent bonds with other atoms, making it the structural backbone of
      macromolecules.
    composed_of:
    - covalent_bond
    - valence_shell
    tier: 5
    source_domain: biology_ch02
  hydrocarbon:
    defines: An organic molecule composed entirely of carbon and hydrogen atoms.
    composed_of:
    - carbon_bonding
    - molecule
    tier: 6
    source_domain: biology_ch02
  isomer:
    defines: One of two or more molecules that share the same chemical formula but
      differ in the arrangement of their atoms or bonds.
    composed_of:
    - hydrocarbon
    - chemical_bond
    tier: 7
    source_domain: biology_ch02
  structural_isomer:
    defines: An isomer that differs from another in the placement of its covalent
      bonds among the same atoms.
    composed_of:
    - isomer
    - covalent_bond
    tier: 8
    source_domain: biology_ch02
  geometric_isomer:
    defines: An isomer with similar bonding patterns that differs in the spatial arrangement
      of atoms around a double bond, described as cis or trans.
    composed_of:
    - isomer
    - covalent_bond
    tier: 8
    source_domain: biology_ch02
  enantiomer:
    defines: A molecule that shares the same structure and bonds as another but is
      its non-superimposable mirror image.
    composed_of:
    - isomer
    tier: 8
    source_domain: biology_ch02
  functional_group:
    defines: A group of atoms attached to a carbon backbone that confers specific
      chemical properties to a molecule.
    composed_of:
    - carbon_bonding
    - molecule
    tier: 6
    source_domain: biology_ch02
  dehydration_synthesis:
    defines: A reaction that joins two monomers into a polymer by forming a covalent
      bond and releasing a water molecule.
    composed_of:
    - monomer
    tier: 1
    source_domain: biology_ch03
  hydrolysis:
    defines: A reaction that breaks a polymer into monomers by inserting a water molecule
      across a covalent bond.
    composed_of:
    - monomer
    - polymer
    tier: 2
    source_domain: biology_ch03
  polymer:
    defines: A larger molecule formed when monomers join together via covalent bonds.
    composed_of:
    - monomer
    - dehydration_synthesis
    tier: 1
    source_domain: biology_ch03
  glycosidic_bond:
    defines: The covalent bond formed between two monosaccharides during a dehydration
      reaction.
    composed_of:
    - monosaccharide
    - dehydration_synthesis
    tier: 1
    source_domain: biology_ch03
  disaccharide:
    defines: Two monosaccharides joined by a glycosidic bond formed through dehydration
      synthesis.
    composed_of:
    - monosaccharide
    - glycosidic_bond
    tier: 2
    source_domain: biology_ch03
  polysaccharide:
    defines: A long, branched or unbranched chain of monosaccharides linked by glycosidic
      bonds, such as starch, glycogen, cellulose, or chitin.
    composed_of:
    - monosaccharide
    - glycosidic_bond
    - polymer
    tier: 2
    source_domain: biology_ch03
  carbohydrate:
    defines: A biological macromolecule with a carbon-to-hydrogen-to-oxygen ratio
      of 1:2:1 that serves as an energy source and structural support.
    composed_of:
    - biological_macromolecule
    - monosaccharide
    - disaccharide
    - polysaccharide
    tier: 3
    source_domain: biology_ch03
  saturated_unsaturated_fatty_acids:
    defines: Classification of fatty acids based on the absence (saturated) or presence
      (unsaturated) of double bonds in the hydrocarbon chain.
    composed_of:
    - fatty_acid
    tier: 1
    source_domain: biology_ch03
  triacylglycerol:
    defines: A molecule formed from glycerol bonded to three fatty acids via ester
      bonds, releasing three water molecules, serving as long-term energy storage.
    composed_of:
    - fatty_acid
    - dehydration_synthesis
    tier: 1
    source_domain: biology_ch03
  phospholipid:
    defines: An amphipathic lipid composed of two fatty acids and a modified phosphate
      group attached to a glycerol backbone, forming the plasma membrane's bilayer.
    composed_of:
    - fatty_acid
    tier: 1
    source_domain: biology_ch03
    also_in:
    - biology_ch05
  steroid:
    defines: A lipid with a fused four-carbon-ring structure, such as cholesterol,
      that serves as a membrane component and hormone precursor.
    composed_of:
    - lipid
    tier: 2
    source_domain: biology_ch03
  lipid:
    defines: A diverse group of largely nonpolar, hydrophobic macromolecules including
      fats, oils, waxes, phospholipids, and steroids.
    composed_of:
    - biological_macromolecule
    - fatty_acid
    - triacylglycerol
    - phospholipid
    tier: 2
    source_domain: biology_ch03
  peptide_bond:
    defines: The covalent bond formed between the carboxyl group of one amino acid
      and the amino group of another via dehydration synthesis.
    composed_of:
    - amino_acid
    - dehydration_synthesis
    tier: 1
    source_domain: biology_ch03
  protein_structure_levels:
    defines: The four hierarchical levels—primary, secondary, tertiary, and quaternary—that
      determine a protein's overall three-dimensional shape.
    composed_of:
    - amino_acid
    - peptide_bond
    tier: 2
    source_domain: biology_ch03
  protein:
    defines: A biological macromolecule composed of one or more amino acid chains
      that performs diverse structural, regulatory, and catalytic functions.
    composed_of:
    - biological_macromolecule
    - amino_acid
    - peptide_bond
    - protein_structure_levels
    tier: 3
    source_domain: biology_ch03
  nucleic_acid:
    defines: A biological macromolecule composed of nucleotides that carries the cell's
      genetic blueprint and instructions for cellular function.
    composed_of:
    - biological_macromolecule
    - nucleotide
    - polymer
    tier: 2
    source_domain: biology_ch03
  dna_structure:
    defines: The antiparallel double-helical structure of DNA in which sugar-phosphate
      backbones flank complementary, hydrogen-bonded nitrogenous base pairs.
    composed_of:
    - nucleotide
    - nucleic_acid
    tier: 3
    source_domain: biology_ch03
  rna_types_and_function:
    defines: The single-stranded nucleic acid involved in protein synthesis, existing
      as mRNA, rRNA, tRNA, and microRNA, each with distinct roles.
    composed_of:
    - nucleotide
    - nucleic_acid
    tier: 3
    source_domain: biology_ch03
  magnification_and_resolution:
    defines: Magnification is enlarging an object's appearance; resolving power is
      a microscope's ability to distinguish two adjacent structures as separate.
    composed_of:
    - microscope
    tier: 1
    source_domain: biology_ch04
  light_microscope:
    defines: A microscope that uses visible light bent through a lens system to view
      specimens, useful for living organisms but limited in resolution.
    composed_of:
    - microscope
    - magnification_and_resolution
    tier: 2
    source_domain: biology_ch04
  electron_microscope:
    defines: A microscope that uses a beam of electrons instead of light, providing
      higher magnification and resolving power but killing the specimen.
    composed_of:
    - microscope
    - magnification_and_resolution
    tier: 2
    source_domain: biology_ch04
  unified_cell_theory:
    defines: The theory stating that one or more cells comprise all living things,
      the cell is the basic unit of life, and new cells arise from existing cells.
    composed_of:
    - cell
    tier: 1
    source_domain: biology_ch04
  cell_wall:
    defines: A rigid covering external to the plasma membrane that protects the cell,
      provides structural support, and gives it shape.
    composed_of:
    - plasma_membrane
    tier: 1
    source_domain: biology_ch04
    also_in:
    - biology_ch22
    - biology_ch23
  surface_area_to_volume_ratio:
    defines: The relationship explaining why cells must stay small, since volume grows
      faster than surface area as a cell enlarges, limiting diffusion efficiency.
    composed_of:
    - cell
    tier: 1
    source_domain: biology_ch04
  nucleoid:
    defines: The central part of a prokaryotic cell where its chromosomal DNA is located,
      lacking a surrounding membrane.
    composed_of:
    - prokaryotic_cell
    - dna
    tier: 1
    source_domain: biology_ch04
  nuclear_envelope:
    defines: The double-membrane structure that constitutes the nucleus's outermost
      portion and is continuous with the endoplasmic reticulum.
    composed_of:
    - eukaryotic_cell
    - plasma_membrane
    tier: 1
    source_domain: biology_ch04
  nucleus:
    defines: The organelle that houses the cell's DNA and directs the synthesis of
      ribosomes and proteins.
    composed_of:
    - eukaryotic_cell
    - dna
    - nuclear_envelope
    tier: 2
    source_domain: biology_ch04
    also_in:
    - biology_ch23
  chromatin_and_chromosomes:
    defines: Chromosomes are linear DNA structures in the nucleus; chromatin is the
      decondensed protein-DNA complex they form outside of cell division.
    composed_of:
    - nucleus
    - dna
    tier: 3
    source_domain: biology_ch04
  nucleolus:
    defines: A darkly staining region within the nucleus where ribosomal RNA and proteins
      assemble into ribosomal subunits.
    composed_of:
    - nucleus
    - ribosome
    tier: 3
    source_domain: biology_ch04
  mitochondria:
    defines: Double-membrane organelles with their own DNA and ribosomes that carry
      out cellular respiration to produce ATP.
    composed_of:
    - eukaryotic_cell
    - dna
    - ribosome
    tier: 1
    source_domain: biology_ch04
    also_in:
    - biology_ch23
  peroxisome:
    defines: A small, single-membrane organelle that oxidizes fatty acids and amino
      acids and detoxifies poisons.
    composed_of:
    - eukaryotic_cell
    tier: 1
    source_domain: biology_ch04
  vesicle_and_vacuole:
    defines: Membrane-bound sacs that function in storage and transport, with vacuoles
      being somewhat larger than vesicles.
    composed_of:
    - eukaryotic_cell
    - plasma_membrane
    tier: 1
    source_domain: biology_ch04
  central_vacuole:
    defines: A large plant cell organelle that regulates water concentration, supports
      the cell wall, and enables cell expansion.
    composed_of:
    - vesicle_and_vacuole
    tier: 2
    source_domain: biology_ch04
  centrosome:
    defines: A microtubule-organizing region near the nucleus of animal cells containing
      a pair of centrioles.
    composed_of:
    - eukaryotic_cell
    tier: 1
    source_domain: biology_ch04
  lysosome:
    defines: An animal cell organelle that digests macromolecules, recycles worn-out
      organelles, and destroys engulfed pathogens.
    composed_of:
    - eukaryotic_cell
    - vesicle_and_vacuole
    tier: 2
    source_domain: biology_ch04
  chloroplast:
    defines: A plant cell organelle with its own DNA and ribosomes that carries out
      photosynthesis.
    composed_of:
    - eukaryotic_cell
    - dna
    - ribosome
    tier: 1
    source_domain: biology_ch04
    also_in:
    - biology_ch08
  endosymbiosis:
    defines: A mutually beneficial relationship in which one organism lives inside
      another, proposed to explain the origin of mitochondria and chloroplasts from
      ingested bacteria.
    composed_of:
    - mitochondria
    - chloroplast
    tier: 2
    source_domain: biology_ch04
    also_in:
    - biology_ch23
  endoplasmic_reticulum:
    defines: A series of interconnected membranous sacs and tubules, divided into
      rough ER (protein modification) and smooth ER (lipid synthesis and detoxification).
    composed_of:
    - nuclear_envelope
    - eukaryotic_cell
    tier: 2
    source_domain: biology_ch04
  golgi_apparatus:
    defines: A series of flattened membranous sacs that sorts, tags, packages, and
      distributes lipids and proteins received from the ER.
    composed_of:
    - endoplasmic_reticulum
    - vesicle_and_vacuole
    tier: 3
    source_domain: biology_ch04
  endomembrane_system:
    defines: A group of membranes and organelles in eukaryotic cells, including the
      nuclear envelope, ER, Golgi apparatus, lysosomes, vesicles, and plasma membrane,
      that work together to modify, package, and transport lipids and proteins.
    composed_of:
    - nuclear_envelope
    - endoplasmic_reticulum
    - golgi_apparatus
    - lysosome
    - vesicle_and_vacuole
    - plasma_membrane
    tier: 4
    source_domain: biology_ch04
  cytoskeleton:
    defines: A network of protein fibers that maintains a cell's shape, secures organelles,
      and enables movement of cytoplasm, vesicles, and whole cells.
    composed_of:
    - cytoplasm
    - eukaryotic_cell
    tier: 1
    source_domain: biology_ch04
    also_in:
    - biology_ch23
  microfilaments:
    defines: The narrowest cytoskeletal fibers, composed of actin, that provide rigidity
      and enable cellular movement.
    composed_of:
    - cytoskeleton
    tier: 2
    source_domain: biology_ch04
  intermediate_filaments:
    defines: Cytoskeletal fibers of intermediate diameter, composed of fibrous proteins,
      that bear tension and anchor organelles in place.
    composed_of:
    - cytoskeleton
    tier: 2
    source_domain: biology_ch04
  microtubules:
    defines: The widest cytoskeletal fibers, made of tubulin dimers, that resist compression,
      guide vesicle transport, and form flagella, cilia, and centrioles.
    composed_of:
    - cytoskeleton
    - centrosome
    tier: 2
    source_domain: biology_ch04
  flagella_and_cilia:
    defines: Microtubule-based, hair-like structures that extend from the plasma membrane
      to move an entire cell or move substances along its surface.
    composed_of:
    - microtubules
    tier: 3
    source_domain: biology_ch04
  extracellular_matrix:
    defines: Material secreted by animal cells, composed mainly of collagen and proteoglycans,
      that anchors cells and enables cell-to-cell communication.
    composed_of:
    - plasma_membrane
    - eukaryotic_cell
    tier: 1
    source_domain: biology_ch04
  intercellular_junctions:
    defines: Direct-contact structures between adjacent cells, including plasmodesmata
      in plants and tight junctions, desmosomes, and gap junctions in animals.
    composed_of:
    - plasma_membrane
    - cell_wall
    tier: 2
    source_domain: biology_ch04
  lipid_bilayer:
    defines: A double-layered phospholipid barrier, formed because phospholipids arrange
      with hydrophobic tails facing each other and hydrophilic heads facing outward,
      that separates fluid on either side.
    composed_of:
    - phospholipid
    - amphiphilic_molecule
    tier: 1
    source_domain: biology_ch05
  membrane_fluidity:
    defines: The fluid, dynamic character of the membrane resulting from the mosaic
      arrangement of loosely attached lipids and proteins, fatty acid saturation,
      and cholesterol content.
    composed_of:
    - phospholipid
    - cholesterol_membrane_role
    tier: 1
    source_domain: biology_ch05
  glycocalyx:
    defines: The carbohydrate coating on the cell's exterior surface, formed by glycoproteins
      and glycolipids, that enables cell recognition and interaction with the watery
      environment.
    composed_of:
    - plasma_membrane
    - membrane_protein_types
    tier: 1
    source_domain: biology_ch05
  electrochemical_gradient:
    defines: The combined concentration gradient and electrical charge difference
      that affects the movement of an ion across a membrane.
    composed_of:
    - concentration_gradient
    tier: 1
    source_domain: biology_ch05
  fluid_mosaic_model:
    defines: The model describing the plasma membrane as a mosaic of phospholipids,
      cholesterol, proteins, and carbohydrates that gives the membrane a fluid character.
    composed_of:
    - lipid_bilayer
    - cholesterol_membrane_role
    - membrane_protein_types
    tier: 2
    source_domain: biology_ch05
  selective_permeability:
    defines: The membrane property that allows some substances to pass through freely
      while restricting others, based on polarity, size, and charge.
    composed_of:
    - plasma_membrane
    - lipid_bilayer
    tier: 2
    source_domain: biology_ch05
  active_transport:
    defines: Transport mechanisms that require the cell to expend energy, usually
      from ATP, to move substances against their concentration or electrochemical
      gradient.
    composed_of:
    - electrochemical_gradient
    - concentration_gradient
    tier: 2
    source_domain: biology_ch05
    also_in:
    - biology_ch41
  passive_transport:
    defines: Movement of substances across the membrane from high to low concentration
      that does not require the cell to expend energy.
    composed_of:
    - concentration_gradient
    - selective_permeability
    tier: 3
    source_domain: biology_ch05
  primary_active_transport:
    defines: Active transport that directly uses ATP hydrolysis to move ions across
      a membrane, creating a charge difference.
    composed_of:
    - active_transport
    tier: 3
    source_domain: biology_ch05
  bulk_transport:
    defines: Active transport mechanisms that move large particles or molecules into
      or out of a cell via membrane vesicle formation.
    composed_of:
    - active_transport
    - plasma_membrane
    tier: 3
    source_domain: biology_ch05
  diffusion:
    defines: The passive movement of a single substance from an area of high concentration
      to an area of low concentration until evenly distributed.
    composed_of:
    - passive_transport
    tier: 4
    source_domain: biology_ch05
    also_in:
    - biology_ch33
    - biology_ch39
  facilitated_transport:
    defines: Passive diffusion of polar or charged materials across the membrane with
      the help of channel or carrier proteins.
    composed_of:
    - passive_transport
    - channel_protein
    - carrier_protein
    tier: 4
    source_domain: biology_ch05
  osmosis:
    defines: The passive movement of free water molecules through a semipermeable
      membrane from an area of higher water concentration to lower water concentration.
    composed_of:
    - passive_transport
    tier: 4
    source_domain: biology_ch05
    also_in:
    - biology_ch41
  secondary_active_transport:
    defines: Active transport of a substance driven by the electrochemical gradient
      established by primary active transport, rather than direct ATP use.
    composed_of:
    - primary_active_transport
    - electrochemical_gradient
    tier: 4
    source_domain: biology_ch05
  endocytosis:
    defines: A type of active transport in which the plasma membrane invaginates and
      pinches off to bring particles or fluid into the cell within a vesicle.
    composed_of:
    - bulk_transport
    tier: 4
    source_domain: biology_ch05
  exocytosis:
    defines: The process by which a cell expels material to the extracellular fluid
      by fusing a membrane-bound vesicle with the plasma membrane.
    composed_of:
    - bulk_transport
    tier: 4
    source_domain: biology_ch05
  tonicity:
    defines: The property describing how an extracellular solution's osmolarity relative
      to a cell affects the cell's volume via osmosis, categorized as hypotonic, isotonic,
      or hypertonic.
    composed_of:
    - osmosis
    - osmolarity
    tier: 5
    source_domain: biology_ch05
    also_in:
    - biology_ch41
  kinetic_energy:
    defines: The energy associated with objects or particles in motion.
    composed_of:
    - energy
    tier: 1
    source_domain: biology_ch06
  potential_energy:
    defines: Stored energy that an object has due to its position or structure, representing
      the potential to do work.
    composed_of:
    - energy
    tier: 1
    source_domain: biology_ch06
  chemical_energy:
    defines: Potential energy stored within chemical bonds that releases when those
      bonds are broken.
    composed_of:
    - potential_energy
    tier: 2
    source_domain: biology_ch06
  first_law_of_thermodynamics:
    defines: The total amount of energy in the universe is constant; energy can be
      transferred or transformed but not created or destroyed.
    composed_of:
    - thermodynamics
    - system_and_surroundings
    - energy
    tier: 1
    source_domain: biology_ch06
  entropy:
    defines: A measure of randomness or disorder within a system.
    composed_of:
    - thermodynamics
    - system_and_surroundings
    tier: 1
    source_domain: biology_ch06
  second_law_of_thermodynamics:
    defines: Every energy transfer or transformation increases the entropy of the
      universe because no energy transfer is completely efficient.
    composed_of:
    - first_law_of_thermodynamics
    - entropy
    tier: 2
    source_domain: biology_ch06
    also_in:
    - biology_ch46
  free_energy:
    defines: The usable energy in a chemical reaction that is available to do work,
      after accounting for entropy.
    composed_of:
    - enthalpy
    - entropy
    tier: 2
    source_domain: biology_ch06
  delta_g:
    defines: The change in Gibbs free energy during a chemical reaction, calculated
      from enthalpy, entropy, and temperature.
    composed_of:
    - free_energy
    tier: 3
    source_domain: biology_ch06
  exergonic_reaction:
    defines: A chemical reaction with a negative delta G that releases free energy
      and occurs spontaneously.
    composed_of:
    - delta_g
    tier: 4
    source_domain: biology_ch06
  endergonic_reaction:
    defines: A chemical reaction with a positive delta G that requires an input of
      energy and is nonspontaneous.
    composed_of:
    - delta_g
    tier: 4
    source_domain: biology_ch06
  chemical_equilibrium:
    defines: The state a reversible reaction reaches when it has minimal free energy
      and maximal entropy, with no net change in reactant/product concentrations.
    composed_of:
    - free_energy
    - entropy
    tier: 2
    source_domain: biology_ch06
  activation_energy:
    defines: The small amount of energy input required for a chemical reaction to
      reach its transition state and proceed.
    composed_of:
    - energy
    tier: 1
    source_domain: biology_ch06
  transition_state:
    defines: The high-energy, unstable intermediate state between substrate and product
      during a chemical reaction.
    composed_of:
    - activation_energy
    - substrate
    tier: 2
    source_domain: biology_ch06
  catalysis:
    defines: The process of lowering a reaction's activation energy to increase its
      rate.
    composed_of:
    - activation_energy
    tier: 2
    source_domain: biology_ch06
  anabolic_pathway:
    defines: A metabolic pathway that requires an input of energy to synthesize complex
      molecules from simpler ones.
    composed_of:
    - metabolism
    - endergonic_reaction
    tier: 5
    source_domain: biology_ch06
  catabolic_pathway:
    defines: A metabolic pathway in which complex molecules break down into simpler
      ones, releasing energy.
    composed_of:
    - metabolism
    - exergonic_reaction
    tier: 5
    source_domain: biology_ch06
  atp:
    defines: The primary energy currency molecule of cells, whose phosphoanhydride
      bonds release usable energy when hydrolyzed.
    composed_of:
    - chemical_energy
    - metabolism
    tier: 3
    source_domain: biology_ch06
    also_in:
    - biology_ch07
    - biology_ch34
  atp_hydrolysis:
    defines: The exergonic breakdown of ATP into ADP and inorganic phosphate, releasing
      free energy to power cellular work.
    composed_of:
    - atp
    - exergonic_reaction
    tier: 5
    source_domain: biology_ch06
  phosphorylation:
    defines: The process of a phosphate group binding to a molecule, often transferred
      from ATP, raising the molecule's free energy.
    composed_of:
    - atp
    tier: 4
    source_domain: biology_ch06
    also_in:
    - biology_ch07
    - biology_ch09
  energy_coupling:
    defines: The strategy by which the energy released by an exergonic reaction (such
      as ATP hydrolysis) is used to drive an endergonic reaction.
    composed_of:
    - atp_hydrolysis
    - endergonic_reaction
    tier: 6
    source_domain: biology_ch06
  enzyme:
    defines: A protein catalyst that lowers the activation energy of biochemical reactions
      without changing their free energy.
    composed_of:
    - catalysis
    - substrate
    tier: 3
    source_domain: biology_ch06
    also_in:
    - biology_ch34
  active_site:
    defines: The specific region of an enzyme where the substrate binds and the catalytic
      reaction occurs.
    composed_of:
    - enzyme
    - substrate
    tier: 4
    source_domain: biology_ch06
  induced_fit:
    defines: A model describing the dynamic conformational change that occurs in both
      enzyme and substrate as they bind, optimizing catalysis.
    composed_of:
    - active_site
    tier: 5
    source_domain: biology_ch06
  cofactors_and_coenzymes:
    defines: Inorganic ions (cofactors) or organic helper molecules (coenzymes), often
      derived from vitamins, required for optimal enzyme function.
    composed_of:
    - enzyme
    tier: 4
    source_domain: biology_ch06
  competitive_inhibition:
    defines: Enzyme inhibition in which an inhibitor molecule competes with the substrate
      for binding at the active site.
    composed_of:
    - active_site
    tier: 5
    source_domain: biology_ch06
  allosteric_regulation:
    defines: Enzyme regulation in which a molecule binds at a site other than the
      active site (the allosteric site), inducing a conformational change that inhibits
      or activates the enzyme.
    composed_of:
    - enzyme
    - active_site
    tier: 5
    source_domain: biology_ch06
  enzyme_regulation:
    defines: Mechanisms including environmental factors, cofactors/coenzymes, compartmentalization,
      and inhibitors/activators that control enzyme activity.
    composed_of:
    - cofactors_and_coenzymes
    - competitive_inhibition
    - allosteric_regulation
    tier: 6
    source_domain: biology_ch06
  feedback_inhibition:
    defines: A regulatory mechanism in which a metabolic pathway's product inhibits
      an enzyme earlier in the pathway to limit its own overproduction.
    composed_of:
    - allosteric_regulation
    - metabolism
    tier: 6
    source_domain: biology_ch06
  substrate_level_phosphorylation:
    defines: Direct generation of ATP from ADP when a phosphate group is transferred
      from a phosphorylated intermediate reactant during a catabolic pathway reaction.
    composed_of:
    - phosphorylation
    tier: 2
    source_domain: biology_ch07
  glycolysis:
    defines: The anaerobic, cytoplasmic pathway that splits one six-carbon glucose
      molecule into two three-carbon pyruvate molecules, yielding a net gain of 2
      ATP and 2 NADH.
    composed_of:
    - substrate_level_phosphorylation
    - electron_carrier
    - redox_reaction
    tier: 3
    source_domain: biology_ch07
  pyruvate_oxidation:
    defines: The three-step mitochondrial conversion of pyruvate into acetyl CoA,
      releasing CO2 and producing NADH, which prepares the carbon skeleton for the
      citric acid cycle.
    composed_of:
    - glycolysis
    - electron_carrier
    - redox_reaction
    tier: 4
    source_domain: biology_ch07
  citric_acid_cycle:
    defines: A closed-loop series of eight redox and decarboxylation reactions in
      the mitochondrial matrix that oxidizes the acetyl group of acetyl CoA, regenerating
      oxaloacetate and producing CO2, NADH, FADH2, and ATP/GTP.
    composed_of:
    - pyruvate_oxidation
    - substrate_level_phosphorylation
    - electron_carrier
    - redox_reaction
    tier: 5
    source_domain: biology_ch07
  electron_transport_chain:
    defines: A series of four membrane-embedded protein complexes and mobile carriers
      that pass electrons from NADH and FADH2 to molecular oxygen, pumping protons
      across the inner mitochondrial membrane in the process.
    composed_of:
    - electron_carrier
    - redox_reaction
    tier: 1
    source_domain: biology_ch07
    also_in:
    - biology_ch08
  chemiosmosis:
    defines: The process by which the proton gradient generated by the electron transport
      chain drives protons through ATP synthase, producing ATP.
    composed_of:
    - electron_transport_chain
    - atp
    tier: 2
    source_domain: biology_ch07
    also_in:
    - biology_ch08
  oxidative_phosphorylation:
    defines: The production of ATP via chemiosmosis coupled to the electron transport
      chain, accounting for about 90 percent of ATP generated during aerobic glucose
      catabolism.
    composed_of:
    - chemiosmosis
    - electron_transport_chain
    tier: 3
    source_domain: biology_ch07
  fermentation:
    defines: A process that uses an organic molecule (e.g., pyruvate or acetaldehyde)
      as the final electron acceptor to regenerate NAD+ from NADH in the absence of
      oxygen, allowing glycolysis to continue.
    composed_of:
    - glycolysis
    - electron_carrier
    - redox_reaction
    tier: 4
    source_domain: biology_ch07
  anaerobic_cellular_respiration:
    defines: A respiration process in certain prokaryotes in which an inorganic molecule
      other than oxygen serves as the final electron acceptor of the electron transport
      chain.
    composed_of:
    - electron_transport_chain
    - redox_reaction
    tier: 2
    source_domain: biology_ch07
  metabolic_pathway_integration:
    defines: The interconnection of catabolic and anabolic pathways for sugars, amino
      acids, and lipids with glycolysis and the citric acid cycle, allowing diverse
      macromolecules to be broken down for energy or synthesized from shared intermediates.
    composed_of:
    - glycolysis
    - citric_acid_cycle
    tier: 6
    source_domain: biology_ch07
  electromagnetic_spectrum:
    defines: The full range of frequencies of radiation emitted by the sun, of which
      visible light is only a small portion.
    composed_of:
    - photon
    - wavelength
    tier: 1
    source_domain: biology_ch08
  absorption_spectrum:
    defines: The specific pattern of wavelengths a given pigment absorbs from visible
      light.
    composed_of:
    - pigment
    - wavelength
    tier: 1
    source_domain: biology_ch08
  light_harvesting_complex:
    defines: A complex of hundreds of antenna pigments that passes absorbed light
      energy to the reaction center of a photosystem.
    composed_of:
    - pigment
    - chlorophyll
    - carotenoid
    - thylakoid
    tier: 1
    source_domain: biology_ch08
  reaction_center:
    defines: A special pair of chlorophyll a molecules within a photosystem that can
      be oxidized, ejecting an excited electron in a photoact.
    composed_of:
    - chlorophyll
    - photon
    - reduction
    tier: 1
    source_domain: biology_ch08
  atp_synthase:
    defines: A protein channel in the thylakoid membrane that uses the energy of the
      hydrogen ion gradient to attach a phosphate group to ADP, forming ATP.
    composed_of:
    - thylakoid
    tier: 1
    source_domain: biology_ch08
  carbon_fixation:
    defines: The process, catalyzed by RuBisCO, of converting inorganic CO2 gas into
      an organic compound (3-PGA) during stage 1 of the Calvin cycle.
    composed_of:
    - stroma
    - reduction
    tier: 1
    source_domain: biology_ch08
  photosystem:
    defines: A multiprotein complex embedded in the thylakoid membrane, consisting
      of a light-harvesting complex and a reaction center, that converts light energy
      into an excited electron.
    composed_of:
    - light_harvesting_complex
    - reaction_center
    - thylakoid
    tier: 2
    source_domain: biology_ch08
  photosystem_ii:
    defines: The photosystem, with reaction center P680, that extracts electrons from
      water and passes them into the electron transport chain.
    composed_of:
    - photosystem
    tier: 3
    source_domain: biology_ch08
  photosystem_i:
    defines: The photosystem, with reaction center P700, that receives electrons from
      the electron transport chain and uses them to reduce NADP+ to NADPH.
    composed_of:
    - photosystem
    tier: 3
    source_domain: biology_ch08
  light_dependent_reactions:
    defines: The first stage of photosynthesis, occurring in the thylakoid membrane,
      in which light energy absorbed via photosystems is converted into the chemical
      energy of ATP and NADPH.
    composed_of:
    - photosystem_ii
    - photosystem_i
    - electron_transport_chain
    - chemiosmosis
    - thylakoid
    tier: 6
    source_domain: biology_ch08
  calvin_cycle:
    defines: The light-independent reactions of photosynthesis, occurring in the stroma,
      that use ATP and NADPH to convert atmospheric CO2 into carbohydrate molecules.
    composed_of:
    - carbon_fixation
    - light_dependent_reactions
    - stroma
    tier: 7
    source_domain: biology_ch08
  photosynthesis:
    defines: The biological process by which photoautotrophs capture light energy
      and convert it into chemical energy stored in the covalent bonds of carbohydrate
      molecules, releasing oxygen as a byproduct.
    composed_of:
    - light_dependent_reactions
    - calvin_cycle
    - chloroplast
    - photoautotroph
    tier: 8
    source_domain: biology_ch08
  intercellular_signaling:
    defines: Communication between cells, achieved through the release and reception
      of ligands by signaling and target cells.
    composed_of:
    - ligand
    - receptor
    tier: 1
    source_domain: biology_ch09
  paracrine_signaling:
    defines: Local signaling in which ligands diffuse through the extracellular matrix
      to act on nearby cells, as seen at nerve cell synapses.
    composed_of:
    - intercellular_signaling
    tier: 2
    source_domain: biology_ch09
  endocrine_signaling:
    defines: Long-distance signaling in which hormones travel through the bloodstream
      from endocrine cells to distant target cells.
    composed_of:
    - intercellular_signaling
    tier: 2
    source_domain: biology_ch09
  autocrine_signaling:
    defines: Signaling in which a cell releases a ligand that binds to receptors on
      itself or similar nearby cells.
    composed_of:
    - intercellular_signaling
    tier: 2
    source_domain: biology_ch09
  gap_junction_signaling:
    defines: Signaling in which small molecules pass directly between adjacent cells
      through fluid-filled membrane channels (gap junctions or plasmodesmata).
    composed_of:
    - intercellular_signaling
    tier: 2
    source_domain: biology_ch09
  internal_receptor:
    defines: A cytoplasmic receptor that binds hydrophobic ligands able to cross the
      plasma membrane, often regulating gene expression directly.
    composed_of:
    - receptor
    - ligand
    tier: 1
    source_domain: biology_ch09
  cell_surface_receptor:
    defines: A membrane-spanning receptor that binds external ligands and converts
      an extracellular signal into an intracellular one via signal transduction.
    composed_of:
    - receptor
    - ligand
    tier: 1
    source_domain: biology_ch09
  ion_channel_linked_receptor:
    defines: A cell-surface receptor that opens a membrane channel to allow specific
      ions to pass through upon ligand binding.
    composed_of:
    - cell_surface_receptor
    tier: 2
    source_domain: biology_ch09
  g_protein_linked_receptor:
    defines: A cell-surface receptor that activates a membrane-bound G-protein, which
      then interacts with an ion channel or enzyme to transmit a signal.
    composed_of:
    - cell_surface_receptor
    tier: 2
    source_domain: biology_ch09
  enzyme_linked_receptor:
    defines: A cell-surface receptor with an intracellular domain associated with
      or acting as an enzyme, activated upon ligand binding.
    composed_of:
    - cell_surface_receptor
    tier: 2
    source_domain: biology_ch09
  receptor_dimerization:
    defines: The joining of two receptor proteins into a stable complex (dimer) that
      enables activation of their intracellular domains.
    composed_of:
    - enzyme_linked_receptor
    tier: 3
    source_domain: biology_ch09
  signal_transduction:
    defines: The propagation of a signal from a cell-surface receptor through the
      membrane and into the cytoplasm.
    composed_of:
    - cell_surface_receptor
    tier: 2
    source_domain: biology_ch09
  intracellular_signaling:
    defines: Communication that occurs within a single cell, propagating a signal
      from a receptor through the cytoplasm.
    composed_of:
    - signal_transduction
    tier: 3
    source_domain: biology_ch09
  signaling_pathway:
    defines: A chain of protein and second-messenger interactions in the cytoplasm
      that propagates a signal to produce a cellular response.
    composed_of:
    - intracellular_signaling
    - phosphorylation
    - kinase
    tier: 4
    source_domain: biology_ch09
  dephosphorylation:
    defines: The removal of a phosphate group from a phosphorylated molecule by an
      enzyme called a phosphatase, reversing phosphorylation's effect.
    composed_of:
    - phosphorylation
    tier: 1
    source_domain: biology_ch09
  second_messenger:
    defines: A small, non-protein molecule (e.g., calcium ions, cAMP, DAG, IP3) that
      propagates a signal within the cell after receptor activation.
    composed_of:
    - intracellular_signaling
    tier: 3
    source_domain: biology_ch09
  signal_amplification:
    defines: The enzymatic amplification of a single ligand-binding event into many
      downstream activations, and the merging of signals from multiple receptors to
      activate a shared response.
    composed_of:
    - signaling_pathway
    tier: 5
    source_domain: biology_ch09
  signal_termination:
    defines: The process of stopping a signaling cascade through ligand degradation,
      dephosphorylation, or second-messenger breakdown.
    composed_of:
    - signaling_pathway
    - dephosphorylation
    tier: 5
    source_domain: biology_ch09
  chromosome:
    defines: A structure of packaged genetic material; a single circular DNA molecule
      in prokaryotes or multiple linear DNA-protein complexes in eukaryotes.
    composed_of:
    - dna
    - gene
    tier: 1
    source_domain: biology_ch10
    also_in:
    - biology_ch13
  chromatin:
    defines: The DNA-histone complex that forms the basic packaging structure of eukaryotic
      chromosomes.
    composed_of:
    - dna
    - histone
    tier: 1
    source_domain: biology_ch10
  nucleosome:
    defines: The beadlike subunit of chromatin formed by a short stretch of DNA wrapped
      around a core of eight histone proteins.
    composed_of:
    - dna
    - histone
    tier: 1
    source_domain: biology_ch10
    also_in:
    - biology_ch16
  cdk_cyclin_complex:
    defines: The activated pairing of a Cdk with its cyclin partner that positively
      drives the cell past cell-cycle checkpoints.
    composed_of:
    - cdk
    - cyclin
    tier: 1
    source_domain: biology_ch10
  gene_mutation:
    defines: An uncorrected change in the nucleotide sequence within the coding portion
      of a gene, arising from replication errors.
    composed_of:
    - gene
    - dna
    tier: 1
    source_domain: biology_ch10
  homologous_chromosomes:
    defines: Matched pairs of chromosomes, one from each parent, that carry genes
      for the same traits at the same loci.
    composed_of:
    - chromosome
    - gene
    - trait
    tier: 2
    source_domain: biology_ch10
    also_in:
    - biology_ch11
  sister_chromatids:
    defines: The two identical, cohesin-linked copies of a replicated chromosome joined
      at the centromere.
    composed_of:
    - chromosome
    tier: 2
    source_domain: biology_ch10
    also_in:
    - biology_ch11
  interphase:
    defines: The preparatory portion of the cell cycle, comprising G1, S, and G2 phases,
      during which the cell grows and replicates its DNA.
    composed_of:
    - chromosome
    tier: 2
    source_domain: biology_ch10
  tumor_suppressor_gene:
    defines: A gene coding for a negative regulator protein that, when functional,
      prevents uncontrolled cell division; loss of function contributes to cancer.
    composed_of:
    - gene_mutation
    - negative_regulators
    tier: 2
    source_domain: biology_ch10
  proto_oncogene_oncogene:
    defines: Normal genes coding for positive cell-cycle regulators (proto-oncogenes)
      that become cancer-causing oncogenes when mutated to increase cell-cycle progression.
    composed_of:
    - gene_mutation
    - cdk_cyclin_complex
    tier: 2
    source_domain: biology_ch10
  ploidy:
    defines: The number of chromosome sets in a cell, with diploid (2n) somatic cells
      containing two sets and haploid (1n) gametes containing one.
    composed_of:
    - chromosome
    - homologous_chromosomes
    tier: 3
    source_domain: biology_ch10
  mitosis:
    defines: Nuclear division consisting of prophase, prometaphase, metaphase, anaphase,
      and telophase, in which duplicated chromosomes are separated into two identical
      nuclei.
    composed_of:
    - chromosome
    - sister_chromatids
    - mitotic_spindle
    tier: 3
    source_domain: biology_ch10
    also_in:
    - biology_ch11
    - biology_ch23
  cytokinesis:
    defines: The physical division of the cytoplasm into two daughter cells, following
      mitosis via an actin contractile ring in animal cells or cell plate formation
      in plant cells.
    composed_of:
    - mitosis
    tier: 4
    source_domain: biology_ch10
  cell_cycle:
    defines: The ordered sequence of interphase and the mitotic phase (mitosis plus
      cytokinesis) that produces two genetically identical daughter cells.
    composed_of:
    - interphase
    - mitosis
    - cytokinesis
    tier: 5
    source_domain: biology_ch10
  g0_phase:
    defines: A quiescent state in which a cell exits the cell cycle and is not actively
      preparing to divide.
    composed_of:
    - cell_cycle
    tier: 6
    source_domain: biology_ch10
  cell_cycle_checkpoints:
    defines: Internal control points near the end of G1, at the G2/M transition, and
      during metaphase where cell-cycle progression can be halted until conditions
      are favorable.
    composed_of:
    - cell_cycle
    tier: 6
    source_domain: biology_ch10
  apoptosis:
    defines: Programmed cell death triggered by p53 when DNA damage cannot be repaired,
      preventing propagation of damaged chromosomes.
    composed_of:
    - negative_regulators
    - cell_cycle_checkpoints
    tier: 7
    source_domain: biology_ch10
  synapsis:
    defines: The tight pairing of homologous chromosomes during prophase I, mediated
      by the synaptonemal complex.
    composed_of:
    - homologous_chromosomes
    tier: 1
    source_domain: biology_ch11
    also_in:
    - biology_ch13
  independent_assortment:
    defines: The random orientation of homologous chromosome pairs at the metaphase
      plate during metaphase I, producing varied combinations of maternal and paternal
      chromosomes in gametes.
    composed_of:
    - homologous_chromosomes
    tier: 1
    source_domain: biology_ch11
  crossing_over:
    defines: The exchange of chromosomal segments between homologous nonsister chromatids
      during prophase I, producing recombinant chromosomes.
    composed_of:
    - synapsis
    tier: 2
    source_domain: biology_ch11
  tetrad:
    defines: Two duplicated homologous chromosomes (four chromatids) held together
      by chiasmata following synapsis and crossover.
    composed_of:
    - synapsis
    - crossing_over
    - sister_chromatids
    tier: 3
    source_domain: biology_ch11
  genetic_variation_in_meiosis:
    defines: The genetic diversity among gametes generated by crossing over and independent
      assortment during meiosis.
    composed_of:
    - crossing_over
    - independent_assortment
    tier: 3
    source_domain: biology_ch11
  meiosis_i:
    defines: The first meiotic division, in which homologous chromosomes pair, undergo
      crossover, and separate, reducing ploidy from diploid to haploid.
    composed_of:
    - synapsis
    - crossing_over
    - tetrad
    - independent_assortment
    tier: 4
    source_domain: biology_ch11
  meiosis_ii:
    defines: The second meiotic division, mechanically similar to mitosis, in which
      sister chromatids separate to produce four haploid daughter cells.
    composed_of:
    - sister_chromatids
    - mitosis
    tier: 1
    source_domain: biology_ch11
  meiosis:
    defines: The nuclear division process consisting of one round of DNA replication
      followed by two rounds of division (meiosis I and II) that produces four genetically
      unique haploid cells from a diploid cell.
    composed_of:
    - meiosis_i
    - meiosis_ii
    - haploid_diploid
    tier: 5
    source_domain: biology_ch11
    also_in:
    - biology_ch13
    - biology_ch43
  meiosis_vs_mitosis:
    defines: The distinction between meiosis, which produces four genetically distinct
      haploid cells via two divisions, and mitosis, which produces two genetically
      identical diploid (or haploid) cells via one division.
    composed_of:
    - meiosis
    - mitosis
    tier: 6
    source_domain: biology_ch11
  sexual_reproduction:
    defines: A reproductive strategy involving meiosis and fertilization that produces
      genetically unique offspring through combination of parental genomes.
    composed_of:
    - meiosis
    - fertilization
    - gametes
    tier: 6
    source_domain: biology_ch11
    also_in:
    - biology_ch18
    - biology_ch23
    - biology_ch24
    - biology_ch43
  life_cycle:
    defines: The sequence of events in an organism's development and reproduction,
      including alternation between haploid and diploid stages.
    composed_of:
    - sexual_reproduction
    - haploid_diploid
    tier: 7
    source_domain: biology_ch11
  hybridization:
    defines: The process of mating two individuals with different traits to study
      inheritance of a characteristic in their offspring.
    composed_of:
    - true_breeding
    - trait
    tier: 1
    source_domain: biology_ch12
  product_rule:
    defines: The probability of two independent events occurring together is the product
      of their individual probabilities.
    composed_of:
    - probability_basics
    tier: 1
    source_domain: biology_ch12
  sum_rule:
    defines: The probability of one of two mutually exclusive events occurring is
      the sum of their individual probabilities.
    composed_of:
    - probability_basics
    tier: 1
    source_domain: biology_ch12
  genotype_phenotype:
    defines: Genotype is an organism's underlying genetic makeup, while phenotype
      is its observable expressed traits.
    composed_of:
    - diploidy_and_alleles
    - trait
    tier: 1
    source_domain: biology_ch12
  homozygous_heterozygous:
    defines: A homozygous organism has two identical alleles at a locus, while a heterozygous
      organism has two different alleles.
    composed_of:
    - diploidy_and_alleles
    tier: 1
    source_domain: biology_ch12
  dominant_recessive_traits:
    defines: Dominant traits are expressed unchanged in a hybridization, while recessive
      traits become latent in F1 but reappear in F2.
    composed_of:
    - hybridization
    - filial_generations
    tier: 2
    source_domain: biology_ch12
  reciprocal_cross:
    defines: A paired cross swapping the traits of male and female parents to confirm
      inheritance patterns are independent of sex.
    composed_of:
    - hybridization
    - trait
    tier: 2
    source_domain: biology_ch12
  punnett_square:
    defines: A grid-based tool that applies probability rules to predict genotypic
      and phenotypic outcomes of a genetic cross.
    composed_of:
    - genotype_phenotype
    - probability_basics
    tier: 2
    source_domain: biology_ch12
  incomplete_dominance:
    defines: A pattern in which a heterozygote displays a phenotype intermediate between
      the two homozygous parental phenotypes.
    composed_of:
    - genotype_phenotype
    - homozygous_heterozygous
    tier: 2
    source_domain: biology_ch12
  codominance:
    defines: A pattern in which both alleles for a characteristic are simultaneously
      and fully expressed in the heterozygote.
    composed_of:
    - genotype_phenotype
    - homozygous_heterozygous
    tier: 2
    source_domain: biology_ch12
  multiple_alleles:
    defines: The existence of more than two allele variants for a gene at the population
      level, producing dominance hierarchies.
    composed_of:
    - diploidy_and_alleles
    - dominant_recessive_traits
    tier: 3
    source_domain: biology_ch12
  x_linked_inheritance:
    defines: Inheritance patterns for genes on the X chromosome, causing reciprocal
      crosses to differ and males to be hemizygous.
    composed_of:
    - diploidy_and_alleles
    - reciprocal_cross
    tier: 3
    source_domain: biology_ch12
  lethality_alleles:
    defines: Inheritance patterns in which an allele causes death in homozygotes or
      in both homozygotes and heterozygotes.
    composed_of:
    - homozygous_heterozygous
    - dominant_recessive_traits
    tier: 3
    source_domain: biology_ch12
  law_of_dominance:
    defines: In a heterozygote, one allele's trait conceals the presence of the other
      allele's trait for the same characteristic.
    composed_of:
    - dominant_recessive_traits
    - homozygous_heterozygous
    tier: 3
    source_domain: biology_ch12
  monohybrid_cross:
    defines: A cross between two true-breeding parents differing in one characteristic,
      revealing dominant/recessive inheritance ratios.
    composed_of:
    - punnett_square
    - dominant_recessive_traits
    - homozygous_heterozygous
    tier: 3
    source_domain: biology_ch12
  law_of_segregation:
    defines: Paired alleles segregate equally into gametes during meiosis, so offspring
      have equal chance of inheriting either allele.
    composed_of:
    - diploidy_and_alleles
    - monohybrid_cross
    tier: 4
    source_domain: biology_ch12
  law_of_independent_assortment:
    defines: Genes for different characteristics sort into gametes independently of
      one another.
    composed_of:
    - law_of_segregation
    - diploidy_and_alleles
    tier: 5
    source_domain: biology_ch12
  dihybrid_cross:
    defines: A cross between two true-breeding parents differing in two characteristics,
      demonstrating independent assortment via a 9:3:3:1 ratio.
    composed_of:
    - law_of_independent_assortment
    - punnett_square
    tier: 6
    source_domain: biology_ch12
  gene_linkage_recombination:
    defines: Genes located close together on the same chromosome tend to be inherited
      together unless separated by crossover events.
    composed_of:
    - law_of_independent_assortment
    - diploidy_and_alleles
    tier: 6
    source_domain: biology_ch12
  epistasis:
    defines: An interaction between genes in which one gene's alleles mask or interfere
      with the phenotypic expression of another gene's alleles.
    composed_of:
    - dihybrid_cross
    - dominant_recessive_traits
    tier: 7
    source_domain: biology_ch12
  chromosomal_theory_of_inheritance:
    defines: The theory proposing that chromosomes are the vehicles of genes and that
      their behavior during meiosis is the physical basis of Mendelian inheritance
      patterns.
    composed_of:
    - chromosome
    - gene
    - meiosis
    tier: 1
    source_domain: biology_ch13
  genetic_linkage:
    defines: The phenomenon in which genes located on the same chromosome tend to
      be inherited together rather than assorting independently.
    composed_of:
    - gene
    - chromosome
    tier: 1
    source_domain: biology_ch13
  homologous_recombination:
    defines: The process by which synapsed homologous chromosomes undergo reciprocal
      physical exchange of chromosome segments at their arms.
    composed_of:
    - synapsis
    - chromosome
    tier: 1
    source_domain: biology_ch13
  parental_and_nonparental_types:
    defines: Progeny that exhibit either the same allele combination as their parents
      (parental) or a different combination resulting from recombination (nonparental).
    composed_of:
    - genetic_linkage
    - homologous_recombination
    tier: 2
    source_domain: biology_ch13
  recombination_frequency:
    defines: The average number of crossovers between two alleles, observed as the
      proportion of nonparental-type progeny in a population.
    composed_of:
    - parental_and_nonparental_types
    tier: 3
    source_domain: biology_ch13
  genetic_map:
    defines: A linear representation of gene order and relative distance on a chromosome,
      constructed using recombination frequencies expressed in centimorgans.
    composed_of:
    - recombination_frequency
    tier: 4
    source_domain: biology_ch13
    also_in:
    - biology_ch17
  nondisjunction:
    defines: The failure of homologous chromosomes or sister chromatids to separate
      completely during meiosis, resulting in an abnormal chromosome number.
    composed_of:
    - meiosis
    - chromosome
    tier: 1
    source_domain: biology_ch13
  aneuploidy:
    defines: A condition in which an individual has an error in chromosome number,
      including monosomy (one chromosome missing) or trisomy (one extra chromosome),
      typically caused by nondisjunction.
    composed_of:
    - nondisjunction
    tier: 2
    source_domain: biology_ch13
  polyploidy:
    defines: A condition in which an individual has more than the normal number of
      complete chromosome sets.
    composed_of:
    - meiosis
    - chromosome
    tier: 1
    source_domain: biology_ch13
    also_in:
    - biology_ch18
  x_inactivation:
    defines: The condensation of one X chromosome into a Barr body during embryonic
      development in females, compensating for the double genetic dose of X-linked
      genes.
    composed_of:
    - chromosome
    tier: 1
    source_domain: biology_ch13
  chromosomal_duplications_and_deletions:
    defines: Structural changes in which a chromosomal segment is duplicated or lost,
      producing disorders such as Cri-du-chat syndrome from deletion of part of chromosome
      5.
    composed_of:
    - chromosome
    tier: 1
    source_domain: biology_ch13
  chromosome_inversion:
    defines: A structural rearrangement involving the detachment, 180-degree rotation,
      and reinsertion of part of a chromosome, classified as pericentric or paracentric.
    composed_of:
    - chromosome
    tier: 1
    source_domain: biology_ch13
  translocation:
    defines: A structural rearrangement in which a chromosome segment dissociates
      and reattaches to a different, nonhomologous chromosome.
    composed_of:
    - chromosome
    tier: 1
    source_domain: biology_ch13
    also_in:
    - biology_ch30
  phosphodiester_bond:
    defines: The ester linkage joining the 5' phosphate of one nucleotide's sugar
      to the 3'-OH of the next, forming the DNA backbone.
    composed_of:
    - nucleotide
    tier: 1
    source_domain: biology_ch14
  dna_as_genetic_material:
    defines: The conclusion that DNA (not protein) carries hereditary information.
    composed_of:
    - transformation
    - bacteriophage
    tier: 1
    source_domain: biology_ch14
  chargaffs_rules:
    defines: The observation that adenine equals thymine and guanine equals cytosine
      in DNA.
    composed_of:
    - nitrogenous_base
    tier: 1
    source_domain: biology_ch14
  replication_fork:
    defines: The Y-shaped structure formed where the DNA helix opens at the origin
      of replication.
    composed_of:
    - origin_of_replication
    - helicase
    tier: 1
    source_domain: biology_ch14
  dna_proofreading:
    defines: The ability of DNA polymerase to check and correct a newly added base's
      pairing before continuing elongation.
    composed_of:
    - dna_polymerase
    tier: 1
    source_domain: biology_ch14
  dna_double_helix_structure:
    defines: The Watson-Crick model in which two antiparallel, complementary nucleotide
      strands twist into a right-handed helix stabilized by hydrogen-bonded base pairs.
    composed_of:
    - nucleotide
    - nitrogenous_base
    - phosphodiester_bond
    - chargaffs_rules
    tier: 2
    source_domain: biology_ch14
  primer_synthesis:
    defines: The action of primase in laying down a short RNA segment that provides
      the free 3'-OH group DNA polymerase requires to begin synthesis.
    composed_of:
    - replication_fork
    tier: 2
    source_domain: biology_ch14
  mismatch_repair:
    defines: A post-replication repair mechanism that recognizes and corrects mispaired
      bases missed during proofreading.
    composed_of:
    - dna_proofreading
    tier: 2
    source_domain: biology_ch14
  dna_packaging:
    defines: The organization of DNA into compact forms via supercoiling and wrapping
      around histones into nucleosomes and chromatin.
    composed_of:
    - dna_double_helix_structure
    tier: 3
    source_domain: biology_ch14
  semiconservative_replication:
    defines: The model of DNA replication in which each daughter double helix retains
      one old and one new strand.
    composed_of:
    - dna_double_helix_structure
    tier: 3
    source_domain: biology_ch14
  nucleotide_excision_repair:
    defines: A repair mechanism that removes damaged bases, such as UV-induced pyrimidine
      dimers, and resynthesizes the region.
    composed_of:
    - dna_double_helix_structure
    tier: 3
    source_domain: biology_ch14
  leading_and_lagging_strand:
    defines: The continuous synthesis of the leading strand and discontinuous synthesis
      of the lagging strand, arising from DNA polymerase's 5'-to-3' restriction.
    composed_of:
    - replication_fork
    - dna_polymerase
    - primer_synthesis
    tier: 3
    source_domain: biology_ch14
  okazaki_fragments:
    defines: The short, individually primed DNA fragments synthesized on the lagging
      strand during replication.
    composed_of:
    - leading_and_lagging_strand
    tier: 4
    source_domain: biology_ch14
  mutation:
    defines: A permanent variation in nucleotide sequence arising from uncorrected
      replication errors or DNA damage.
    composed_of:
    - dna_proofreading
    - mismatch_repair
    - nucleotide_excision_repair
    tier: 4
    source_domain: biology_ch14
    also_in:
    - biology_ch18
    - biology_ch19
  prokaryotic_dna_replication:
    defines: The integrated process by which E. coli replicates its circular chromosome
      bidirectionally from one origin.
    composed_of:
    - origin_of_replication
    - helicase
    - dna_polymerase
    - replication_fork
    - primer_synthesis
    - leading_and_lagging_strand
    - okazaki_fragments
    tier: 5
    source_domain: biology_ch14
  point_mutation_types:
    defines: Single-base-pair changes, including transitions, transversions, silent
      mutations, and frameshift-causing indels.
    composed_of:
    - mutation
    tier: 5
    source_domain: biology_ch14
  eukaryotic_dna_replication:
    defines: The replication of linear eukaryotic chromosomes from multiple origins
      using analogous enzymes.
    composed_of:
    - prokaryotic_dna_replication
    tier: 6
    source_domain: biology_ch14
  telomere_replication:
    defines: The mechanism by which the repetitive DNA ends of linear eukaryotic chromosomes
      are extended to compensate for incomplete lagging-strand replication.
    composed_of:
    - eukaryotic_dna_replication
    - leading_and_lagging_strand
    tier: 7
    source_domain: biology_ch14
  telomerase:
    defines: An enzyme with a built-in RNA template that adds telomeric repeats to
      chromosome ends.
    composed_of:
    - telomere_replication
    tier: 8
    source_domain: biology_ch14
  central_dogma:
    defines: The principle that genes specify the sequence of mRNAs, which in turn
      specify the sequence of amino acids making up proteins (DNA -> RNA -> protein).
    composed_of:
    - dna
    - gene
    - amino_acid
    tier: 1
    source_domain: biology_ch15
  codon:
    defines: A three-nucleotide sequence in mRNA that specifies the insertion of a
      particular amino acid or signals translation initiation/termination.
    composed_of:
    - nucleotide_triplet
    - amino_acid
    tier: 1
    source_domain: biology_ch15
  genetic_code:
    defines: The correspondence between triplet nucleotide codons in mRNA and the
      20 amino acids (plus stop signals) they specify, which is degenerate and nearly
      universal across species.
    composed_of:
    - codon
    - amino_acid
    tier: 2
    source_domain: biology_ch15
  reading_frame:
    defines: The sequence of triplet codons in mRNA, set by the start codon, that
      determines how nucleotides are grouped into amino acid specifications.
    composed_of:
    - codon
    tier: 2
    source_domain: biology_ch15
  template_strand:
    defines: The DNA strand used to direct mRNA synthesis, accessed via a locally
      unwound region of DNA called the transcription bubble.
    composed_of:
    - dna
    - gene
    tier: 1
    source_domain: biology_ch15
  promoter:
    defines: A DNA sequence upstream of a gene onto which RNA polymerase and associated
      factors bind to initiate transcription.
    composed_of:
    - dna
    - gene
    tier: 1
    source_domain: biology_ch15
    also_in:
    - biology_ch16
  rna_polymerase:
    defines: The enzyme complex that synthesizes mRNA from a DNA template in the 5'
      to 3' direction; composed of a core enzyme (prokaryotes) or one of three distinct
      polymerases (eukaryotes).
    composed_of:
    - template_strand
    - promoter
    tier: 2
    source_domain: biology_ch15
  transcription_initiation:
    defines: The phase of transcription in which polymerase (with sigma factor in
      prokaryotes, or transcription factors in eukaryotes) binds the promoter to begin
      mRNA synthesis.
    composed_of:
    - rna_polymerase
    - promoter
    tier: 3
    source_domain: biology_ch15
  transcription_elongation_termination:
    defines: The process by which polymerase extends the mRNA chain 5' to 3' and is
      subsequently released from the DNA template via protein- or sequence-dependent
      termination signals.
    composed_of:
    - rna_polymerase
    - transcription_initiation
    tier: 4
    source_domain: biology_ch15
  prokaryotic_transcription:
    defines: Transcription in bacteria/archaea using a single five-subunit RNA polymerase
      holoenzyme, occurring simultaneously with translation due to the absence of
      a nucleus.
    composed_of:
    - transcription_initiation
    - transcription_elongation_termination
    tier: 5
    source_domain: biology_ch15
  eukaryotic_transcription_factors:
    defines: Proteins required to bind eukaryotic promoter regions and recruit the
      appropriate RNA polymerase, forming a preinitiation complex before transcription
      begins.
    composed_of:
    - promoter
    - rna_polymerase
    tier: 2
    source_domain: biology_ch15
  eukaryotic_transcription:
    defines: Transcription in eukaryotic cells using three distinct RNA polymerases
      (I, II, III) each transcribing different gene classes, requiring transcription
      factors and coordinated with nucleosome remodeling.
    composed_of:
    - eukaryotic_transcription_factors
    - transcription_initiation
    - transcription_elongation_termination
    tier: 5
    source_domain: biology_ch15
  mrna_processing:
    defines: The set of modifications made to eukaryotic pre-mRNA, including 5' cap
      addition, 3' poly-A tail addition, and intron removal, required before export
      and translation.
    composed_of:
    - eukaryotic_transcription
    tier: 6
    source_domain: biology_ch15
  splicing:
    defines: The process, carried out by spliceosomes, of precisely removing introns
      and reconnecting exons in a pre-mRNA transcript.
    composed_of:
    - mrna_processing
    tier: 7
    source_domain: biology_ch15
  trna_rrna_processing:
    defines: Post-transcriptional modification of precursor tRNA and rRNA molecules
      through cleavage, methylation, and structural folding to produce functional
      structural RNAs.
    composed_of:
    - eukaryotic_transcription
    tier: 6
    source_domain: biology_ch15
  ribosome:
    defines: A macromolecular complex of rRNAs and proteins, organized into large
      and small subunits, that catalyzes protein synthesis by reading mRNA and forming
      peptide bonds.
    composed_of:
    - trna_rrna_processing
    - amino_acid
    tier: 7
    source_domain: biology_ch15
    also_in:
    - biology_ch04
  trna_and_charging:
    defines: Adaptor RNA molecules with an anticodon that pair with mRNA codons and,
      once "charged" by aminoacyl tRNA synthetases with their corresponding amino
      acid, deliver amino acids to the ribosome.
    composed_of:
    - trna_rrna_processing
    - codon
    - amino_acid
    tier: 7
    source_domain: biology_ch15
  translation:
    defines: The process by which ribosomes decode an mRNA message via tRNAs into
      a polypeptide, proceeding through initiation, elongation, and termination phases.
    composed_of:
    - ribosome
    - trna_and_charging
    - reading_frame
    - genetic_code
    - splicing
    tier: 8
    source_domain: biology_ch15
    also_in:
    - biology_ch16
  prokaryotic_vs_eukaryotic_regulation:
    defines: The comparison of gene expression control, which in prokaryotes occurs
      mainly at the transcriptional level while in eukaryotes it occurs at multiple
      levels.
    composed_of:
    - gene_expression
    - transcription
    - translation
    tier: 1
    source_domain: biology_ch16
  cap_protein:
    defines: A positive regulator that binds cAMP and then binds promoters of sugar-processing
      operons to stabilize RNA polymerase binding and increase transcription.
    composed_of:
    - activator
    - promoter
    tier: 1
    source_domain: biology_ch16
  epigenetic_regulation:
    defines: Heritable changes in gene expression that do not involve changes in the
      DNA sequence, controlling access to genes via chromatin structure and DNA methylation.
    composed_of:
    - gene_expression
    - histone
    tier: 1
    source_domain: biology_ch16
  chromatin_remodeling:
    defines: The process of changing how DNA is associated with histone proteins to
      open or close chromosomal regions for transcription.
    composed_of:
    - histone
    - transcription
    tier: 1
    source_domain: biology_ch16
  histone_modification:
    defines: The addition or removal of chemical groups to histone tails that alters
      gene accessibility.
    composed_of:
    - histone
    - chromatin_remodeling
    tier: 2
    source_domain: biology_ch16
  dna_methylation:
    defines: An epigenetic modification in which methyl groups are added to cytosines
      in CpG islands, usually silencing the associated gene.
    composed_of:
    - epigenetic_regulation
    tier: 2
    source_domain: biology_ch16
  tata_box:
    defines: A core promoter DNA sequence element that serves as the binding site
      for the TFIID transcription factor complex.
    composed_of:
    - promoter
    - transcription_factor
    tier: 1
    source_domain: biology_ch16
  enhancer:
    defines: A DNA segment, potentially distant from a gene, that binds specific transcription
      factors to increase transcription of that gene.
    composed_of:
    - transcription_factor
    - promoter
    tier: 1
    source_domain: biology_ch16
  transcriptional_repressor_eukaryotic:
    defines: A protein that binds to promoter or enhancer regions in eukaryotic cells
      to block transcription.
    composed_of:
    - promoter
    - enhancer
    - transcription_factor
    tier: 2
    source_domain: biology_ch16
  post_transcriptional_regulation:
    defines: Regulation of gene expression occurring after RNA transcription but before
      translation, including splicing and RNA stability control.
    composed_of:
    - transcription
    - translation
    tier: 1
    source_domain: biology_ch16
  rna_splicing:
    defines: The removal of introns from a pre-mRNA transcript by spliceosomes, joining
      exons together to form mature mRNA.
    composed_of:
    - post_transcriptional_regulation
    tier: 2
    source_domain: biology_ch16
  alternative_splicing:
    defines: A mechanism producing different protein products from one gene by combining
      different sets of exons into mature mRNA.
    composed_of:
    - rna_splicing
    tier: 3
    source_domain: biology_ch16
  rna_stability:
    defines: The length of time an RNA molecule remains intact in the cytoplasm before
      degradation, which influences protein output.
    composed_of:
    - post_transcriptional_regulation
    tier: 2
    source_domain: biology_ch16
  rna_binding_proteins:
    defines: Proteins that bind to the 5' or 3' untranslated regions of mRNA to increase
      or decrease RNA stability.
    composed_of:
    - rna_stability
    tier: 3
    source_domain: biology_ch16
  microrna_regulation:
    defines: Short RNA molecules that associate with the RISC complex and bind complementary
      mRNA sequences to impede translation or trigger mRNA degradation.
    composed_of:
    - translation
    - post_transcriptional_regulation
    tier: 2
    source_domain: biology_ch16
  translational_regulation:
    defines: Control of gene expression through regulation of the translation initiation
      complex that assembles on mRNA to begin protein synthesis.
    composed_of:
    - translation
    tier: 1
    source_domain: biology_ch16
  post_translational_regulation:
    defines: Regulation of gene expression after a protein has been synthesized, via
      chemical modifications that affect protein activity, location, or longevity.
    composed_of:
    - translation
    tier: 1
    source_domain: biology_ch16
  ubiquitination_degradation:
    defines: The addition of a ubiquitin tag to a protein marking it for degradation
      by the proteasome.
    composed_of:
    - post_translational_regulation
    tier: 2
    source_domain: biology_ch16
  tumor_suppressor_genes:
    defines: Genes such as p53 that are active in normal cells to prevent uncontrolled
      cell growth, and are often mutated in cancer.
    composed_of:
    - gene_expression
    tier: 1
    source_domain: biology_ch16
  oncogenes:
    defines: Mutated proto-oncogenes, such as myc, that cause uncontrolled cell growth
      and cancer when overexpressed or aberrantly activated.
    composed_of:
    - gene_expression
    tier: 1
    source_domain: biology_ch16
  biotechnology:
    defines: The use of biological agents for technological advancement, applied historically
      and modernly in medicine, agriculture, and industry.
    composed_of:
    - dna_rna_structure
    - genome
    tier: 1
    source_domain: biology_ch17
  dna_rna_extraction:
    defines: Techniques to isolate nucleic acids from cells by breaking open cell
      membranes and enzymatically destroying unwanted macromolecules.
    composed_of:
    - dna_rna_structure
    tier: 1
    source_domain: biology_ch17
  gel_electrophoresis:
    defines: A technique that separates nucleic acid or protein molecules by size
      using an electric field, exploiting their negative charge.
    composed_of:
    - dna_rna_structure
    tier: 1
    source_domain: biology_ch17
  pcr:
    defines: A technique to amplify specific DNA regions using primers, DNA polymerase,
      and repeated thermal cycling.
    composed_of:
    - dna_rna_extraction
    tier: 2
    source_domain: biology_ch17
  rt_pcr:
    defines: A PCR variant that first converts an RNA template into cDNA via reverse
      transcriptase before amplification.
    composed_of:
    - pcr
    tier: 3
    source_domain: biology_ch17
  blotting_techniques:
    defines: Techniques that transfer size-separated DNA (Southern) or RNA (Northern)
      fragments from a gel to a nylon membrane for detection with labeled probes.
    composed_of:
    - gel_electrophoresis
    tier: 2
    source_domain: biology_ch17
  molecular_cloning:
    defines: The process of reproducing desired DNA fragments by inserting them into
      plasmid vectors using restriction endonucleases and DNA ligase.
    composed_of:
    - restriction_endonuclease
    - plasmid
    tier: 1
    source_domain: biology_ch17
  recombinant_dna:
    defines: Artificially created DNA molecules formed by combining foreign DNA fragments
      with plasmid vectors, used to produce recombinant proteins.
    composed_of:
    - molecular_cloning
    tier: 2
    source_domain: biology_ch17
  cellular_cloning:
    defines: The natural production of identical cell populations through asexual
      replication (binary fission) of unicellular organisms.
    composed_of:
    - genome
    tier: 1
    source_domain: biology_ch17
  reproductive_cloning:
    defines: A technique for cloning an entire multicellular organism by transferring
      a diploid donor nucleus into an enucleated egg (somatic cell nuclear transfer).
    composed_of:
    - cellular_cloning
    tier: 2
    source_domain: biology_ch17
  genetic_engineering:
    defines: The alteration of an organism's genotype using recombinant DNA technology
      to achieve desirable traits, producing GMOs and transgenic organisms.
    composed_of:
    - recombinant_dna
    tier: 3
    source_domain: biology_ch17
  gene_targeting:
    defines: The use of recombinant DNA vectors to alter a gene's expression by introducing
      mutations or deleting part of the gene sequence.
    composed_of:
    - genetic_engineering
    tier: 4
    source_domain: biology_ch17
  genomics:
    defines: The study of entire genomes, including the complete set of genes, their
      sequence, organization, and interactions within and across species.
    composed_of:
    - genome
    tier: 1
    source_domain: biology_ch17
  linkage_analysis:
    defines: A procedure analyzing recombination frequency between genes to determine
      if they are linked or independently assorted.
    composed_of:
    - genetic_recombination
    tier: 1
    source_domain: biology_ch17
  genetic_markers:
    defines: Polymorphic chromosome regions (RFLPs, VNTRs, microsatellites, SNPs)
      used as landmarks for genetic mapping.
    composed_of:
    - dna_rna_structure
    tier: 1
    source_domain: biology_ch17
  physical_map:
    defines: A representation of the physical distance, in nucleotides, between genes
      or genetic markers, built via cytogenetic, radiation hybrid, or sequence mapping.
    composed_of:
    - genetic_markers
    - genome
    tier: 2
    source_domain: biology_ch17
  genome_mapping:
    defines: The process of finding the locations of genes on each chromosome by integrating
      genetic and physical maps.
    composed_of:
    - genetic_map
    - physical_map
    tier: 3
    source_domain: biology_ch17
  chain_termination_sequencing:
    defines: A DNA sequencing method using labeled dideoxynucleotides that terminate
      replication, producing fragments read by gel electrophoresis.
    composed_of:
    - dna_rna_structure
    - gel_electrophoresis
    tier: 2
    source_domain: biology_ch17
  shotgun_sequencing:
    defines: Sequencing strategies that randomly fragment DNA, sequence the pieces,
      and reassemble the genome by matching overlapping sequences into contigs.
    composed_of:
    - chain_termination_sequencing
    tier: 3
    source_domain: biology_ch17
  next_gen_sequencing:
    defines: Automated, massively parallel techniques for rapid, low-cost DNA sequencing
      of large numbers of short fragments.
    composed_of:
    - chain_termination_sequencing
    tier: 3
    source_domain: biology_ch17
  whole_genome_sequencing:
    defines: A process that determines an entire genome's DNA sequence, used to diagnose
      and treat genetic disease.
    composed_of:
    - shotgun_sequencing
    - next_gen_sequencing
    tier: 4
    source_domain: biology_ch17
  dna_microarray:
    defines: A method to detect gene expression by analyzing many DNA fragments fixed
      to a glass slide or silicon chip.
    composed_of:
    - genomics
    tier: 2
    source_domain: biology_ch17
  proteome:
    defines: The entire set of proteins that a given cell type produces, which varies
      dynamically unlike the constant genome.
    composed_of:
    - genome
    tier: 1
    source_domain: biology_ch17
  proteomics:
    defines: The study of the function of proteomes, complementing genomics by testing
      gene-based hypotheses at the protein level.
    composed_of:
    - proteome
    - genomics
    tier: 2
    source_domain: biology_ch17
  metabolomics:
    defines: The study of small molecule metabolites in an organism, comprising the
      complete metabolome related to genetic makeup.
    composed_of:
    - genomics
    tier: 2
    source_domain: biology_ch17
  protein_analysis_techniques:
    defines: Methods used to identify and determine the structure and characteristics
      of proteins for proteomic analysis.
    composed_of:
    - proteome
    tier: 2
    source_domain: biology_ch17
  systems_biology:
    defines: The study of whole biological systems (genomes and proteomes) based on
      the interactions within the system.
    composed_of:
    - genomics
    - proteomics
    tier: 3
    source_domain: biology_ch17
  gene_flow:
    defines: The movement of alleles across a species' geographic range through migration
      and interbreeding.
    composed_of:
    - gene_pool
    tier: 1
    source_domain: biology_ch18
    also_in:
    - biology_ch19
  natural_selection:
    defines: The more prolific reproduction of individuals with favorable heritable
      traits that survive environmental change, leading to evolutionary change.
    composed_of:
    - heritable_variation
    - mutation
    tier: 1
    source_domain: biology_ch18
    also_in:
    - biology_ch19
  species:
    defines: A group of individual organisms that interbreed and produce fertile,
      viable offspring.
    composed_of:
    - sexual_reproduction
    - gene_pool
    tier: 1
    source_domain: biology_ch18
  divergent_evolution:
    defines: The process by which groups of organisms evolve in diverse directions
      from a common ancestral point.
    composed_of:
    - natural_selection
    - gene_pool
    tier: 2
    source_domain: biology_ch18
  hybrid:
    defines: The offspring produced by mating between two closely related but separate
      species.
    composed_of:
    - species
    tier: 2
    source_domain: biology_ch18
  speciation:
    defines: The formation of two or more new species from one original species.
    composed_of:
    - species
    - gene_flow
    tier: 2
    source_domain: biology_ch18
    also_in:
    - biology_ch47
  reproductive_isolation:
    defines: The inability of populations to interbreed, making them reproductively
      independent species.
    composed_of:
    - species
    - gene_flow
    tier: 2
    source_domain: biology_ch18
  autopolyploidy:
    defines: Polyploidy in which an individual has multiple complete chromosome sets
      originating from its own species.
    composed_of:
    - polyploidy
    tier: 2
    source_domain: biology_ch18
  convergent_evolution:
    defines: The process by which similar traits evolve independently in species that
      do not share a recent common ancestor.
    composed_of:
    - adaptation
    tier: 3
    source_domain: biology_ch18
    also_in:
    - biology_ch23
  homologous_structures:
    defines: Parallel anatomical structures in diverse organisms that share a common
      ancestor.
    composed_of:
    - divergent_evolution
    tier: 3
    source_domain: biology_ch18
  allopatric_speciation:
    defines: Speciation that occurs via geographic separation of populations from
      a parent species.
    composed_of:
    - speciation
    - gene_flow
    tier: 3
    source_domain: biology_ch18
  sympatric_speciation:
    defines: Speciation that occurs within a parent species that remains in one shared
      location, without geographic separation.
    composed_of:
    - speciation
    tier: 3
    source_domain: biology_ch18
  allopolyploidy:
    defines: Polyploidy resulting from the combination of gametes from two different
      species.
    composed_of:
    - polyploidy
    - hybrid
    tier: 3
    source_domain: biology_ch18
  prezygotic_barrier:
    defines: A reproductive isolation mechanism that blocks reproduction before a
      zygote forms.
    composed_of:
    - reproductive_isolation
    tier: 3
    source_domain: biology_ch18
  postzygotic_barrier:
    defines: A reproductive isolation mechanism that acts after zygote formation,
      such as hybrid inviability or sterility.
    composed_of:
    - reproductive_isolation
    tier: 3
    source_domain: biology_ch18
  hybrid_zone:
    defines: An area where two closely related species continue to interact and reproduce,
      forming hybrid offspring.
    composed_of:
    - hybrid
    - reproductive_isolation
    tier: 3
    source_domain: biology_ch18
  gradual_speciation_model:
    defines: A model in which species diverge gradually over time through small incremental
      steps.
    composed_of:
    - speciation
    tier: 3
    source_domain: biology_ch18
  punctuated_equilibrium:
    defines: A model in which a new species changes rapidly from its parent species
      and then remains largely unchanged for long periods.
    composed_of:
    - speciation
    tier: 3
    source_domain: biology_ch18
  vestigial_structures:
    defines: Physical structures present in an organism that have no apparent function,
      remaining from a functional structure in a distant ancestor.
    composed_of:
    - homologous_structures
    tier: 4
    source_domain: biology_ch18
  analogous_structures:
    defines: Structures that are similar in function but evolved independently rather
      than from a common ancestor, resulting from convergent evolution.
    composed_of:
    - convergent_evolution
    tier: 4
    source_domain: biology_ch18
  dispersal:
    defines: An allopatric speciation process in which a few members of a species
      move to a new geographical area.
    composed_of:
    - allopatric_speciation
    tier: 4
    source_domain: biology_ch18
  vicariance:
    defines: An allopatric speciation process in which a natural event physically
      divides a population into separate groups.
    composed_of:
    - allopatric_speciation
    tier: 4
    source_domain: biology_ch18
  temporal_isolation:
    defines: A prezygotic barrier in which differences in breeding schedules prevent
      interbreeding between related species.
    composed_of:
    - prezygotic_barrier
    tier: 4
    source_domain: biology_ch18
  habitat_isolation:
    defines: Reproductive isolation resulting from populations occupying different
      habitats so they no longer overlap.
    composed_of:
    - prezygotic_barrier
    tier: 4
    source_domain: biology_ch18
  behavioral_isolation:
    defines: A prezygotic barrier in which differences in mating behaviors or signals
      prevent reproduction between species.
    composed_of:
    - prezygotic_barrier
    tier: 4
    source_domain: biology_ch18
  gametic_barrier:
    defines: A prezygotic barrier in which incompatibilities between egg and sperm
      cells prevent fertilization.
    composed_of:
    - prezygotic_barrier
    tier: 4
    source_domain: biology_ch18
  hybrid_inviability:
    defines: A postzygotic barrier in which hybrid offspring fail to develop normally
      and do not survive to maturity.
    composed_of:
    - postzygotic_barrier
    - hybrid
    tier: 4
    source_domain: biology_ch18
  hybrid_sterility:
    defines: A postzygotic barrier in which hybrid offspring survive but are unable
      to reproduce.
    composed_of:
    - postzygotic_barrier
    - hybrid
    tier: 4
    source_domain: biology_ch18
  reinforcement:
    defines: Continued divergence between two related species driven by the low fitness
      of their hybrid offspring.
    composed_of:
    - hybrid_zone
    tier: 4
    source_domain: biology_ch18
  fusion:
    defines: The recombination of two closely related species back into one species
      when reproductive barriers weaken.
    composed_of:
    - hybrid_zone
    tier: 4
    source_domain: biology_ch18
  gene_pool:
    defines: The sum of all the alleles present in a population.
    composed_of:
    - allele
    tier: 1
    source_domain: biology_ch19
    also_in:
    - biology_ch18
  allele_frequency:
    defines: The rate at which a specific allele appears within a population, calculated
      as the number of copies of that allele divided by all copies of the gene in
      the population.
    composed_of:
    - gene_pool
    tier: 2
    source_domain: biology_ch19
  population_genetics:
    defines: The study of how selective forces change allele and genotypic frequencies
      in a population over time.
    composed_of:
    - allele_frequency
    - natural_selection
    tier: 3
    source_domain: biology_ch19
  hardy_weinberg_principle:
    defines: A model stating that a population's allele and genotype frequencies remain
      inherently stable across generations unless an evolutionary force acts upon
      it, providing a mathematical baseline against which real populations can be
      compared.
    composed_of:
    - allele_frequency
    tier: 3
    source_domain: biology_ch19
  genetic_structure:
    defines: The distribution of the different possible genotypes within a population,
      derived mathematically from allele frequencies (p^2 + 2pq + q^2 = 1).
    composed_of:
    - hardy_weinberg_principle
    tier: 4
    source_domain: biology_ch19
  genetic_variability:
    defines: The diversity of alleles and genotypes present within a population.
    composed_of:
    - genetic_structure
    - mutation
    tier: 5
    source_domain: biology_ch19
  population_variation:
    defines: The distribution of different phenotypes among individuals in a population,
      arising from genetic structure and environmental factors.
    composed_of:
    - genetic_structure
    tier: 5
    source_domain: biology_ch19
  heritability:
    defines: The fraction of phenotypic variation in a population that can be attributed
      to genetic differences among individuals.
    composed_of:
    - population_variation
    tier: 6
    source_domain: biology_ch19
  inbreeding:
    defines: The mating of closely related individuals, which increases the likelihood
      of pairing rare deleterious recessive alleles and can cause inbreeding depression.
    composed_of:
    - genetic_variability
    tier: 6
    source_domain: biology_ch19
  genetic_drift:
    defines: A change in allele frequencies within a population due purely to chance
      rather than selective advantage.
    composed_of:
    - allele_frequency
    tier: 3
    source_domain: biology_ch19
  bottleneck_effect:
    defines: A magnification of genetic drift caused by a natural event or catastrophe
      that suddenly eliminates a large portion of a population's gene pool.
    composed_of:
    - genetic_drift
    tier: 4
    source_domain: biology_ch19
  founder_effect:
    defines: An allele frequency change that occurs when a small, non-representative
      subset of a population establishes a new, isolated population.
    composed_of:
    - genetic_drift
    tier: 4
    source_domain: biology_ch19
  nonrandom_mating:
    defines: A change in a population's gene pool that occurs when individuals preferentially
      mate with certain phenotypes rather than mating randomly.
    composed_of:
    - genetic_structure
    tier: 4
    source_domain: biology_ch19
  environmental_variation:
    defines: Phenotypic differences among individuals caused by environmental factors
      rather than genetic differences, which are not directly heritable but can still
      influence natural selection.
    composed_of:
    - population_variation
    - natural_selection
    tier: 6
    source_domain: biology_ch19
  cline:
    defines: A gradual variation in a species' phenotype across a geographic or ecological
      gradient, often maintained by gene flow between neighboring populations.
    composed_of:
    - gene_flow
    - population_variation
    tier: 6
    source_domain: biology_ch19
  adaptive_evolution:
    defines: The process by which natural selection increases the frequency of beneficial
      alleles and decreases the frequency of deleterious alleles in a population.
    composed_of:
    - natural_selection
    - allele_frequency
    tier: 3
    source_domain: biology_ch19
  evolutionary_fitness:
    defines: An individual's ability to survive and reproduce, measured by its genetic
      contribution to the next generation.
    composed_of:
    - natural_selection
    tier: 1
    source_domain: biology_ch19
  relative_fitness:
    defines: An individual's fitness measured in comparison to other individuals in
      the population, rather than in absolute terms.
    composed_of:
    - evolutionary_fitness
    tier: 2
    source_domain: biology_ch19
  stabilizing_selection:
    defines: Natural selection that favors an average phenotype and selects against
      extreme variation, decreasing a population's genetic variability.
    composed_of:
    - natural_selection
    - population_variation
    tier: 6
    source_domain: biology_ch19
  directional_selection:
    defines: Natural selection that favors phenotypes at one end of the existing variation
      spectrum, typically in response to environmental change.
    composed_of:
    - natural_selection
    - population_variation
    tier: 6
    source_domain: biology_ch19
  diversifying_selection:
    defines: Natural selection that favors two or more distinct phenotypes while selecting
      against intermediate phenotypes, increasing genetic variability.
    composed_of:
    - natural_selection
    - population_variation
    tier: 6
    source_domain: biology_ch19
  frequency_dependent_selection:
    defines: Natural selection that favors phenotypes because they are either common
      (positive) or rare (negative) in the population.
    composed_of:
    - natural_selection
    - allele_frequency
    tier: 3
    source_domain: biology_ch19
  sexual_selection:
    defines: Selection pressure arising from differences in reproductive success between
      males and females, often producing sexual dimorphism through mate competition
      or choice.
    composed_of:
    - natural_selection
    - relative_fitness
    tier: 3
    source_domain: biology_ch19
  phylogenetic_tree:
    defines: A diagram used to reflect evolutionary relationships among organisms
      or groups of organisms, considered a hypothesis of evolutionary history.
    composed_of:
    - phylogeny
    - branch_point
    tier: 1
    source_domain: biology_ch20
  systematics:
    defines: The field scientists use to organize and classify organisms based on
      evolutionary relationships.
    composed_of:
    - phylogeny
    - taxonomy
    tier: 1
    source_domain: biology_ch20
  taxonomic_classification_levels:
    defines: The hierarchical categories used to classify organisms with increasing
      specificity.
    composed_of:
    - taxonomy
    - taxon
    tier: 1
    source_domain: biology_ch20
  hgt_mechanisms_prokaryotes:
    defines: The processes by which prokaryotes exchange genetic material horizontally.
    composed_of:
    - horizontal_gene_transfer
    tier: 1
    source_domain: biology_ch20
  endosymbiont_theory:
    defines: The theory that mitochondria and chloroplasts originated as free-living
      prokaryotes that became permanent symbionts within primitive eukaryotic cells.
    composed_of:
    - horizontal_gene_transfer
    tier: 1
    source_domain: biology_ch20
  rooted_tree:
    defines: A phylogenetic tree with a single ancestral lineage from which all represented
      organisms relate.
    composed_of:
    - phylogenetic_tree
    tier: 2
    source_domain: biology_ch20
  basal_taxon:
    defines: A lineage that evolved early from the root and remains unbranched.
    composed_of:
    - phylogenetic_tree
    - taxon
    tier: 2
    source_domain: biology_ch20
  sister_taxa:
    defines: Two lineages that stem from the same branch point on a phylogenetic tree.
    composed_of:
    - phylogenetic_tree
    - branch_point
    tier: 2
    source_domain: biology_ch20
  polytomy:
    defines: A branch point on a phylogenetic tree with more than two lineages, indicating
      undetermined relationships.
    composed_of:
    - phylogenetic_tree
    - branch_point
    tier: 2
    source_domain: biology_ch20
  binomial_nomenclature:
    defines: A two-part scientific naming system for an organism consisting of its
      genus and species names.
    composed_of:
    - taxonomic_classification_levels
    tier: 2
    source_domain: biology_ch20
  molecular_systematics:
    defines: The use of molecular (DNA) data in taxonomy and biogeography to determine
      phylogenetic relationships.
    composed_of:
    - systematics
    tier: 2
    source_domain: biology_ch20
  cladistics:
    defines: A system that sorts organisms into clades by organizing their homologous
      traits to describe phylogenies.
    composed_of:
    - homology
    - phylogenetic_tree
    tier: 2
    source_domain: biology_ch20
  gene_transfer_agent:
    defines: A bacteriophage-like particle that transfers random genomic segments
      from one prokaryote species to another.
    composed_of:
    - hgt_mechanisms_prokaryotes
    tier: 2
    source_domain: biology_ch20
  genome_fusion:
    defines: The fusion of two prokaryotic genomes, presumably through endosymbiosis,
      proposed as a mechanism for eukaryotic evolution.
    composed_of:
    - endosymbiont_theory
    tier: 2
    source_domain: biology_ch20
  clade:
    defines: A group of organisms, including all descendants, that share a single
      common ancestor.
    composed_of:
    - cladistics
    - branch_point
    tier: 3
    source_domain: biology_ch20
  shared_ancestral_character:
    defines: A characteristic found in the ancestor of a group and present in all
      organisms of that taxon or clade.
    composed_of:
    - clade
    tier: 4
    source_domain: biology_ch20
  shared_derived_character:
    defines: A trait that arose at some point in evolution and is present only in
      a subset of a clade's descendants, not all ancestors.
    composed_of:
    - clade
    tier: 4
    source_domain: biology_ch20
  maximum_parsimony:
    defines: The principle that evolutionary events probably occurred in the simplest,
      most obvious way with the fewest major steps.
    composed_of:
    - shared_derived_character
    tier: 5
    source_domain: biology_ch20
  capsid:
    defines: The protein coating that covers the viral nucleic acid core, composed
      of protein subunits called capsomeres and classified into helical, icosahedral,
      and complex shapes.
    composed_of:
    - virion
    tier: 1
    source_domain: biology_ch21
  viral_receptor:
    defines: A molecule on the host cell surface, normally serving the cell's own
      physiological function, that a virus uses via glycoproteins to attach to and
      enter the cell.
    composed_of:
    - virion
    tier: 1
    source_domain: biology_ch21
  viral_origin_hypotheses:
    defines: Competing theories (regressive/devolution, progressive/escapist, and
      virus-first) proposed to explain how viruses originated, since viruses leave
      no fossil record.
    composed_of:
    - virus
    tier: 1
    source_domain: biology_ch21
  baltimore_classification:
    defines: A system that groups viruses into seven categories (Groups I-VII) based
      on their genome type and the pathway used to produce mRNA during replication.
    composed_of:
    - viral_genome
    tier: 1
    source_domain: biology_ch21
  viral_attenuation:
    defines: The laboratory weakening of a disease-causing virus, typically by growth
      under altered conditions, to create a live vaccine that induces immunity without
      significant disease.
    composed_of:
    - virus
    tier: 1
    source_domain: biology_ch21
  viral_envelope:
    defines: An outer membrane of protein and phospholipids derived from the host
      cell that surrounds the capsid in some viruses.
    composed_of:
    - capsid
    tier: 2
    source_domain: biology_ch21
  viral_classification_by_structure:
    defines: Earlier systems of grouping viruses based on nucleic acid type/structure
      and capsid morphology (naked or enveloped, icosahedral, helical, or complex).
    composed_of:
    - viral_genome
    - capsid
    tier: 2
    source_domain: biology_ch21
  dna_virus:
    defines: A virus whose genome consists of DNA, which directs the host cell's replication
      machinery to copy the genome and produce viral proteins.
    composed_of:
    - baltimore_classification
    tier: 2
    source_domain: biology_ch21
  rna_virus:
    defines: A virus whose genome consists of RNA, requiring virus-encoded enzymes
      to replicate the RNA (or convert it to DNA in retroviruses), leading to higher
      mutation rates.
    composed_of:
    - baltimore_classification
    tier: 2
    source_domain: biology_ch21
  viral_replication_cycle:
    defines: The sequence of steps (attachment, entry, uncoating, replication, assembly,
      egress) by which a virus uses host-cell processes to produce and release new
      virions.
    composed_of:
    - viral_receptor
    tier: 2
    source_domain: biology_ch21
  reverse_transcriptase:
    defines: A viral enzyme, found in Baltimore groups VI and VII, that transcribes
      RNA into DNA, a process not found in uninfected host cells.
    composed_of:
    - rna_virus
    tier: 3
    source_domain: biology_ch21
  cytopathic_effect:
    defines: Biochemical and structural changes to a host cell caused by viral replication,
      which can alter cell function or destroy the cell.
    composed_of:
    - viral_replication_cycle
    tier: 3
    source_domain: biology_ch21
  lytic_cycle:
    defines: A mode of viral replication in which new virions are produced and released
      by bursting (lysis) of the host cell.
    composed_of:
    - viral_replication_cycle
    tier: 3
    source_domain: biology_ch21
  lysogenic_cycle:
    defines: A mode of bacteriophage replication in which the viral genome is incorporated
      into the host cell's genome as a prophage and passed on to daughter cells without
      killing them.
    composed_of:
    - viral_replication_cycle
    tier: 3
    source_domain: biology_ch21
  animal_virus_entry:
    defines: The methods by which animal viruses enter host cells, including receptor-mediated
      endocytosis and, for enveloped viruses, membrane fusion.
    composed_of:
    - viral_receptor
    - viral_envelope
    tier: 3
    source_domain: biology_ch21
  retrovirus:
    defines: An RNA virus (Baltimore Group VI) that uses reverse transcriptase to
      convert its RNA genome into DNA, which is then integrated into the host genome.
    composed_of:
    - rna_virus
    - reverse_transcriptase
    tier: 4
    source_domain: biology_ch21
  latency:
    defines: A state in which a virus persists within host tissue for long periods
      without producing new virions, periodically reactivating to cause intermittent
      symptoms.
    composed_of:
    - lysogenic_cycle
    tier: 4
    source_domain: biology_ch21
  acute_vs_chronic_infection:
    defines: Patterns of viral disease course, ranging from short-term acute infection
      resolved by immune response, to persistent chronic infection, to infection without
      symptoms.
    composed_of:
    - viral_replication_cycle
    - latency
    tier: 5
    source_domain: biology_ch21
  domains_of_life:
    defines: The classification of all cellular life into Bacteria, Archaea, and Eukarya
      based on fundamental cellular differences.
    composed_of:
    - prokaryote
    - eukaryote
    tier: 1
    source_domain: biology_ch22
  microbial_mat:
    defines: A multi-layered sheet of prokaryotes held together by a secreted extracellular
      matrix, thought to represent the earliest forms of life on Earth.
    composed_of:
    - prokaryote
    - hydrothermal_vent
    tier: 1
    source_domain: biology_ch22
  extremophile:
    defines: A bacterium or archaean adapted to grow under extreme conditions such
      as high/low temperature, pH, salinity, or radiation.
    composed_of:
    - prokaryote
    - hydrothermal_vent
    tier: 1
    source_domain: biology_ch22
  vbnc_state:
    defines: A dormant survival state in which prokaryotes facing environmental stress
      remain alive but cannot be grown in culture until conditions improve.
    composed_of:
    - culturing_prokaryotes
    tier: 1
    source_domain: biology_ch22
  biofilm:
    defines: A microbial community held together by a gummy-textured polysaccharide
      matrix, typically growing attached to surfaces and more resistant to antibiotics
      than free-living cells.
    composed_of:
    - prokaryote
    tier: 1
    source_domain: biology_ch22
  prokaryotic_cell_structure:
    defines: The basic anatomy of a prokaryotic cell, including plasma membrane, cytoplasm,
      nucleoid with circular DNA, ribosomes, and optional cell wall, capsule, flagella,
      pili, and plasmids.
    composed_of:
    - prokaryote
    tier: 1
    source_domain: biology_ch22
  prokaryote_metabolic_diversity:
    defines: The wide range of energy- and carbon-acquisition strategies that allow
      prokaryotes to inhabit nearly every environment on Earth.
    composed_of:
    - macronutrients_micronutrients
    tier: 1
    source_domain: biology_ch22
  emerging_and_zoonotic_disease:
    defines: Diseases newly appearing or rapidly increasing in incidence/range, many
      of which originate in animals and transmit to humans.
    composed_of:
    - pathogen
    - disease_epidemiology_terms
    tier: 1
    source_domain: biology_ch22
  foodborne_disease:
    defines: Illness resulting from consumption of food contaminated with pathogenic
      bacteria, viruses, or other parasites.
    composed_of:
    - pathogen
    tier: 1
    source_domain: biology_ch22
  stromatolite:
    defines: A layered sedimentary structure formed when minerals are precipitated
      out of water by prokaryotes in a microbial mat, representing the earliest fossil
      record of life.
    composed_of:
    - microbial_mat
    tier: 2
    source_domain: biology_ch22
  ancient_atmosphere_oxygenation:
    defines: The transition of Earth's atmosphere from anoxic to oxygen-rich, driven
      by phototrophic and cyanobacterial photosynthesis, enabling evolution of aerobic
      life forms.
    composed_of:
    - microbial_mat
    tier: 2
    source_domain: biology_ch22
  archaeal_membrane_lipids:
    defines: Distinctive phytanyl-glycerol ether lipids that distinguish archaeal
      plasma membranes from bacterial fatty-acid-ester bilayers.
    composed_of:
    - prokaryotic_cell_structure
    tier: 2
    source_domain: biology_ch22
  horizontal_gene_transfer:
    defines: The transfer of genetic material between prokaryotes outside of reproduction,
      occurring via transformation, transduction, or conjugation.
    composed_of:
    - binary_fission
    - prokaryotic_cell_structure
    tier: 2
    source_domain: biology_ch22
    also_in:
    - biology_ch20
  energy_and_carbon_source_classification:
    defines: The classification of prokaryotes by their energy source and carbon source,
      combined into nutritional types like photoautotroph and chemoheterotroph.
    composed_of:
    - prokaryote_metabolic_diversity
    tier: 2
    source_domain: biology_ch22
  peptidoglycan:
    defines: A material composed of polysaccharide chains cross-linked by unusual
      peptides that forms the primary component of bacterial cell walls.
    composed_of:
    - cell_wall
    tier: 3
    source_domain: biology_ch22
  archaeal_cell_wall:
    defines: The cell wall of Archaea, which lacks peptidoglycan and instead may be
      composed of pseudopeptidoglycan, polysaccharides, glycoproteins, or protein.
    composed_of:
    - cell_wall
    tier: 3
    source_domain: biology_ch22
  carbon_cycle:
    defines: The movement of carbon between atmosphere, land, water, and organisms,
      driven by producers, consumers, and decomposers, with prokaryotes playing key
      roles.
    composed_of:
    - energy_and_carbon_source_classification
    tier: 3
    source_domain: biology_ch22
    also_in:
    - biology_ch46
  nitrogen_cycle:
    defines: The cycling of nitrogen between atmospheric N2, ammonia, ammonium, nitrite,
      and nitrate through nitrogen fixation, nitrification, ammonification, and denitrification,
      largely carried out by prokaryotes.
    composed_of:
    - energy_and_carbon_source_classification
    tier: 3
    source_domain: biology_ch22
    also_in:
    - biology_ch46
  antibiotic_resistance:
    defines: The evolution of bacterial populations to survive antibiotic exposure
      through natural selection and gene transfer, driven largely by overuse of antibiotics.
    composed_of:
    - pathogen
    - horizontal_gene_transfer
    tier: 3
    source_domain: biology_ch22
  gram_staining:
    defines: A staining method that distinguishes bacteria based on cell wall structure
      into Gram-positive and Gram-negative groups.
    composed_of:
    - peptidoglycan
    tier: 4
    source_domain: biology_ch22
  eukaryote:
    defines: An organism whose cells possess a nucleus along with mitochondria, a
      cytoskeleton, histone-bound chromosomes, mitosis, and (typically) sexual reproduction,
      all descended from a single last common ancestor.
    composed_of:
    - nucleus
    - cytoskeleton
    - histone_chromosomes
    - mitosis
    - sexual_reproduction
    tier: 1
    source_domain: biology_ch23
    also_in:
    - biology_ch22
  endosymbiotic_theory:
    defines: Margulis's theory that eukaryotic organelles arose when one cell engulfed
      another and the two coevolved until they shared genetic control of a mutualistic
      metabolic pathway.
    composed_of:
    - endosymbiosis
    - eukaryote
    tier: 2
    source_domain: biology_ch23
  primary_endosymbiosis:
    defines: The direct engulfment of a cyanobacterium by a eukaryotic host cell,
      giving rise to plastids surrounded by two membranes.
    composed_of:
    - endosymbiotic_theory
    - prokaryotic_metabolism
    tier: 3
    source_domain: biology_ch23
  plastid_chloroplast:
    defines: Photosynthetic organelles, rich in chlorophyll and accessory pigments,
      derived from cyanobacterial endosymbionts via primary endosymbiosis.
    composed_of:
    - primary_endosymbiosis
    tier: 4
    source_domain: biology_ch23
  secondary_endosymbiosis:
    defines: The engulfment of an already photosynthetic eukaryote (bearing a primary
      plastid) by another eukaryotic host, producing plastids surrounded by three
      or more membranes.
    composed_of:
    - plastid_chloroplast
    - eukaryote
    tier: 5
    source_domain: biology_ch23
  protist:
    defines: A catchall term for eukaryotic organisms that are not classified as animals,
      plants, or fungi, encompassing enormous diversity in cell structure, metabolism,
      and life cycle.
    composed_of:
    - eukaryote
    tier: 2
    source_domain: biology_ch23
  phagocytosis:
    defines: A feeding process in which the cell membrane engulfs a food particle
      into a food vacuole that fuses with a lysosome to digest it.
    composed_of:
    - protist
    tier: 3
    source_domain: biology_ch23
  mixotroph:
    defines: A nutritional strategy in which an organism obtains nutrition by both
      photoautotrophic and heterotrophic means depending on conditions.
    composed_of:
    - protist
    - plastid_chloroplast
    tier: 5
    source_domain: biology_ch23
  taxis:
    defines: Directed movement of a motile protist toward or away from a stimulus,
      such as light (phototaxis).
    composed_of:
    - protist
    - flagella_cilia
    tier: 3
    source_domain: biology_ch23
  alternation_of_generations:
    defines: A life cycle strategy, seen in some algae and plants, in which both multicellular
      haploid (gametophyte) and multicellular diploid (sporophyte) stages occur.
    composed_of:
    - protist
    - sexual_reproduction
    tier: 3
    source_domain: biology_ch23
    also_in:
    - biology_ch25
    - biology_ch26
    - biology_ch32
  eukaryotic_supergroups:
    defines: A classification scheme dividing domain Eukarya into six proposed monophyletic
      supergroups (Archaeplastida, Amoebozoa, Opisthokonta, Rhizaria, Chromalveolata,
      Excavata) based on shared ancestry and cell structure.
    composed_of:
    - protist
    - secondary_endosymbiosis
    tier: 6
    source_domain: biology_ch23
  coenocytic_hypha:
    defines: A hypha lacking septa that contains many nuclei within a continuous cytoplasm.
    composed_of:
    - hypha
    - septum
    tier: 1
    source_domain: biology_ch24
  mycelium:
    defines: The mass of interwoven hyphae that forms the vegetative body of a multicellular
      fungus.
    composed_of:
    - hypha
    tier: 1
    source_domain: biology_ch24
  yeast:
    defines: A unicellular form of fungus that can reproduce by budding and, in some
      species, switch between unicellular and multicellular (dimorphic) growth.
    composed_of:
    - fungus
    - eukaryotic_cell_structure
    tier: 1
    source_domain: biology_ch24
  asexual_reproduction:
    defines: Reproduction by fragmentation, budding, or production of genetically
      identical spores (e.g., conidiospores, sporangiospores) without fusion of gametes.
    composed_of:
    - spore
    - hypha
    - yeast
    tier: 2
    source_domain: biology_ch24
    also_in:
    - biology_ch32
    - biology_ch43
  fungal_phyla_classification:
    defines: The organization of true fungi into five phyla based primarily on mode
      of sexual reproduction and molecular (18S rRNA) data.
    composed_of:
    - sexual_reproduction
    tier: 2
    source_domain: biology_ch24
  chytridiomycota:
    defines: The most primitive fungal phylum, mostly aquatic, uniquely retaining
      flagellated gametes and zoospores.
    composed_of:
    - fungal_phyla_classification
    tier: 3
    source_domain: biology_ch24
  zygomycota:
    defines: A phylum with coenocytic hyphae that reproduces sexually via conjugation,
      forming a thick-walled zygospore.
    composed_of:
    - fungal_phyla_classification
    - coenocytic_hypha
    tier: 3
    source_domain: biology_ch24
  ascomycota:
    defines: The largest fungal phylum, characterized by production of haploid ascospores
      within a sac-like ascus.
    composed_of:
    - fungal_phyla_classification
    tier: 3
    source_domain: biology_ch24
  basidiomycota:
    defines: A phylum recognized by club-shaped basidia that produce basidiospores,
      typically borne on gilled fruiting bodies (mushrooms).
    composed_of:
    - fungal_phyla_classification
    tier: 3
    source_domain: biology_ch24
  glomeromycota:
    defines: A phylum of fungi lacking sexual reproduction that forms obligate arbuscular
      mycorrhizal associations with plant roots.
    composed_of:
    - fungal_phyla_classification
    tier: 3
    source_domain: biology_ch24
  mutualism:
    defines: A symbiotic relationship in which both participating organisms benefit
      from the association.
    composed_of:
    - symbiosis
    tier: 1
    source_domain: biology_ch24
  mycorrhiza:
    defines: A mutualistic association between fungal hyphae and vascular plant roots
      in which the fungus supplies water and minerals in exchange for photosynthetic
      carbohydrates.
    composed_of:
    - mutualism
    - hypha
    tier: 2
    source_domain: biology_ch24
  lichen:
    defines: A stable mutualistic association between a fungus and a photosynthetic
      partner (alga or cyanobacterium) that together form a distinct composite organism.
    composed_of:
    - mutualism
    - fungus
    tier: 2
    source_domain: biology_ch24
  fungal_decomposition_ecology:
    defines: The ecological role of fungi as saprobes that break down organic matter
      and release essential elements back into ecosystems.
    composed_of:
    - heterotrophic_nutrition
    - mycelium
    tier: 2
    source_domain: biology_ch24
  parasitism:
    defines: A symbiotic relationship in which one organism benefits at the expense
      of the other, which may or may not develop disease.
    composed_of:
    - symbiosis
    tier: 1
    source_domain: biology_ch24
  mycosis:
    defines: A fungal disease resulting from direct infection and tissue damage, classified
      as superficial, systemic, or opportunistic.
    composed_of:
    - parasitism
    tier: 2
    source_domain: biology_ch24
  fungal_toxins:
    defines: Poisoning of humans or animals by fungal-produced toxins, either through
      contaminated food (mycotoxicosis) or ingestion of poisonous mushrooms (mycetismus).
    composed_of:
    - heterotrophic_nutrition
    tier: 1
    source_domain: biology_ch24
  charophytes:
    defines: The green algal group (Charales, Coleochaetales, Zygnematales) considered
      the closest algal relatives of land plants based on shared traits and DNA analysis.
    composed_of:
    - green_algae
    tier: 1
    source_domain: biology_ch25
  homospory_heterospory:
    defines: The distinction between producing one spore type (homosporous) versus
      two differently sized spore types, microspores and megaspores (heterosporous).
    composed_of:
    - sporangium
    tier: 1
    source_domain: biology_ch25
  stomata:
    defines: Pores that open and close via guard cells to regulate gas and water vapor
      exchange while limiting water loss.
    composed_of:
    - cuticle
    - desiccation
    tier: 1
    source_domain: biology_ch25
  vascular_tissue:
    defines: Conductive tissue system consisting of lignified xylem, which transports
      water and minerals, and phloem, which transports photosynthetic sugars.
    composed_of:
    - lignin
    tier: 1
    source_domain: biology_ch25
    also_in:
    - biology_ch30
  streptophytes:
    defines: A monophyletic group comprising land plants and charophyte green algae,
      distinguished from chlorophytes by phragmoplasts, plasmodesmata, and apical
      growth.
    composed_of:
    - charophytes
    - apical_meristem
    tier: 2
    source_domain: biology_ch25
  land_plant_adaptations:
    defines: The suite of four traits—alternation of generations, apical meristems,
      cuticle, and lignified cell walls—that enabled plants to survive on land.
    composed_of:
    - alternation_of_generations
    - apical_meristem
    - cuticle
    - lignin
    tier: 2
    source_domain: biology_ch25
  roots:
    defines: Vascularized organs that anchor plants and absorb water and minerals
      from soil, replacing the simple rhizoids of non-vascular plants.
    composed_of:
    - vascular_tissue
    tier: 2
    source_domain: biology_ch25
  leaves:
    defines: Photosynthetic organs with vascular veins, occurring as small single-veined
      microphylls or larger multi-veined megaphylls.
    composed_of:
    - vascular_tissue
    tier: 2
    source_domain: biology_ch25
  non_vascular_plants:
    defines: Seedless land plants (liverworts, hornworts, mosses) lacking vascular
      tissue, with a dominant gametophyte stage dependent on water for fertilization.
    composed_of:
    - gametophyte
    - land_plant_adaptations
    tier: 3
    source_domain: biology_ch25
  seedless_vascular_plants:
    defines: Plants possessing vascular tissue, roots, and leaves but no seeds, with
      a dominant sporophyte stage still requiring water for flagellated sperm to reach
      eggs.
    composed_of:
    - vascular_tissue
    - roots
    - leaves
    - sporophyte
    tier: 3
    source_domain: biology_ch25
  sporophylls_and_strobili:
    defines: Leaves structurally modified to bear sporangia, sometimes clustered into
      cone-like strobili.
    composed_of:
    - leaves
    - sporangium
    tier: 3
    source_domain: biology_ch25
  integument:
    defines: The layer of sporophyte tissue surrounding the megasporangium (and later
      the embryo) that protects the developing seed.
    composed_of:
    - sporophyte
    tier: 1
    source_domain: biology_ch26
  pollen_grain:
    defines: A small, desiccation-resistant male gametophyte encased in a protective
      wall, allowing sperm to be transported to the female gametophyte without water.
    composed_of:
    - gametophyte
    - heterospory
    tier: 1
    source_domain: biology_ch26
  ovule:
    defines: The structure containing the megasporangium and female gametophyte, protected
      by integument tissue, that develops into a seed after fertilization.
    composed_of:
    - gametophyte
    - heterospory
    - integument
    tier: 2
    source_domain: biology_ch26
  pollination:
    defines: The transfer of pollen from the anther (or male cone) to the stigma (or
      female cone), initiating pollen tube growth toward the egg.
    composed_of:
    - pollen_grain
    - ovule
    tier: 3
    source_domain: biology_ch26
    also_in:
    - biology_ch32
  seed:
    defines: A structure containing an embryo, a nutrient storage tissue, and a protective
      coat, derived from a fertilized ovule, that permits dispersal through space
      and dormancy through time.
    composed_of:
    - ovule
    - pollination
    tier: 4
    source_domain: biology_ch26
  strobilus:
    defines: A tight, cone-like arrangement of sporophylls around a central stalk
      that houses the male or female reproductive structures in gymnosperms.
    composed_of:
    - sporophyte
    - ovule
    - pollen_grain
    tier: 2
    source_domain: biology_ch26
  gymnosperm:
    defines: A seed plant group bearing "naked" seeds not enclosed in an ovary, sheltered
      instead by modified leaves called sporophylls.
    composed_of:
    - seed
    - strobilus
    tier: 5
    source_domain: biology_ch26
  flower:
    defines: A specialized reproductive shoot of modified leaves (sepals, petals,
      stamens, carpels) that encloses and protects developing gametes and the embryo
      in angiosperms.
    composed_of:
    - sporophyte
    - ovule
    - pollen_grain
    tier: 2
    source_domain: biology_ch26
  double_fertilization:
    defines: A reproductive process unique to angiosperms in which one sperm fertilizes
      the egg to form the diploid zygote while a second sperm fuses with two polar
      nuclei to form the triploid endosperm.
    composed_of:
    - flower
    - pollination
    tier: 4
    source_domain: biology_ch26
    also_in:
    - biology_ch32
  fruit:
    defines: Tissue derived from the thickened ovary wall (and sometimes adjacent
      tissue) that protects the developing seed and facilitates its dispersal.
    composed_of:
    - flower
    - double_fertilization
    tier: 5
    source_domain: biology_ch26
  angiosperm:
    defines: A seed plant phylum (Anthophyta) that produces both flowers and fruit,
      making it the most diverse and dominant group of terrestrial plants.
    composed_of:
    - flower
    - fruit
    - seed
    - double_fertilization
    tier: 6
    source_domain: biology_ch26
  basal_angiosperm:
    defines: A group of angiosperms believed to have branched off before the split
      of monocots and eudicots, exhibiting traits of both.
    composed_of:
    - angiosperm
    tier: 7
    source_domain: biology_ch26
  monocot:
    defines: An angiosperm group characterized by a single cotyledon, parallel leaf
      veins, scattered stem vascular tissue, and monosulcate pollen.
    composed_of:
    - angiosperm
    tier: 7
    source_domain: biology_ch26
  eudicot:
    defines: An angiosperm group characterized by two cotyledons, netted leaf veins,
      ring-arranged stem vascular tissue, and trisulcate pollen.
    composed_of:
    - angiosperm
    tier: 7
    source_domain: biology_ch26
  monoecious_dioecious:
    defines: A classification of plants based on whether male and female reproductive
      structures occur on the same individual (monoecious) or on separate individuals
      (dioecious).
    composed_of:
    - strobilus
    - flower
    tier: 3
    source_domain: biology_ch26
    also_in:
    - biology_ch32
  asexual_and_uniparental_reproduction:
    defines: Reproductive modes producing offspring without fusion of two gametes
    composed_of:
    - fertilization_and_zygote
    tier: 1
    source_domain: biology_ch27
  cleavage:
    defines: Mitotic divisions of the zygote subdividing the egg into blastomeres
      through morula and blastula stages
    composed_of:
    - fertilization_and_zygote
    tier: 1
    source_domain: biology_ch27
    also_in:
    - biology_ch43
  gastrulation:
    defines: Rearrangement of the blastula into a gastrula, forming the archenteron
      and germ layers
    composed_of:
    - cleavage
    tier: 2
    source_domain: biology_ch27
    also_in:
    - biology_ch43
  germ_layers:
    defines: Embryonic cell layers (ectoderm, mesoderm, endoderm) established during
      gastrulation
    composed_of:
    - gastrulation
    tier: 3
    source_domain: biology_ch27
    also_in:
    - biology_ch43
  organogenesis:
    defines: Development of germ layers into specific tissue types, organs, and organ
      systems
    composed_of:
    - germ_layers
    tier: 4
    source_domain: biology_ch27
    also_in:
    - biology_ch43
  diploblasty_triploblasty:
    defines: Classification by number of germ layers formed (two vs. three including
      mesoderm)
    composed_of:
    - germ_layers
    tier: 4
    source_domain: biology_ch27
  metamorphosis:
    defines: Post-embryonic transformation from larval to adult form
    composed_of:
    - organogenesis
    tier: 5
    source_domain: biology_ch27
  hox_genes:
    defines: Homeobox gene cluster determining body segmentation, appendage placement,
      and axis directionality
    composed_of:
    - organogenesis
    tier: 5
    source_domain: biology_ch27
  coelom:
    defines: Mesoderm-derived body cavity between gut and body wall
    composed_of:
    - diploblasty_triploblasty
    tier: 5
    source_domain: biology_ch27
  coelom_type_classification:
    defines: Subdivision of triploblasts into acoelomate, pseudocoelomate, and eucoelomate
    composed_of:
    - coelom
    tier: 6
    source_domain: biology_ch27
  protostome_deuterostome:
    defines: Developmental lineages distinguished by blastopore fate, cleavage pattern,
      and coelom formation
    composed_of:
    - coelom_type_classification
    - cleavage
    tier: 7
    source_domain: biology_ch27
  animal_clade_hierarchy:
    defines: Nested classification of animal groups from tissue differentiation, symmetry,
      and developmental features
    composed_of:
    - differentiated_tissue
    - body_symmetry
    - protostome_deuterostome
    - phylogeny_and_evidence
    tier: 8
    source_domain: biology_ch27
  parazoa:
    defines: A clade of the simplest invertebrates, including Placozoa and Porifera,
      that lack true embryologically homologous tissues.
    composed_of:
    - invertebrate
    tier: 1
    source_domain: biology_ch28
  phylum_cnidaria:
    defines: A phylum of diploblastic, radially symmetrical animals with stinging
      cnidocytes, existing as polyp or medusa body forms.
    composed_of:
    - invertebrate
    - diploblastic
    - cnidocyte
    tier: 1
    source_domain: biology_ch28
  superphylum_lophotrochozoa:
    defines: A protostome superphylum of triploblastic, bilaterally symmetrical animals
      often possessing a lophophore or trochophore larva.
    composed_of:
    - triploblastic_bilateral
    - protostomy
    - lophophore_trochophore
    tier: 1
    source_domain: biology_ch28
  coelom_types:
    defines: Classification of body cavity organization based on whether and how a
      mesoderm-lined cavity separates the ectoderm and endoderm.
    composed_of:
    - triploblastic_bilateral
    tier: 1
    source_domain: biology_ch28
  superphylum_ecdysozoa:
    defines: A monophyletic superphylum of animals sharing a molted cuticle and undergoing
      ecdysis during growth.
    composed_of:
    - triploblastic_bilateral
    - protostomy
    - cuticle_ecdysis
    tier: 1
    source_domain: biology_ch28
  superphylum_deuterostomia:
    defines: A superphylum defined by embryonic development in which the anus forms
      from the blastopore and the mouth forms secondarily.
    composed_of:
    - triploblastic_bilateral
    - deuterostome_development
    tier: 1
    source_domain: biology_ch28
  phylum_porifera:
    defines: A phylum of simple, sessile, filter-feeding invertebrates whose bodies
      lack true tissues but contain specialized cells organized around water-canal
      systems.
    composed_of:
    - parazoa
    - choanocyte
    tier: 2
    source_domain: biology_ch28
  polyp_medusa_body_forms:
    defines: The two distinct cnidarian body plans—sessile tubular polyps and motile
      bell-shaped medusae—that can alternate within a life cycle.
    composed_of:
    - phylum_cnidaria
    tier: 2
    source_domain: biology_ch28
  incomplete_digestive_system:
    defines: A digestive arrangement with a single opening serving as both mouth and
      anus, found in cnidarians and most flatworms.
    composed_of:
    - phylum_cnidaria
    tier: 2
    source_domain: biology_ch28
  schizocoelom:
    defines: A protostomic coelom formed when mesoderm-producing cells migrate into
      the blastocoel and split to form a body cavity.
    composed_of:
    - coelom_types
    - protostomy
    tier: 2
    source_domain: biology_ch28
  phylum_rotifera:
    defines: A phylum of microscopic, mostly aquatic pseudocoelomate animals characterized
      by a ciliated corona used for feeding.
    composed_of:
    - superphylum_lophotrochozoa
    - coelom_types
    tier: 2
    source_domain: biology_ch28
  phylum_nemertea:
    defines: A phylum of predominantly marine, unsegmented worms possessing an eversible
      proboscis and a closed circulatory system.
    composed_of:
    - superphylum_lophotrochozoa
    - coelom_types
    tier: 2
    source_domain: biology_ch28
  phylum_nematoda:
    defines: A phylum of triploblastic, pseudocoelomate, cylindrical worms with a
      complete digestive system, including free-living and parasitic species.
    composed_of:
    - superphylum_ecdysozoa
    - coelom_types
    tier: 2
    source_domain: biology_ch28
  phylum_tardigrada:
    defines: A phylum of tiny, cuticle-covered animals with four pairs of clawed legs
      capable of entering cryptobiosis to survive extreme conditions.
    composed_of:
    - superphylum_ecdysozoa
    tier: 2
    source_domain: biology_ch28
  phylum_arthropoda:
    defines: The largest animal phylum, characterized by a segmented body, chitinous
      exoskeleton, and jointed appendages.
    composed_of:
    - superphylum_ecdysozoa
    - metamerism
    tier: 2
    source_domain: biology_ch28
  phylum_echinodermata:
    defines: A phylum of marine, bottom-dwelling deuterostomes with pentaradial symmetry,
      a calcareous endoskeleton, and a unique water vascular system.
    composed_of:
    - superphylum_deuterostomia
    tier: 2
    source_domain: biology_ch28
  phylum_chordata:
    defines: A phylum defined by the presence of a notochord, dorsal hollow nerve
      cord, pharyngeal slits, post-anal tail, and endostyle at some developmental
      stage.
    composed_of:
    - superphylum_deuterostomia
    tier: 2
    source_domain: biology_ch28
  sponge_spicules:
    defines: Skeletal structures made of calcium carbonate or silica within the mesohyl
      that support and defend the sponge body.
    composed_of:
    - phylum_porifera
    tier: 3
    source_domain: biology_ch28
  sponge_reproduction:
    defines: The sexual and asexual reproductive strategies used by sponges, most
      of which are monoecious.
    composed_of:
    - phylum_porifera
    tier: 3
    source_domain: biology_ch28
  phylum_platyhelminthes:
    defines: A phylum of acoelomate, triploblastic worms including free-living and
      parasitic forms with an incomplete or absent digestive system.
    composed_of:
    - superphylum_lophotrochozoa
    - coelom_types
    - incomplete_digestive_system
    tier: 3
    source_domain: biology_ch28
  phylum_mollusca:
    defines: A large phylum of soft-bodied, unsegmented protostomes with a muscular
      foot, visceral mass, mantle, and often a radula and shell.
    composed_of:
    - superphylum_lophotrochozoa
    - schizocoelom
    tier: 3
    source_domain: biology_ch28
  phylum_annelida:
    defines: A phylum of bilaterally symmetrical protostomes exhibiting true metameric
      segmentation of internal and external structures.
    composed_of:
    - superphylum_lophotrochozoa
    - metamerism
    - schizocoelom
    tier: 3
    source_domain: biology_ch28
  cryptobiosis:
    defines: A suspended metabolic state allowing tardigrades to survive desiccation,
      extreme temperature, radiation, and other environmental stresses.
    composed_of:
    - phylum_tardigrada
    tier: 3
    source_domain: biology_ch28
  arthropod_exoskeleton:
    defines: A layered chitinous covering that provides protection, support, and flexibility
      while requiring molting for growth.
    composed_of:
    - cuticle_ecdysis
    - phylum_arthropoda
    tier: 3
    source_domain: biology_ch28
  tagmata_appendages:
    defines: Fused groups of body segments forming functional regions bearing specialized
      jointed appendages.
    composed_of:
    - phylum_arthropoda
    - metamerism
    tier: 3
    source_domain: biology_ch28
  water_vascular_system:
    defines: A hydraulic system unique to echinoderms using seawater to power tube
      feet for locomotion, feeding, and gas exchange.
    composed_of:
    - phylum_echinodermata
    tier: 3
    source_domain: biology_ch28
  molluscan_body_plan:
    defines: The shared anatomical organization of mollusks consisting of a locomotor
      foot, organ-containing visceral mass, shell-secreting mantle, and feeding radula.
    composed_of:
    - phylum_mollusca
    tier: 4
    source_domain: biology_ch28
  gastropod_torsion:
    defines: An embryonic developmental process in some gastropods in which the mantle
      and visceral mass rotate to bring the anus near the head.
    composed_of:
    - molluscan_body_plan
    tier: 5
    source_domain: biology_ch28
  chordata:
    defines: The phylum of deuterostome animals defined by possessing a notochord,
      dorsal hollow nerve cord, pharyngeal slits, post-anal tail, and endostyle at
      some developmental stage.
    composed_of:
    - notochord
    - dorsal_hollow_nerve_cord
    - pharyngeal_slits
    - post_anal_tail
    - endostyle
    tier: 1
    source_domain: biology_ch29
  vertebral_column:
    defines: A series of separate, irregularly shaped bones joined together to form
      a backbone, replacing the notochord in vertebrates.
    composed_of:
    - notochord
    tier: 1
    source_domain: biology_ch29
    also_in:
    - biology_ch38
  vertebrata_craniata:
    defines: The clade of chordates possessing a cranium and (in most members) a vertebral
      column, distinguishing them from invertebrate chordates.
    composed_of:
    - chordata
    - cranium
    - vertebral_column
    tier: 2
    source_domain: biology_ch29
  cephalochordata_urochordata:
    defines: The two invertebrate chordate clades—lancelets and tunicates—that possess
      the five chordate characteristics at some life stage but lack a cranium.
    composed_of:
    - chordata
    tier: 2
    source_domain: biology_ch29
  gnathostomes:
    defines: Vertebrates possessing true hinged jaws, derived from the first gill
      arch, allowing active predation.
    composed_of:
    - vertebrata_craniata
    tier: 3
    source_domain: biology_ch29
  agnatha:
    defines: The clade of jawless craniates, including hagfishes and lampreys, lacking
      jaws and paired fins.
    composed_of:
    - vertebrata_craniata
    tier: 3
    source_domain: biology_ch29
  tetrapods:
    defines: Vertebrates with a four-limbed evolutionary history, including amphibians,
      reptiles, birds, and mammals.
    composed_of:
    - gnathostomes
    tier: 4
    source_domain: biology_ch29
  cartilaginous_bony_fishes:
    defines: The two major gnathostome clades of fishes, distinguished by cartilaginous
      versus bony skeletons.
    composed_of:
    - gnathostomes
    tier: 4
    source_domain: biology_ch29
  swim_bladder:
    defines: A gas-filled organ in bony fishes, derived from the gut, that controls
      buoyancy and is homologous to lungs.
    composed_of:
    - cartilaginous_bony_fishes
    tier: 5
    source_domain: biology_ch29
  amphibian_life_cycle:
    defines: The dual aquatic-terrestrial life cycle of amphibians, involving a larval
      stage, metamorphosis, and moist permeable skin used for cutaneous respiration.
    composed_of:
    - tetrapods
    - ectothermy_endothermy
    tier: 5
    source_domain: biology_ch29
  tetrapod_evolution:
    defines: The evolutionary transition from lobe-finned fishes to limbed terrestrial
      vertebrates, documented by transitional fossils.
    composed_of:
    - cartilaginous_bony_fishes
    - tetrapods
    tier: 5
    source_domain: biology_ch29
  amniotic_egg:
    defines: A terrestrially adapted egg with four extraembryonic membranes that reduces
      dependence on water for embryonic development.
    composed_of:
    - tetrapods
    tier: 5
    source_domain: biology_ch29
  amniotes:
    defines: Tetrapods whose eggs contain four extraembryonic membranes enabling terrestrial
      reproduction.
    composed_of:
    - tetrapods
    - amniotic_egg
    tier: 6
    source_domain: biology_ch29
  synapsid_anapsid_diapsid:
    defines: The three amniote lineages distinguished by their skull temporal fenestrae,
      giving rise respectively to mammals, extinct forms, and reptiles/birds.
    composed_of:
    - amniotes
    - temporal_fenestrae
    tier: 7
    source_domain: biology_ch29
  reptile_characteristics:
    defines: Traits of reptiles including scaly keratinized skin, lung-based respiration,
      ectothermy, and shelled eggs laid on land.
    composed_of:
    - amniotes
    - ectothermy_endothermy
    tier: 7
    source_domain: biology_ch29
  archosaur_diversification:
    defines: The diapsid lineage that diverged into dinosaurs, pterosaurs, crocodilians,
      and birds during the Mesozoic.
    composed_of:
    - synapsid_anapsid_diapsid
    tier: 8
    source_domain: biology_ch29
  modern_reptile_clades:
    defines: The four living nonavian reptile clades—Crocodilia, Sphenodontia, Squamata,
      and Testudines.
    composed_of:
    - reptile_characteristics
    - synapsid_anapsid_diapsid
    tier: 8
    source_domain: biology_ch29
  mammal_characteristics:
    defines: Distinguishing mammalian traits including hair, mammary glands, a single-boned
      lower jaw, heterodont diphyodont teeth, and a four-chambered heart.
    composed_of:
    - hair
    - mammary_glands
    - synapsid_anapsid_diapsid
    tier: 8
    source_domain: biology_ch29
  bird_flight_adaptations:
    defines: Skeletal, muscular, and respiratory modifications in birds that enable
      powered flight.
    composed_of:
    - feathers
    - archosaur_diversification
    tier: 9
    source_domain: biology_ch29
  bird_evolution:
    defines: The evolutionary origin of birds within maniraptoran theropod dinosaurs,
      evidenced by transitional fossils such as Archaeopteryx.
    composed_of:
    - archosaur_diversification
    - feathers
    tier: 9
    source_domain: biology_ch29
  mammal_evolution:
    defines: The evolutionary lineage from pelycosaurs through therapsid cynodonts
      to early mammals in the late Triassic/early Jurassic.
    composed_of:
    - synapsid_anapsid_diapsid
    - mammal_characteristics
    tier: 9
    source_domain: biology_ch29
  living_mammal_groups:
    defines: The three major living mammal clades, distinguished by reproductive strategy—egg-laying,
      pouched live birth, and placental live birth.
    composed_of:
    - mammal_characteristics
    tier: 9
    source_domain: biology_ch29
  primate_characteristics:
    defines: Arboreal adaptations shared by primates, including rotating shoulder
      joints, opposable digits, stereoscopic vision, and enlarged brains.
    composed_of:
    - mammal_characteristics
    tier: 9
    source_domain: biology_ch29
  strepsirrhine_haplorhine:
    defines: The two primate suborders distinguished by nocturnal/olfactory versus
      diurnal/visual adaptations.
    composed_of:
    - primate_characteristics
    tier: 10
    source_domain: biology_ch29
  primate_evolution:
    defines: The evolutionary radiation of proto-primates into prosimians, New and
      Old World monkeys, and apes over the Cenozoic era.
    composed_of:
    - primate_characteristics
    - mammal_evolution
    tier: 10
    source_domain: biology_ch29
  permanent_tissue:
    defines: Plant tissue consisting of cells that are no longer actively dividing,
      differentiated from meristematic tissue into dermal, vascular, and ground tissue.
    composed_of:
    - meristematic_tissue
    tier: 1
    source_domain: biology_ch30
  dermal_tissue:
    defines: Simple permanent tissue that covers and protects the outer surface of
      the plant and controls gas exchange.
    composed_of:
    - permanent_tissue
    tier: 2
    source_domain: biology_ch30
  ground_tissue:
    defines: Permanent tissue that carries out photosynthesis, provides a supporting
      matrix for vascular tissue, and stores water and sugars.
    composed_of:
    - permanent_tissue
    tier: 2
    source_domain: biology_ch30
  xylem:
    defines: Conducting tissue composed of vessel elements, tracheids, and xylem parenchyma
      that transports water and minerals from roots to the rest of the plant.
    composed_of:
    - permanent_tissue
    tier: 2
    source_domain: biology_ch30
  phloem:
    defines: Living conducting tissue composed of sieve-tube cells, companion cells,
      phloem parenchyma, and phloem fibers that transports organic compounds from
      photosynthetic tissue.
    composed_of:
    - permanent_tissue
    tier: 2
    source_domain: biology_ch30
  stem_anatomy:
    defines: The organization of a stem into dermal, vascular, and ground tissue,
      characterized by nodes, internodes, and vascular bundles.
    composed_of:
    - dermal_tissue
    - vascular_tissue
    - ground_tissue
    tier: 4
    source_domain: biology_ch30
  primary_growth:
    defines: Increase in length of shoots and roots resulting from cell division in
      the apical meristem.
    composed_of:
    - meristematic_tissue
    - shoot_system
    - root_system
    tier: 1
    source_domain: biology_ch30
  secondary_growth:
    defines: Increase in stem or root thickness caused by cell division in lateral
      meristems (vascular cambium and cork cambium).
    composed_of:
    - meristematic_tissue
    - vascular_tissue
    tier: 4
    source_domain: biology_ch30
  annual_rings:
    defines: Visible growth rings formed by alternating early (spring) and late (autumn)
      wood produced by seasonal vascular cambium activity.
    composed_of:
    - secondary_growth
    tier: 5
    source_domain: biology_ch30
  root_systems:
    defines: The two main root architectures - a deep-penetrating tap root system
      in dicots and a shallow, dense fibrous root system in monocots.
    composed_of:
    - root_system
    tier: 1
    source_domain: biology_ch30
  root_growth_zones:
    defines: The three zones of the root tip - cell division, elongation, and maturation
      - that together produce root growth, protected by the root cap.
    composed_of:
    - root_system
    - meristematic_tissue
    tier: 1
    source_domain: biology_ch30
  root_anatomy:
    defines: The internal organization of the root into epidermis, cortex, endodermis
      (with the Casparian strip), pericycle, and vascular stele.
    composed_of:
    - dermal_tissue
    - ground_tissue
    - vascular_tissue
    - root_system
    tier: 4
    source_domain: biology_ch30
  leaf_structure:
    defines: The organization of a typical leaf into lamina, petiole, epidermis, mesophyll
      (palisade and spongy parenchyma), and vascular bundles.
    composed_of:
    - dermal_tissue
    - ground_tissue
    - vascular_tissue
    - shoot_system
    tier: 4
    source_domain: biology_ch30
  leaf_venation:
    defines: The characteristic pattern of leaf veins - parallel in monocots, reticulate
      in dicots, dichotomous in Ginkgo - formed by vascular tissue.
    composed_of:
    - vascular_tissue
    - leaf_structure
    tier: 5
    source_domain: biology_ch30
  leaf_form:
    defines: Classification of leaves as simple (undivided blade) or compound (blade
      divided into leaflets, palmate or pinnate).
    composed_of:
    - leaf_structure
    tier: 5
    source_domain: biology_ch30
  stomata_guard_cells:
    defines: Epidermal pores flanked by guard cells that regulate gas exchange and
      water vapor release in leaves and stems.
    composed_of:
    - dermal_tissue
    tier: 2
    source_domain: biology_ch30
  transpiration:
    defines: The passive loss of water vapor from the plant through stomata, driven
      by differences in water potential between soil and atmosphere.
    composed_of:
    - stomata_guard_cells
    - water_potential
    tier: 3
    source_domain: biology_ch30
  cohesion_tension_theory:
    defines: The mechanism by which transpiration-driven tension, combined with water
      cohesion and adhesion in xylem, pulls water and minerals up the plant.
    composed_of:
    - transpiration
    - xylem
    tier: 4
    source_domain: biology_ch30
  photomorphogenesis:
    defines: Growth and development of plants in response to light, mediated by photoreceptors
      such as phytochromes, cryptochromes, and phototropins.
    composed_of:
    - phytochrome_system
    tier: 1
    source_domain: biology_ch30
  phototropism:
    defines: Directional bending of a plant toward or away from a light source, mediated
      by blue-light photoreceptors (phototropins) and auxin redistribution.
    composed_of:
    - plant_hormones
    tier: 1
    source_domain: biology_ch30
  gravitropism:
    defines: Directional plant growth response to gravity, mediated by amyloplast
      settling and auxin redistribution, causing negative gravitropism in shoots and
      positive in roots.
    composed_of:
    - plant_hormones
    tier: 1
    source_domain: biology_ch30
  thigmo_responses:
    defines: Plant responses to touch, ranging from directional growth toward contact,
      direction-independent rapid movement, and slow developmental changes from continuous
      mechanical stress.
    composed_of:
    - plant_hormones
    tier: 1
    source_domain: biology_ch30
  essential_nutrient:
    defines: One of about 20 elements a plant requires to complete its life cycle,
      where no other element can substitute and the element is directly involved in
      plant nutrition.
    composed_of:
    - plant_nutrient
    tier: 1
    source_domain: biology_ch31
    also_in:
    - biology_ch34
  macronutrient:
    defines: An essential nutrient required by plants in large amounts, including
      carbon, hydrogen, oxygen, nitrogen, phosphorus, potassium, calcium, magnesium,
      and sulfur.
    composed_of:
    - essential_nutrient
    tier: 2
    source_domain: biology_ch31
  micronutrient:
    defines: An essential nutrient, or trace element, required by plants in very small
      quantities, such as iron, manganese, boron, and zinc.
    composed_of:
    - essential_nutrient
    tier: 2
    source_domain: biology_ch31
  soil_composition:
    defines: The mixture of inorganic mineral matter, organic matter, water, and air
      that makes up soil, with proportions that determine soil quality.
    composed_of:
    - soil
    - inorganic_compound
    - organic_compound
    tier: 1
    source_domain: biology_ch31
  humus:
    defines: The organic material of soil, made up of dead and living microorganisms
      and decaying animals and plants, which improves soil structure and moisture
      retention.
    composed_of:
    - soil_composition
    - organic_compound
    tier: 2
    source_domain: biology_ch31
  soil_particle_classification:
    defines: The categorization of inorganic soil particles by size—sand, silt, and
      clay—and the classification of soils with no dominant particle size as loams.
    composed_of:
    - soil_composition
    tier: 2
    source_domain: biology_ch31
  soil_formation:
    defines: The slow development of soil from biological, physical, and chemical
      processes acting on parent material, influenced by climate, topography, biological
      factors, and time.
    composed_of:
    - soil
    - parent_material
    tier: 1
    source_domain: biology_ch31
  soil_profile:
    defines: The vertical section of soil composed of distinct layers, called horizons,
      that differ in physical and chemical properties.
    composed_of:
    - soil_formation
    tier: 2
    source_domain: biology_ch31
  soil_horizon:
    defines: A soil layer (O, A, B, or C horizon) with distinct physical and chemical
      properties that differ from other layers, formed through a soil profile.
    composed_of:
    - soil_profile
    tier: 3
    source_domain: biology_ch31
  rhizosphere:
    defines: The area of soil affected by root secretions and the microorganisms that
      develop around plant roots as a biological factor in soil formation.
    composed_of:
    - soil_formation
    tier: 2
    source_domain: biology_ch31
  autotrophic_heterotrophic_nutrition:
    defines: The two ways plants obtain food, autotrophic plants synthesize organic
      compounds via photosynthesis, while heterotrophic (parasitic) plants draw nutrients
      from a host.
    composed_of:
    - plant_nutrient
    - organic_compound
    tier: 1
    source_domain: biology_ch31
  nitrogen_fixation:
    defines: The conversion of atmospheric nitrogen (N2) into ammonia (NH3), carried
      out by prokaryotes such as soil bacteria, making nitrogen biologically usable
      by plants.
    composed_of:
    - macronutrient
    - rhizosphere
    tier: 3
    source_domain: biology_ch31
    also_in:
    - biology_ch46
  mycorrhizae:
    defines: A symbiotic association between fungi and plant roots in which the fungus
      helps the plant absorb minerals like phosphate, while obtaining sugars from
      the plant root.
    composed_of:
    - rhizosphere
    - macronutrient
    tier: 3
    source_domain: biology_ch31
  ecto_endo_mycorrhizae:
    defines: The two structural types of mycorrhizae, ectomycorrhizae form a dense
      sheath (mantle) around roots, while endomycorrhizae embed fungal mycelium within
      root tissue.
    composed_of:
    - mycorrhizae
    tier: 4
    source_domain: biology_ch31
  flower_structure:
    defines: A typical flower has four whorls—calyx, corolla, androecium, and gynoecium—that
      make up its reproductive and protective structures.
    composed_of:
    - sporophyte
    tier: 1
    source_domain: biology_ch32
  gymnosperm_reproduction:
    defines: Reproduction in gymnosperms occurs via male and female cones bearing
      exposed gametophytes, without enclosed ovaries or double fertilization.
    composed_of:
    - alternation_of_generations
    - pollination
    tier: 1
    source_domain: biology_ch32
  pollination_agents:
    defines: Pollen is transferred by biotic agents such as insects, bats, and birds,
      or abiotic agents such as wind and water, each associated with characteristic
      flower adaptations.
    composed_of:
    - pollination
    tier: 1
    source_domain: biology_ch32
  natural_asexual_reproduction:
    defines: Plant self-propagation strategies such as bulbs, corms, rhizomes, stolons,
      and adventitious buds that generate new individuals without fertilization.
    composed_of:
    - asexual_reproduction
    tier: 1
    source_domain: biology_ch32
  plant_life_span_classification:
    defines: Plants are classified by life span (annual, biennial, perennial) and
      flowering frequency (monocarpic, polycarpic).
    composed_of:
    - sporophyte
    tier: 1
    source_domain: biology_ch32
  complete_incomplete_flowers:
    defines: Flowers are classified as complete if all four whorls are present, incomplete
      if any are missing, and perfect (hermaphroditic) if both androecium and gynoecium
      are present.
    composed_of:
    - flower_structure
    tier: 2
    source_domain: biology_ch32
  male_gametophyte_development:
    defines: Development of pollen within the microsporangium of the anther, where
      microspore mother cells undergo meiosis to form microspores that mature into
      pollen grains.
    composed_of:
    - flower_structure
    - gametophyte
    tier: 2
    source_domain: biology_ch32
  female_gametophyte_development:
    defines: Formation of the female gametophyte through megasporogenesis and megagametogenesis,
      producing an eight-nucleate embryo sac containing the egg cell, synergids, polar
      nuclei, and antipodal cells.
    composed_of:
    - flower_structure
    - gametophyte
    tier: 2
    source_domain: biology_ch32
  self_pollination:
    defines: Transfer of pollen from the anther to the stigma of the same flower or
      another flower on the same plant.
    composed_of:
    - pollination
    - flower_structure
    tier: 2
    source_domain: biology_ch32
  cross_pollination:
    defines: Transfer of pollen from the anther of one flower to the stigma of a flower
      on a different individual of the same species, increasing genetic diversity.
    composed_of:
    - pollination
    - flower_structure
    tier: 2
    source_domain: biology_ch32
  senescence:
    defines: The aging process in plant tissues, marked by chloroplast breakdown and
      nutrient recycling, regulated in part by hormones.
    composed_of:
    - plant_life_span_classification
    tier: 2
    source_domain: biology_ch32
  embryo_development:
    defines: Post-fertilization division of the zygote into terminal and basal cells,
      giving rise to the embryo, suspensor, and cotyledons.
    composed_of:
    - double_fertilization
    tier: 4
    source_domain: biology_ch32
  fruit_development_types:
    defines: After fertilization, the ovary (or other floral tissue) develops into
      fruit, classified as simple, aggregate, multiple, or accessory based on origin.
    composed_of:
    - double_fertilization
    tier: 4
    source_domain: biology_ch32
  seed_structure_development:
    defines: The mature ovule develops into a seed containing a seed coat, cotyledons,
      endosperm, and embryo, with differing food storage strategies in monocots and
      dicots.
    composed_of:
    - embryo_development
    tier: 5
    source_domain: biology_ch32
  seed_germination:
    defines: The process by which a dormant seed resumes growth under favorable conditions,
      sometimes requiring vernalization or scarification to break dormancy.
    composed_of:
    - seed_structure_development
    tier: 6
    source_domain: biology_ch32
  surface_to_volume_ratio:
    defines: The ratio of an object's surface area to its volume, which decreases
      as size increases and limits the effectiveness of diffusion.
    composed_of:
    - diffusion
    tier: 1
    source_domain: biology_ch33
  metabolic_rate:
    defines: The amount of energy an animal expends over a given time, measured at
      rest as basal metabolic rate (endotherms) or standard metabolic rate (ectotherms).
    composed_of:
    - atp_energy_storage
    tier: 1
    source_domain: biology_ch33
  bioenergetics:
    defines: The relationship between an animal's energy use and its body size, activity
      level, and environment.
    composed_of:
    - metabolic_rate
    - surface_to_volume_ratio
    tier: 2
    source_domain: biology_ch33
  torpor:
    defines: A decrease in activity and metabolism, including hibernation and estivation,
      that allows animals to survive adverse conditions.
    composed_of:
    - metabolic_rate
    tier: 2
    source_domain: biology_ch33
  body_planes_and_cavities:
    defines: The anatomical planes (sagittal, frontal, transverse) and cavities (dorsal,
      ventral) used to describe vertebrate body organization.
    composed_of:
    - body_symmetry
    tier: 1
    source_domain: biology_ch33
  epithelial_cell_types:
    defines: Squamous, cuboidal, columnar, and transitional epithelial cells classified
      by shape and number of layers, each suited to specific functions.
    composed_of:
    - epithelial_tissue
    tier: 1
    source_domain: biology_ch33
  connective_tissue_types:
    defines: Loose/areolar, fibrous, cartilage, bone, adipose, and blood tissues distinguished
      by their cell types, fibers, and matrix composition.
    composed_of:
    - connective_tissue
    tier: 1
    source_domain: biology_ch33
  stimulus_receptor_effector:
    defines: The homeostatic control pathway in which a receptor senses a change,
      a control center generates a response, and an effector carries it out.
    composed_of:
    - homeostasis
    - nervous_tissue
    tier: 1
    source_domain: biology_ch33
  set_point:
    defines: The target value around which a homeostatic system maintains equilibrium,
      which can itself be adjusted (alteration).
    composed_of:
    - homeostasis
    tier: 1
    source_domain: biology_ch33
  negative_feedback_loop:
    defines: A homeostatic mechanism that changes the direction of a stimulus to bring
      a system back toward its set point.
    composed_of:
    - stimulus_receptor_effector
    - set_point
    tier: 2
    source_domain: biology_ch33
  positive_feedback_loop:
    defines: A feedback mechanism that maintains or accelerates the direction of a
      stimulus rather than reversing it.
    composed_of:
    - stimulus_receptor_effector
    - set_point
    tier: 2
    source_domain: biology_ch33
  acclimatization:
    defines: Adjustments made across body organ systems to maintain a homeostatic
      set point in response to a changed environment.
    composed_of:
    - set_point
    tier: 2
    source_domain: biology_ch33
  endotherm_ectotherm:
    defines: The classification of animals as endotherms (internally regulated body
      temperature) or ectotherms (body temperature set by the environment).
    composed_of:
    - heat_exchange_mechanisms
    - homeostasis
    tier: 1
    source_domain: biology_ch33
  thermoregulation:
    defines: The regulation of body temperature through neural control, circulatory
      adaptations, insulation, and behavior.
    composed_of:
    - heat_exchange_mechanisms
    - negative_feedback_loop
    - endotherm_ectotherm
    tier: 3
    source_domain: biology_ch33
  gastrovascular_cavity:
    defines: A simple digestive system with a single opening serving as both mouth
      and anus.
    composed_of:
    - ingestion
    - digestion
    - absorption
    - elimination
    tier: 1
    source_domain: biology_ch34
  alimentary_canal:
    defines: A more advanced tubular digestive system with a separate mouth and anus.
    composed_of:
    - ingestion
    - digestion
    - absorption
    - elimination
    - peristalsis
    - sphincter
    tier: 1
    source_domain: biology_ch34
  monogastric_system:
    defines: A vertebrate digestive system with a single-chambered stomach.
    composed_of:
    - alimentary_canal
    tier: 2
    source_domain: biology_ch34
  avian_digestive_system:
    defines: A specialized bird digestive system with a two-chambered stomach adapted
      to process unmasticated food.
    composed_of:
    - alimentary_canal
    tier: 2
    source_domain: biology_ch34
  ruminant_digestion:
    defines: A four-chambered stomach system in herbivores using microbial fermentation
      to digest cellulose-rich roughage.
    composed_of:
    - alimentary_canal
    - dietary_classification
    tier: 2
    source_domain: biology_ch34
  pseudo_ruminant_digestion:
    defines: A three-chambered stomach system relying on an enlarged cecum to ferment
      roughage.
    composed_of:
    - alimentary_canal
    - dietary_classification
    tier: 2
    source_domain: biology_ch34
  oral_cavity:
    defines: The mouth, where food is mechanically and chemically processed to form
      a bolus.
    composed_of:
    - ingestion
    - enzyme
    tier: 1
    source_domain: biology_ch34
  esophagus:
    defines: A tubular organ connecting mouth to stomach that moves the bolus via
      peristalsis.
    composed_of:
    - peristalsis
    tier: 1
    source_domain: biology_ch34
  stomach:
    defines: A saclike, highly acidic organ that secretes gastric juices and pepsin
      to digest protein, producing chyme.
    composed_of:
    - digestion
    - enzyme
    - sphincter
    tier: 1
    source_domain: biology_ch34
  small_intestine:
    defines: The organ where digestion of protein, fat, and carbohydrate completes
      and most absorption occurs.
    composed_of:
    - digestion
    - absorption
    - enzyme
    tier: 1
    source_domain: biology_ch34
  large_intestine:
    defines: The organ that reabsorbs water from undigested food and stores waste
      before elimination.
    composed_of:
    - absorption
    - elimination
    tier: 1
    source_domain: biology_ch34
  accessory_organs:
    defines: Organs such as liver, pancreas, gallbladder, and salivary glands that
      add enzymatic secretions but food does not pass through.
    composed_of:
    - enzyme
    tier: 1
    source_domain: biology_ch34
  carbohydrate_digestion:
    defines: The stepwise breakdown of starches and disaccharides into absorbable
      monosaccharides.
    composed_of:
    - enzyme
    - small_intestine
    - oral_cavity
    tier: 2
    source_domain: biology_ch34
  protein_digestion:
    defines: The stepwise breakdown of proteins into peptides and free amino acids.
    composed_of:
    - enzyme
    - stomach
    - small_intestine
    tier: 2
    source_domain: biology_ch34
  lipid_digestion:
    defines: The emulsification and enzymatic breakdown of fat globules into fatty
      acids and monoglycerides.
    composed_of:
    - enzyme
    - small_intestine
    - accessory_organs
    tier: 2
    source_domain: biology_ch34
  glycogen_storage:
    defines: The conversion of excess glucose and ATP into glycogen for later release
      when blood sugar drops.
    composed_of:
    - atp
    - homeostasis
    - carbohydrate_digestion
    tier: 3
    source_domain: biology_ch34
  cellular_respiration:
    defines: The metabolic reactions that convert carbohydrates, proteins, and fats
      into ATP.
    composed_of:
    - atp
    - carbohydrate_digestion
    - protein_digestion
    - lipid_digestion
    tier: 3
    source_domain: biology_ch34
  digestive_phases:
    defines: Three overlapping neurally and hormonally controlled phases regulating
      gastric secretion and motility.
    composed_of:
    - stomach
    - hormone
    tier: 2
    source_domain: biology_ch34
  hormonal_regulation_of_digestion:
    defines: Control of digestive secretions via hormones such as gastrin, secretin,
      and cholecystokinin.
    composed_of:
    - hormone
    - digestive_phases
    tier: 3
    source_domain: biology_ch34
  neural_regulation_of_digestion:
    defines: Control of salivation, gastric secretion, and peristalsis by the nervous
      system in response to food cues.
    composed_of:
    - peristalsis
    - digestive_phases
    tier: 3
    source_domain: biology_ch34
  neuron_structure:
    defines: The dendrites, cell body, axon hillock, axon, and axon terminals that
      receive, integrate, and transmit neuronal signals.
    composed_of:
    - neuron
    tier: 1
    source_domain: biology_ch35
  neuron_types:
    defines: Neurons classified into unipolar, bipolar, multipolar, and pseudounipolar
      types based on process arrangement.
    composed_of:
    - neuron
    - neuron_structure
    tier: 2
    source_domain: biology_ch35
  glial_cell_types:
    defines: Distinct glial cell types that each perform specialized supportive roles
      for neurons.
    composed_of:
    - glia
    tier: 1
    source_domain: biology_ch35
  myelin:
    defines: A fatty substance produced by glial cells that insulates axons to increase
      conduction speed.
    composed_of:
    - glial_cell_types
    tier: 2
    source_domain: biology_ch35
  membrane_potential:
    defines: The difference in electrical charge across a neuron's membrane arising
      from unequal ion concentrations.
    composed_of:
    - ion_channel
    - neuron
    tier: 1
    source_domain: biology_ch35
  resting_membrane_potential:
    defines: The baseline membrane potential of a neuron at rest, maintained by differential
      ion permeability and pumps.
    composed_of:
    - membrane_potential
    tier: 2
    source_domain: biology_ch35
  action_potential:
    defines: A self-propagating, all-or-nothing reversal of the resting membrane potential
      that transmits a signal along a neuron.
    composed_of:
    - resting_membrane_potential
    - ion_channel
    tier: 3
    source_domain: biology_ch35
  depolarization_repolarization:
    defines: The sequential voltage changes that constitute the phases of an action
      potential.
    composed_of:
    - action_potential
    tier: 4
    source_domain: biology_ch35
  refractory_period:
    defines: The period following an action potential during which a neuron cannot
      fire again.
    composed_of:
    - action_potential
    tier: 4
    source_domain: biology_ch35
  saltatory_conduction:
    defines: Propagation of an action potential by jumping between nodes of Ranvier
      along a myelinated axon.
    composed_of:
    - action_potential
    - myelin
    tier: 4
    source_domain: biology_ch35
  synapse:
    defines: The junction between two neurons where signals are communicated chemically
      or electrically.
    composed_of:
    - neuron
    - action_potential
    tier: 4
    source_domain: biology_ch35
  chemical_synaptic_transmission:
    defines: The process by which an action potential triggers neurotransmitter release
      that binds postsynaptic receptors.
    composed_of:
    - synapse
    - action_potential
    tier: 5
    source_domain: biology_ch35
  electrical_synapse:
    defines: A synapse where membranes are connected by gap junctions, allowing near-instantaneous
      current flow.
    composed_of:
    - synapse
    tier: 5
    source_domain: biology_ch35
  postsynaptic_potentials:
    defines: EPSPs and IPSPs that depolarize or hyperpolarize the postsynaptic membrane,
      altering firing likelihood.
    composed_of:
    - chemical_synaptic_transmission
    tier: 6
    source_domain: biology_ch35
  summation:
    defines: The integration of multiple EPSPs and IPSPs at the axon hillock to determine
      whether a neuron fires.
    composed_of:
    - postsynaptic_potentials
    tier: 7
    source_domain: biology_ch35
  synaptic_plasticity:
    defines: The capacity of synapses to be strengthened or weakened over time, forming
      the basis of learning and memory.
    composed_of:
    - synapse
    tier: 5
    source_domain: biology_ch35
  ltp_ltd:
    defines: Persistent strengthening or weakening of synaptic connections mediated
      by glutamate receptor dynamics.
    composed_of:
    - synaptic_plasticity
    - postsynaptic_potentials
    tier: 7
    source_domain: biology_ch35
  cerebral_cortex:
    defines: The outermost folded layer of brain tissue, divided into hemispheres,
      responsible for higher-order functions.
    composed_of:
    - meninges_csf
    - neuron
    tier: 1
    source_domain: biology_ch35
  cortical_lobes:
    defines: Four functionally and spatially defined regions of the cerebral cortex
      specialized for distinct functions.
    composed_of:
    - cerebral_cortex
    tier: 2
    source_domain: biology_ch35
  subcortical_structures:
    defines: Deep brain structures that regulate movement, sensory relay, homeostasis,
      emotion, coordination, and vital functions.
    composed_of:
    - meninges_csf
    - neuron
    tier: 1
    source_domain: biology_ch35
  spinal_cord:
    defines: A nerve tissue bundle connecting the brain to the peripheral nervous
      system, transmitting signals and controlling reflexes.
    composed_of:
    - meninges_csf
    - neuron
    tier: 1
    source_domain: biology_ch35
  peripheral_nervous_system:
    defines: The network of nerves connecting the CNS to the rest of the body, divided
      into autonomic and sensory-somatic divisions.
    composed_of:
    - neuron
    - spinal_cord
    tier: 2
    source_domain: biology_ch35
  autonomic_nervous_system:
    defines: The PNS division that controls involuntary bodily functions through sympathetic
      and parasympathetic pathways.
    composed_of:
    - peripheral_nervous_system
    tier: 3
    source_domain: biology_ch35
  sympathetic_parasympathetic:
    defines: Two opposing divisions of the autonomic nervous system driving fight-or-flight
      or rest-and-digest responses.
    composed_of:
    - autonomic_nervous_system
    tier: 4
    source_domain: biology_ch35
  sensory_somatic_system:
    defines: The PNS division that transmits sensory information to the CNS and motor
      commands to skeletal muscles.
    composed_of:
    - peripheral_nervous_system
    tier: 3
    source_domain: biology_ch35
  sensory_transduction:
    defines: The conversion of a sensory stimulus into an electrical signal (receptor
      potential) in the nervous system.
    composed_of:
    - stimulus
    - sensory_receptor
    tier: 1
    source_domain: biology_ch36
  receptor_potential:
    defines: A graded change in a sensory receptor's membrane potential produced by
      transduction, whose magnitude varies with stimulus strength.
    composed_of:
    - sensory_transduction
    tier: 2
    source_domain: biology_ch36
  sensory_coding:
    defines: The representation of stimulus type, location, duration, and intensity
      through which afferent axon and receptor activity encode a stimulus.
    composed_of:
    - receptor_potential
    - receptive_field
    tier: 3
    source_domain: biology_ch36
  perception:
    defines: An individual's interpretation of a sensation, occurring in the brain
      after sensory signals are routed through the thalamus to the cortex.
    composed_of:
    - sensory_coding
    tier: 4
    source_domain: biology_ch36
  somatosensation:
    defines: The general sense (touch) that includes sensation from the skin, mucous
      membranes, limbs, and joints, responding to temperature, pain, pressure, and
      vibration.
    composed_of:
    - mechanoreceptor
    - thermoreceptor
    tier: 1
    source_domain: biology_ch36
  nociceptor_pain:
    defines: The neural processing of injurious stimuli by pain receptors (nociceptors),
      perceived as pain once communicated to the brain.
    composed_of:
    - somatosensation
    - perception
    tier: 5
    source_domain: biology_ch36
  skin_mechanoreceptor_types:
    defines: The specific tactile mechanoreceptors in human skin—Merkel's disks, Meissner's
      corpuscles, Ruffini endings, Pacinian corpuscles, and hair receptors—each specialized
      for particular touch qualities.
    composed_of:
    - mechanoreceptor
    - somatosensation
    tier: 2
    source_domain: biology_ch36
  proprioception_kinesthesia:
    defines: The sense of limb, joint, and muscle position (proprioception) and of
      limb movement (kinesthesia), detected via muscle spindles and Golgi tendon organs.
    composed_of:
    - mechanoreceptor
    - somatosensation
    tier: 2
    source_domain: biology_ch36
  gustation:
    defines: The sense of taste, mediated by taste buds that detect five primary tastes—sweet,
      sour, bitter, salty, and umami—via dissolved food molecules (tastants).
    composed_of:
    - chemoreceptor
    - sensory_transduction
    tier: 2
    source_domain: biology_ch36
  olfaction:
    defines: The sense of smell, in which airborne odorant molecules bind olfactory
      receptors in the olfactory epithelium to stimulate specialized bipolar neurons.
    composed_of:
    - chemoreceptor
    - sensory_transduction
    tier: 2
    source_domain: biology_ch36
  audition:
    defines: The sense of hearing, in which sound waves are transduced by the ear
      into neural signals interpreted as pitch and volume.
    composed_of:
    - sound_wave
    - sensory_transduction
    tier: 2
    source_domain: biology_ch36
  ear_anatomy:
    defines: The structures—auricle, tympanum, ossicles, oval window, and cochlea—that
      collect and transmit sound energy from the environment to the inner ear.
    composed_of:
    - sound_wave
    tier: 1
    source_domain: biology_ch36
  cochlear_transduction:
    defines: The process by which pressure waves in cochlear fluid flex the basilar
      membrane, bending stereocilia in the organ of Corti to generate neural signals.
    composed_of:
    - ear_anatomy
    - hair_cell
    tier: 2
    source_domain: biology_ch36
  place_theory_pitch:
    defines: The model that pitch is determined by the specific location along the
      basilar membrane that is maximally stimulated by a given sound frequency.
    composed_of:
    - cochlear_transduction
    tier: 3
    source_domain: biology_ch36
  vestibular_sense:
    defines: The sense of spatial orientation and balance, detecting linear and angular
      acceleration/deceleration via the utricle, saccule, and semicircular canals.
    composed_of:
    - hair_cell
    tier: 1
    source_domain: biology_ch36
  vision:
    defines: The sense of sight, the detection of light patterns from the environment
      and their interpretation into images.
    composed_of:
    - light_wave
    - sensory_transduction
    tier: 2
    source_domain: biology_ch36
  eye_anatomy:
    defines: The structures of the eye that focus and regulate light before it reaches
      the photoreceptors of the retina.
    composed_of:
    - light_wave
    - photoreceptor
    tier: 1
    source_domain: biology_ch36
  phototransduction:
    defines: The process by which light striking rhodopsin isomerizes retinal, closing
      Na+ channels and hyperpolarizing the photoreceptor.
    composed_of:
    - photoreceptor
    - light_wave
    tier: 1
    source_domain: biology_ch36
  trichromatic_coding:
    defines: The perception of color arising from the differential activity ratio
      of three cone types (S, M, L) each maximally sensitive to a different wavelength.
    composed_of:
    - phototransduction
    tier: 2
    source_domain: biology_ch36
  retinal_processing:
    defines: The processing of visual signals within the retina by bipolar, horizontal,
      amacrine, and ganglion cells before signals leave via the optic nerve.
    composed_of:
    - phototransduction
    - eye_anatomy
    tier: 2
    source_domain: biology_ch36
  lipid_derived_hormone:
    defines: A hormone structurally similar to cholesterol that can diffuse across
      plasma membranes.
    composed_of:
    - hormone
    tier: 1
    source_domain: biology_ch37
  amino_acid_derived_hormone:
    defines: A relatively small hormone derived from tyrosine or tryptophan, such
      as epinephrine or melatonin.
    composed_of:
    - hormone
    tier: 1
    source_domain: biology_ch37
  peptide_hormone:
    defines: A hormone composed of a polypeptide chain, water-soluble.
    composed_of:
    - hormone
    tier: 1
    source_domain: biology_ch37
  hormone_receptor:
    defines: A cellular protein that binds to a specific hormone.
    composed_of:
    - hormone
    - target_cell
    tier: 1
    source_domain: biology_ch37
  humoral_stimuli:
    defines: Control of hormone release in response to changes in extracellular fluid
      or ion concentrations.
    composed_of:
    - hormone
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  hormonal_stimuli:
    defines: Release of a hormone in response to stimulation by another hormone.
    composed_of:
    - hormone
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  neural_stimuli:
    defines: Direct stimulation of an endocrine gland by the nervous system to release
      hormones.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  thyroid_gland:
    defines: An endocrine gland in the neck composed of follicles that produce T3,
      T4, and calcitonin.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  parathyroid_glands:
    defines: Small glands on the posterior thyroid surface that produce parathyroid
      hormone.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  adrenal_glands:
    defines: Glands atop the kidneys with a cortex and medulla producing multiple
      hormones.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  pancreas_endocrine_function:
    defines: A heterocrine organ whose pancreatic islets contain alpha and beta cells
      regulating blood glucose.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  pineal_gland:
    defines: A gland that produces melatonin, regulating circadian rhythms and reproductive
      functions.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
  gonads:
    defines: The testes and ovaries, which produce steroid sex hormones.
    composed_of:
    - endocrine_gland
    tier: 1
    source_domain: biology_ch37
    also_in:
    - biology_ch43
  intracellular_hormone_receptor:
    defines: A receptor in the cytoplasm or nucleus that binds lipid-soluble hormones
      and regulates gene transcription.
    composed_of:
    - hormone_receptor
    - lipid_derived_hormone
    tier: 2
    source_domain: biology_ch37
  plasma_membrane_hormone_receptor:
    defines: A receptor on the outer cell surface that binds lipid-insoluble hormones
      and activates a signaling pathway.
    composed_of:
    - hormone_receptor
    - amino_acid_derived_hormone
    - peptide_hormone
    tier: 2
    source_domain: biology_ch37
  receptor_regulation:
    defines: Changes in the number of hormone receptors on a target cell in response
      to prolonged hormone exposure.
    composed_of:
    - hormone_receptor
    tier: 2
    source_domain: biology_ch37
  hypothalamic_pituitary_axis:
    defines: The integrated system in which the hypothalamus controls hormone release
      from the pituitary.
    composed_of:
    - endocrine_gland
    - hormonal_stimuli
    - neural_stimuli
    tier: 2
    source_domain: biology_ch37
  blood_glucose_regulation:
    defines: The homeostatic control of blood glucose by insulin and glucagon.
    composed_of:
    - pancreas_endocrine_function
    - negative_feedback
    - humoral_stimuli
    tier: 2
    source_domain: biology_ch37
  calcium_regulation:
    defines: Regulation of blood Ca2+ by parathyroid hormone and calcitonin.
    composed_of:
    - parathyroid_glands
    - thyroid_gland
    - negative_feedback
    tier: 2
    source_domain: biology_ch37
  second_messenger_signaling:
    defines: A signal transduction pathway in which a first-messenger hormone activates
      cAMP to mediate a cellular response.
    composed_of:
    - plasma_membrane_hormone_receptor
    tier: 3
    source_domain: biology_ch37
  anterior_pituitary:
    defines: The glandular portion of the pituitary that secretes hormones under hypothalamic
      control.
    composed_of:
    - hypothalamic_pituitary_axis
    tier: 3
    source_domain: biology_ch37
  posterior_pituitary:
    defines: An extension of the hypothalamus that stores and releases ADH and oxytocin.
    composed_of:
    - hypothalamic_pituitary_axis
    tier: 3
    source_domain: biology_ch37
  water_balance_regulation:
    defines: The system by which ADH and RAAS regulate water and Na+ reabsorption
      to control blood volume.
    composed_of:
    - posterior_pituitary
    - negative_feedback
    tier: 4
    source_domain: biology_ch37
  reproductive_hormone_regulation:
    defines: Control of gamete production and sex hormone secretion by the hypothalamic-pituitary-gonadal
      axis.
    composed_of:
    - hypothalamic_pituitary_axis
    - anterior_pituitary
    - gonads
    - negative_feedback
    tier: 4
    source_domain: biology_ch37
  metabolic_rate_regulation:
    defines: Control of basal metabolic rate by thyroid hormones released in response
      to TSH.
    composed_of:
    - thyroid_gland
    - anterior_pituitary
    - negative_feedback
    tier: 4
    source_domain: biology_ch37
  growth_hormone_regulation:
    defines: Control of tissue growth by growth hormone, regulated by hypothalamic
      and pituitary signals.
    composed_of:
    - anterior_pituitary
    - negative_feedback
    tier: 4
    source_domain: biology_ch37
  stress_response:
    defines: The short-term and long-term hormonal responses that prepare the body
      to cope with stressors.
    composed_of:
    - adrenal_glands
    - anterior_pituitary
    - neural_stimuli
    - negative_feedback
    tier: 4
    source_domain: biology_ch37
  skull:
    defines: The 22 cranial and facial bones that support facial structures and protect
      the brain.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  thoracic_cage:
    defines: The ribcage that encloses and protects thoracic organs.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  pectoral_girdle:
    defines: The clavicle and scapula that attach the upper limbs to the axial skeleton.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  pelvic_girdle:
    defines: The paired hip bones that attach the lower limbs to the axial skeleton
      and bear body weight.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  upper_limb_bones:
    defines: The 30 bones of the arm, forearm, and hand.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  lower_limb_bones:
    defines: The bones of the thigh, leg, and foot.
    composed_of:
    - endoskeleton
    tier: 1
    source_domain: biology_ch38
  axial_skeleton:
    defines: The central body axis, consisting of the skull, ossicles, hyoid, vertebral
      column, and thoracic cage.
    composed_of:
    - skull
    - vertebral_column
    - thoracic_cage
    tier: 2
    source_domain: biology_ch38
  appendicular_skeleton:
    defines: The limb bones plus pectoral and pelvic girdles that attach limbs to
      the axial skeleton.
    composed_of:
    - pectoral_girdle
    - pelvic_girdle
    - upper_limb_bones
    - lower_limb_bones
    tier: 2
    source_domain: biology_ch38
  calcification:
    defines: Deposition of mineral salts onto the collagen fiber matrix, crystallizing
      and hardening tissue.
    composed_of:
    - bone_tissue
    tier: 1
    source_domain: biology_ch38
  bone_shape_classification:
    defines: Classification of bones by shape into long, short, flat, irregular, sesamoid,
      and sutural bones.
    composed_of:
    - bone_tissue
    tier: 1
    source_domain: biology_ch38
  bone_cell_types:
    defines: The four cell types of bone tissue that build, resorb, maintain, and
      regenerate bone.
    composed_of:
    - bone_tissue
    tier: 1
    source_domain: biology_ch38
  compact_bone:
    defines: The hard outer bone layer made of osteons that provides strength and
      protection.
    composed_of:
    - bone_tissue
    - calcification
    tier: 2
    source_domain: biology_ch38
  spongy_bone:
    defines: The inner bone layer made of trabeculae that reduces density and houses
      red bone marrow.
    composed_of:
    - bone_tissue
    - calcification
    tier: 2
    source_domain: biology_ch38
  ossification:
    defines: The process by which osteoblasts form bone, via intramembranous or endochondral
      pathways.
    composed_of:
    - bone_cell_types
    - calcification
    tier: 2
    source_domain: biology_ch38
  bone_growth:
    defines: Lengthwise growth at the epiphyseal plate and appositional growth of
      long bones during development.
    composed_of:
    - ossification
    - compact_bone
    - spongy_bone
    tier: 3
    source_domain: biology_ch38
  bone_remodeling_repair:
    defines: Ongoing replacement of bone tissue by deposition and resorption, including
      fracture repair stages.
    composed_of:
    - bone_cell_types
    - ossification
    tier: 3
    source_domain: biology_ch38
  joint_structural_classification:
    defines: Classification of joints as fibrous, cartilaginous, or synovial based
      on connecting material and joint cavity.
    composed_of:
    - joint
    tier: 1
    source_domain: biology_ch38
  joint_functional_classification:
    defines: Classification of joints as synarthroses, amphiarthroses, or diarthroses
      based on degree of movement allowed.
    composed_of:
    - joint
    tier: 1
    source_domain: biology_ch38
  synovial_joint_shape_types:
    defines: Classification of synovial joints by shape, determining the type of movement
      permitted.
    composed_of:
    - joint_structural_classification
    tier: 2
    source_domain: biology_ch38
  synovial_joint_movement_types:
    defines: The four movement categories at synovial joints.
    composed_of:
    - synovial_joint_shape_types
    tier: 3
    source_domain: biology_ch38
  skeletal_muscle_fiber_structure:
    defines: The organization of a skeletal muscle cell, including the sarcolemma
      and myofibrils built from sarcomeres.
    composed_of:
    - muscle_tissue_types
    tier: 1
    source_domain: biology_ch38
  sarcomere:
    defines: The functional unit of skeletal muscle, spanning two Z discs and containing
      organized thick and thin myofilaments.
    composed_of:
    - skeletal_muscle_fiber_structure
    - actin_myosin_filaments
    tier: 2
    source_domain: biology_ch38
  regulatory_proteins:
    defines: Tropomyosin and troponin, which block or expose myosin-binding sites
      on actin, gated by calcium.
    composed_of:
    - actin_myosin_filaments
    tier: 1
    source_domain: biology_ch38
  cross_bridge_cycle:
    defines: The ATP-driven cycle in which myosin heads bind actin, pull it, and re-cock
      to generate filament sliding.
    composed_of:
    - sarcomere
    - regulatory_proteins
    tier: 3
    source_domain: biology_ch38
  sliding_filament_model:
    defines: The theory that sarcomeres shorten as thick and thin filaments slide
      past one another.
    composed_of:
    - cross_bridge_cycle
    tier: 4
    source_domain: biology_ch38
  neuromuscular_junction:
    defines: The synapse between a motor neuron and a muscle fiber's motor end plate,
      transmitting the signal via acetylcholine.
    composed_of:
    - membrane_action_potential
    tier: 1
    source_domain: biology_ch38
  excitation_contraction_coupling:
    defines: The transduction linking a neural action potential at the sarcolemma
      to calcium release and contraction initiation.
    composed_of:
    - neuromuscular_junction
    - regulatory_proteins
    tier: 2
    source_domain: biology_ch38
  muscle_tension_control:
    defines: Regulation of muscle force via sarcomere length, cross-bridge number,
      and fiber recruitment/frequency.
    composed_of:
    - sliding_filament_model
    - excitation_contraction_coupling
    tier: 5
    source_domain: biology_ch38
  respiratory_surface:
    defines: A specialized tissue (membrane, skin, gill, tracheal tube, or lung) across
      which gas exchange with the environment occurs.
    composed_of:
    - gas_exchange
    - diffusion
    tier: 1
    source_domain: biology_ch39
  mammalian_respiratory_tract:
    defines: The sequence of structures (nasal cavity, pharynx, larynx, trachea, bronchi,
      bronchioles, alveoli) through which air moves in mammals.
    composed_of:
    - respiratory_surface
    tier: 2
    source_domain: biology_ch39
  alveolus:
    defines: The terminal, thin-walled air sac of the lung where gas exchange between
      air and blood occurs.
    composed_of:
    - respiratory_surface
    tier: 2
    source_domain: biology_ch39
  respiratory_protective_mechanisms:
    defines: Structures such as nasal hairs, mucus, and cilia that trap and remove
      particulate matter from the airway.
    composed_of:
    - mammalian_respiratory_tract
    tier: 3
    source_domain: biology_ch39
  lung_capacity:
    defines: A measurement combining two or more lung volumes, such as the total amount
      of air that can be moved in a breathing cycle.
    composed_of:
    - lung_volume
    tier: 1
    source_domain: biology_ch39
  gas_pressure_gradient_exchange:
    defines: The principle that oxygen and carbon dioxide diffuse across the alveolar-capillary
      membrane and between blood and tissues according to their partial pressure gradients.
    composed_of:
    - partial_pressure
    - alveolus
    tier: 3
    source_domain: biology_ch39
  respiratory_quotient:
    defines: The ratio of carbon dioxide produced to oxygen consumed by the body's
      metabolism, used to calculate alveolar oxygen partial pressure.
    composed_of:
    - partial_pressure
    tier: 1
    source_domain: biology_ch39
  mechanics_of_breathing:
    defines: The coordinated action of the diaphragm, intercostal muscles, and chest
      wall that changes thoracic volume and pressure to drive inhalation and exhalation,
      explained by Boyle's Law.
    composed_of:
    - boyles_law
    - pleura
    tier: 1
    source_domain: biology_ch39
  alveolar_ventilation:
    defines: The amount of air moving into and out of the alveoli, determined by the
      combination of respiratory rate and tidal volume.
    composed_of:
    - respiratory_rate
    - lung_volume
    - alveolus
    tier: 3
    source_domain: biology_ch39
  surfactant:
    defines: A phospholipid and lipoprotein mixture that reduces surface tension in
      the alveoli, easing lung inflation and preventing alveolar collapse.
    composed_of:
    - alveolus
    tier: 2
    source_domain: biology_ch39
  lung_compliance_resistance:
    defines: Measures of lung elasticity (compliance) and airway obstruction (resistance)
      that determine ease of gas exchange and are altered in restrictive and obstructive
      diseases.
    composed_of:
    - mechanics_of_breathing
    - surfactant
    tier: 3
    source_domain: biology_ch39
  vq_mismatch:
    defines: An imbalance between the amount of air reaching the alveoli (ventilation)
      and the amount of blood flowing through the surrounding capillaries (perfusion),
      creating dead space.
    composed_of:
    - alveolar_ventilation
    tier: 4
    source_domain: biology_ch39
  oxygen_dissociation_curve:
    defines: A sigmoidal graph relating hemoglobin oxygen saturation to the partial
      pressure of oxygen, shifted by factors such as CO2, pH, and temperature.
    composed_of:
    - hemoglobin
    - partial_pressure
    tier: 1
    source_domain: biology_ch39
  oxygen_transport:
    defines: The process by which oxygen is carried in the blood, mostly bound to
      hemoglobin and a small fraction dissolved in plasma.
    composed_of:
    - hemoglobin
    - oxygen_dissociation_curve
    tier: 2
    source_domain: biology_ch39
  bicarbonate_buffer_system:
    defines: The system in which carbon dioxide is converted by carbonic anhydrase
      into bicarbonate and hydrogen ions, allowing most CO2 to be transported in blood
      while buffering pH.
    composed_of:
    - diffusion
    tier: 1
    source_domain: biology_ch39
  carbon_dioxide_transport:
    defines: The transport of carbon dioxide from tissues to lungs via dissolution
      in plasma, binding to hemoglobin as carbaminohemoglobin, or conversion to bicarbonate.
    composed_of:
    - hemoglobin
    - bicarbonate_buffer_system
    tier: 2
    source_domain: biology_ch39
  chloride_shift:
    defines: The exchange of bicarbonate ions out of and chloride ions into red blood
      cells (and the reverse in the lungs) that accompanies carbon dioxide transport.
    composed_of:
    - bicarbonate_buffer_system
    tier: 2
    source_domain: biology_ch39
  open_circulatory_system:
    defines: A circulatory arrangement in which blood is pumped into a body cavity
      where it mixes with interstitial fluid before reentering the heart through ostia.
    composed_of:
    - hemolymph_interstitial_fluid
    tier: 1
    source_domain: biology_ch40
  closed_circulatory_system:
    defines: A circulatory arrangement in which blood remains contained inside blood
      vessels and circulates unidirectionally from the heart, through the body, and
      back.
    composed_of:
    - hemolymph_interstitial_fluid
    tier: 1
    source_domain: biology_ch40
  unidirectional_circulation:
    defines: A single-circuit blood flow pattern, as in fish, passing from the heart
      through the gills and then the body before returning.
    composed_of:
    - closed_circulatory_system
    tier: 2
    source_domain: biology_ch40
  double_circulation:
    defines: A circulatory pattern with two circuits—pulmonary and systemic—allowing
      blood to be re-pressurized after passing through the lungs.
    composed_of:
    - closed_circulatory_system
    - unidirectional_circulation
    tier: 3
    source_domain: biology_ch40
  vertebrate_heart_evolution:
    defines: The comparative anatomy of fish, amphibian/reptile, and mammal/bird hearts,
      reflecting increasing separation of oxygenated and deoxygenated blood.
    composed_of:
    - unidirectional_circulation
    - double_circulation
    tier: 4
    source_domain: biology_ch40
  pulmonary_circulation:
    defines: The circuit of blood flow from the heart through the lungs, where oxygenation
      occurs, and back to the heart.
    composed_of:
    - double_circulation
    tier: 4
    source_domain: biology_ch40
  systemic_circulation:
    defines: The circuit of blood flow from the heart to the body's organs and tissues
      and back to the heart.
    composed_of:
    - double_circulation
    tier: 4
    source_domain: biology_ch40
  coronary_circulation:
    defines: The circuit of blood flow that supplies the heart muscle itself, branching
      directly from the aorta.
    composed_of:
    - systemic_circulation
    tier: 5
    source_domain: biology_ch40
  red_blood_cells:
    defines: Small, biconcave, hemoglobin-packed cells that circulate through the
      body delivering oxygen to tissues.
    composed_of:
    - blood_composition
    - hemoglobin_respiratory_pigments
    tier: 1
    source_domain: biology_ch40
  white_blood_cells:
    defines: Nucleated blood cells that identify and target pathogens as part of the
      immune response.
    composed_of:
    - blood_composition
    tier: 1
    source_domain: biology_ch40
  platelets_coagulation:
    defines: Cell fragments that gather at wound sites and convert fibrinogen into
      fibrin, forming a clot.
    composed_of:
    - blood_composition
    tier: 1
    source_domain: biology_ch40
  plasma_and_serum:
    defines: Plasma is the liquid component of blood; serum is plasma with coagulation
      factors removed.
    composed_of:
    - blood_composition
    tier: 1
    source_domain: biology_ch40
  heart_chambers_valves:
    defines: The four-chambered mammalian heart with one-way valves that direct unidirectional
      blood flow through the heart.
    composed_of:
    - heart_wall_layers
    - cardiomyocytes
    tier: 1
    source_domain: biology_ch40
  cardiac_cycle:
    defines: The repeating sequence of heart muscle contraction and relaxation that
      fills and empties the heart of blood.
    composed_of:
    - heart_chambers_valves
    - cardiomyocytes
    tier: 2
    source_domain: biology_ch40
  cardiac_conduction_system:
    defines: The heart's internal electrical pacemaker system that times the heartbeat
      and is recorded as an ECG.
    composed_of:
    - cardiomyocytes
    - cardiac_cycle
    tier: 3
    source_domain: biology_ch40
  blood_vessel_types:
    defines: The three main classes of blood vessels—arteries, veins, and capillaries—each
      with distinct wall structures suited to their function.
    composed_of:
    - closed_circulatory_system
    tier: 2
    source_domain: biology_ch40
  vasoconstriction_vasodilation:
    defines: The narrowing and widening of blood vessels, which regulate blood flow
      distribution and blood pressure.
    composed_of:
    - blood_vessel_types
    tier: 3
    source_domain: biology_ch40
  peripheral_resistance:
    defines: The resistance that vessel walls present against the pressure exerted
      by the pumping heart, contributing to blood pressure.
    composed_of:
    - blood_vessel_types
    - vasoconstriction_vasodilation
    tier: 4
    source_domain: biology_ch40
  cardiac_output:
    defines: The volume of blood pumped by the heart in one minute, calculated as
      heart rate multiplied by stroke volume.
    composed_of:
    - cardiac_cycle
    tier: 3
    source_domain: biology_ch40
  blood_pressure:
    defines: The pressure exerted by blood against vessel walls, measured as systolic
      and diastolic values.
    composed_of:
    - cardiac_output
    - peripheral_resistance
    tier: 5
    source_domain: biology_ch40
  blood_flow_regulation:
    defines: The control of blood distribution through the body via vessel diameter,
      sphincters, valves, and nerve/hormone signals.
    composed_of:
    - vasoconstriction_vasodilation
    - blood_pressure
    tier: 6
    source_domain: biology_ch40
  capillary_exchange:
    defines: The process by which fluid, gases, and nutrients diffuse between capillaries
      and interstitial space, with excess fluid returned via the lymphatic system.
    composed_of:
    - blood_vessel_types
    - diffusion_gas_exchange
    tier: 3
    source_domain: biology_ch40
  facilitated_diffusion:
    defines: Movement of solutes across a membrane through protein-based channels,
      following the concentration gradient.
    composed_of:
    - passive_diffusion
    tier: 1
    source_domain: biology_ch41
  milliequivalent_milliosmole:
    defines: Units of electrolyte concentration that account for both the number and
      charge of ions in solution (mEq/L and mOsm).
    composed_of:
    - electrolyte
    - mole_molarity_molality
    tier: 1
    source_domain: biology_ch41
  kidney_structure:
    defines: The layered and regional organization of the kidney.
    composed_of:
    - kidney
    tier: 1
    source_domain: biology_ch41
  renal_blood_supply:
    defines: The branching network of arteries and veins that carry blood into and
      out of the kidney.
    composed_of:
    - kidney
    tier: 1
    source_domain: biology_ch41
  ammonotelism:
    defines: The excretion of nitrogenous waste directly as ammonia, typical of aquatic
      animals.
    composed_of:
    - nitrogenous_waste
    tier: 1
    source_domain: biology_ch41
  urea_cycle:
    defines: The biochemical pathway by which mammals convert toxic ammonia into urea
      for excretion.
    composed_of:
    - nitrogenous_waste
    tier: 1
    source_domain: biology_ch41
  uric_acid_pathway:
    defines: The biochemical pathway by which birds, reptiles, and most terrestrial
      arthropods convert ammonia into uric acid.
    composed_of:
    - nitrogenous_waste
    tier: 1
    source_domain: biology_ch41
  renin_angiotensin_aldosterone_system:
    defines: A hormonal pathway in which renin triggers production of angiotensin
      II, which raises blood pressure and stimulates aldosterone release.
    composed_of:
    - osmoregulatory_hormones
    - kidney
    tier: 1
    source_domain: biology_ch41
  osmotic_pressure:
    defines: Pressure exerted on a membrane that drives water movement to equalize
      solute concentration on either side.
    composed_of:
    - osmosis
    tier: 2
    source_domain: biology_ch41
  nephron:
    defines: The functional unit of the kidney, consisting of a renal corpuscle, renal
      tubule, and associated capillary network.
    composed_of:
    - kidney_structure
    - renal_blood_supply
    tier: 2
    source_domain: biology_ch41
  renal_corpuscle:
    defines: The glomerulus and its surrounding Bowman's capsule, together forming
      the blood-filtering structure of the nephron.
    composed_of:
    - nephron
    tier: 3
    source_domain: biology_ch41
  renal_tubule:
    defines: The convoluted structure emerging from the glomerulus, divided into the
      proximal convoluted tubule, loop of Henle, and distal convoluted tubule.
    composed_of:
    - nephron
    tier: 3
    source_domain: biology_ch41
  nephron_capillary_network:
    defines: The afferent and efferent arterioles and peritubular capillaries that
      supply and exchange with the nephron.
    composed_of:
    - nephron
    - renal_blood_supply
    tier: 3
    source_domain: biology_ch41
  osmoregulation:
    defines: The process of maintaining salt and water balance across membranes within
      the body's fluids.
    composed_of:
    - tonicity
    - osmosis
    tier: 4
    source_domain: biology_ch41
  urine_formation:
    defines: The three-step process by which the kidney generates urine.
    composed_of:
    - renal_corpuscle
    - renal_tubule
    - nephron_capillary_network
    tier: 4
    source_domain: biology_ch41
  glomerular_filtration:
    defines: The passive filtering of blood solutes out of the glomerular capillaries
      into the glomerulus due to blood pressure.
    composed_of:
    - renal_corpuscle
    - passive_diffusion
    tier: 4
    source_domain: biology_ch41
  tubular_reabsorption:
    defines: The reclamation of water and solutes from the filtrate back into the
      peritubular capillaries.
    composed_of:
    - renal_tubule
    - nephron_capillary_network
    tier: 4
    source_domain: biology_ch41
  tubular_secretion:
    defines: The process of secreting additional solutes and wastes into the kidney
      tubules.
    composed_of:
    - renal_tubule
    - nephron_capillary_network
    tier: 4
    source_domain: biology_ch41
  countercurrent_multiplier_exchanger:
    defines: The mechanism by which the loop of Henle and vasa recta create and maintain
      the osmotic gradient needed to concentrate urine.
    composed_of:
    - renal_tubule
    - nephron_capillary_network
    - osmotic_pressure
    tier: 4
    source_domain: biology_ch41
  juxtaglomerular_complex:
    defines: An endocrine structure formed by the macula densa and juxtaglomerular
      cells that secretes renin and erythropoietin.
    composed_of:
    - nephron
    - renal_corpuscle
    tier: 4
    source_domain: biology_ch41
  aldosterone_function:
    defines: A mineralocorticoid hormone from the adrenal cortex that promotes sodium
      (and water) reabsorption in the renal tubules.
    composed_of:
    - renin_angiotensin_aldosterone_system
    - tubular_reabsorption
    tier: 5
    source_domain: biology_ch41
  antidiuretic_hormone_function:
    defines: A hormone that promotes water reabsorption via aquaporins in the collecting
      ducts.
    composed_of:
    - osmoregulatory_hormones
    - tubular_reabsorption
    tier: 5
    source_domain: biology_ch41
  atrial_natriuretic_peptide_function:
    defines: A hormone released by the heart atrium that lowers blood pressure and
      sodium reabsorption, acting opposite to aldosterone, ADH, and renin.
    composed_of:
    - osmoregulatory_hormones
    - aldosterone_function
    tier: 6
    source_domain: biology_ch41
  epitope:
    defines: A small component of an antigen specifically recognized by antibodies,
      B cells, and T cells.
    composed_of:
    - antigen
    tier: 1
    source_domain: biology_ch42
  physical_chemical_barriers:
    defines: Non-specific first-line defenses such as skin, mucus, cilia, low pH,
      and blood proteins.
    composed_of:
    - innate_immunity
    tier: 1
    source_domain: biology_ch42
  prr:
    defines: Molecules on macrophages and dendritic cells that bind PAMPs and promote
      pathogen engulfment.
    composed_of:
    - pamp
    - phagocyte
    tier: 1
    source_domain: biology_ch42
  natural_killer_cell:
    defines: A lymphocyte of the innate immune system that kills virus-infected or
      tumor cells by detecting altered MHC I expression.
    composed_of:
    - mhc_molecules
    - innate_immunity
    tier: 1
    source_domain: biology_ch42
  interferon:
    defines: Cytokines released by infected cells that inhibit viral replication and
      modulate immune response in neighboring cells.
    composed_of:
    - cytokine
    tier: 1
    source_domain: biology_ch42
  inflammation:
    defines: Localized redness, swelling, heat, and pain from leukocytes and fluid
      moving through permeable capillaries to an infection site.
    composed_of:
    - cytokine
    - phagocyte
    tier: 1
    source_domain: biology_ch42
  complement_system:
    defines: An array of soluble proteins that opsonize pathogens and form membrane
      attack complexes to destroy extracellular pathogens.
    composed_of:
    - pathogen
    tier: 1
    source_domain: biology_ch42
  adaptive_immunity:
    defines: Immunity with memory that occurs after exposure to an antigen, more specific
      and slower-developing than innate immunity.
    composed_of:
    - antigen
    - innate_immunity
    tier: 1
    source_domain: biology_ch42
  antigen_presenting_cell:
    defines: An immune cell that engulfs and presents processed antigen on MHC molecules
      to inform the adaptive immune response.
    composed_of:
    - mhc_molecules
    - phagocyte
    - antigen
    tier: 1
    source_domain: biology_ch42
  toll_like_receptor:
    defines: A type of PRR that recognizes molecules shared by pathogens but distinguishable
      from host molecules.
    composed_of:
    - prr
    tier: 2
    source_domain: biology_ch42
  macrophage:
    defines: A large phagocytic cell derived from monocytes that engulfs pathogens
      and recognizes PAMPs via PRRs.
    composed_of:
    - phagocyte
    - prr
    tier: 2
    source_domain: biology_ch42
  perforin_granzyme:
    defines: Destructive proteins secreted by NK cells and cytotoxic T cells that
      create pores in target cells and induce apoptosis.
    composed_of:
    - natural_killer_cell
    tier: 2
    source_domain: biology_ch42
  opsonization:
    defines: The process by which proteins mark a pathogen to enhance its engulfment
      by phagocytic cells.
    composed_of:
    - complement_system
    - phagocyte
    tier: 2
    source_domain: biology_ch42
  t_cell:
    defines: A lymphocyte that matures in the thymus and mediates cell-mediated immunity
      by recognizing antigen via T cell receptors bound to MHC.
    composed_of:
    - mhc_molecules
    - adaptive_immunity
    tier: 2
    source_domain: biology_ch42
  b_cell:
    defines: A lymphocyte that matures in the bone marrow, functions as an APC, and
      differentiates into antibody-secreting plasma cells.
    composed_of:
    - adaptive_immunity
    - antigen
    tier: 2
    source_domain: biology_ch42
  mucosal_immune_system:
    defines: Lymphatic tissue combined with epithelial tissue lining mucosal surfaces,
      functioning as a parallel immune system.
    composed_of:
    - adaptive_immunity
    - innate_immunity
    tier: 2
    source_domain: biology_ch42
  immune_tolerance:
    defines: The acquired ability to prevent an unnecessary or harmful immune response
      to harmless substances or self-antigens.
    composed_of:
    - adaptive_immunity
    - antigen
    tier: 2
    source_domain: biology_ch42
  immunodeficiency:
    defines: Failure, insufficiency, or delay in the response of the immune system,
      which may be acquired or inherited.
    composed_of:
    - adaptive_immunity
    - innate_immunity
    tier: 2
    source_domain: biology_ch42
  helper_t_cell:
    defines: A CD4+ T cell that binds APCs via MHC II and stimulates B cells or secretes
      cytokines to initiate immune responses.
    composed_of:
    - t_cell
    - antigen_presenting_cell
    - cytokine
    tier: 3
    source_domain: biology_ch42
  cytotoxic_t_lymphocyte:
    defines: A CD8+ T cell that directly kills infected or cancerous cells via perforin
      and granzymes after recognizing MHC I-embedded antigen.
    composed_of:
    - t_cell
    - mhc_molecules
    - perforin_granzyme
    tier: 3
    source_domain: biology_ch42
  clonal_selection:
    defines: The activation and dramatic proliferation of a B or T cell population
      corresponding to one specific antigen receptor variant.
    composed_of:
    - b_cell
    - t_cell
    - antigen
    tier: 3
    source_domain: biology_ch42
  primary_lymphoid_organs:
    defines: Sites such as bone marrow, thymus, lymph nodes, and spleen where immune
      cells originate, mature, and communicate.
    composed_of:
    - b_cell
    - t_cell
    tier: 3
    source_domain: biology_ch42
  regulatory_t_cell:
    defines: A specialized lymphocyte that suppresses local inflammation and stimulatory
      immune factors to maintain immune tolerance.
    composed_of:
    - t_cell
    - immune_tolerance
    tier: 3
    source_domain: biology_ch42
  cell_mediated_immune_response:
    defines: The adaptive immune response carried out by T cells, including helper
      T cells and cytotoxic T lymphocytes.
    composed_of:
    - helper_t_cell
    - cytotoxic_t_lymphocyte
    tier: 4
    source_domain: biology_ch42
  plasma_cell:
    defines: An antibody-secreting immune cell that arises from a B cell stimulated
      by antigen and TH2 cytokines.
    composed_of:
    - b_cell
    - helper_t_cell
    - cytokine
    tier: 4
    source_domain: biology_ch42
  memory_cell:
    defines: An antigen-specific B or T lymphocyte that persists after a primary immune
      response and rapidly becomes an effector cell upon reexposure.
    composed_of:
    - b_cell
    - t_cell
    - clonal_selection
    tier: 4
    source_domain: biology_ch42
  humoral_immune_response:
    defines: The adaptive immune response controlled by activated B cells and the
      antibodies they secrete.
    composed_of:
    - b_cell
    - plasma_cell
    tier: 5
    source_domain: biology_ch42
  immunological_memory:
    defines: The adaptive immune system's capacity to mount a faster and stronger
      response upon reexposure to a previously encountered pathogen.
    composed_of:
    - memory_cell
    tier: 5
    source_domain: biology_ch42
  antibody:
    defines: A protein produced by plasma cells after antigen stimulation that mediates
      humoral immunity by binding antigens.
    composed_of:
    - plasma_cell
    - antigen
    tier: 5
    source_domain: biology_ch42
  antibody_classes:
    defines: The five immunoglobulin classes (IgM, IgG, IgA, IgD, IgE) distinguished
      by structure and immunological function.
    composed_of:
    - antibody
    tier: 6
    source_domain: biology_ch42
  antibody_function:
    defines: The mechanisms by which antibodies neutralize pathogens, opsonize them
      for phagocytosis, and activate the complement cascade.
    composed_of:
    - antibody
    - opsonization
    - complement_system
    tier: 6
    source_domain: biology_ch42
  affinity_avidity_cross_reactivity:
    defines: Properties describing the strength of antigen-antibody interaction, combined
      binding strength, and cross-reactive binding.
    composed_of:
    - antibody
    - epitope
    tier: 6
    source_domain: biology_ch42
  molecular_mimicry:
    defines: A phenomenon in which antibodies or T cell receptors raised against pathogen
      antigens cross-react with structurally similar self antigens.
    composed_of:
    - epitope
    - antibody
    tier: 6
    source_domain: biology_ch42
  hypersensitivity:
    defines: A spectrum of maladaptive immune responses toward harmless foreign particles
      or self antigens occurring after tissue sensitization.
    composed_of:
    - adaptive_immunity
    - antibody
    tier: 6
    source_domain: biology_ch42
  fission:
    defines: Asexual reproduction in which an organism splits into two separate, similarly
      sized organisms.
    composed_of:
    - asexual_reproduction
    tier: 1
    source_domain: biology_ch43
  budding:
    defines: Asexual reproduction in which an outgrowth of part of the parent separates
      to form a new individual.
    composed_of:
    - asexual_reproduction
    tier: 1
    source_domain: biology_ch43
  fragmentation:
    defines: Asexual reproduction in which the body breaks into parts, each capable
      of regenerating into a new individual.
    composed_of:
    - asexual_reproduction
    tier: 1
    source_domain: biology_ch43
  parthenogenesis:
    defines: Asexual reproduction in which an unfertilized egg develops into a complete
      individual.
    composed_of:
    - asexual_reproduction
    tier: 1
    source_domain: biology_ch43
  hermaphroditism:
    defines: A condition in which one individual possesses both male and female reproductive
      structures.
    composed_of:
    - sexual_reproduction
    tier: 1
    source_domain: biology_ch43
  sex_determination:
    defines: The genetic or environmental mechanisms that establish an individual's
      sex.
    composed_of:
    - sexual_reproduction
    tier: 1
    source_domain: biology_ch43
  external_fertilization:
    defines: Fertilization occurring outside the female's body, typically in aquatic
      environments via spawning.
    composed_of:
    - fertilization
    tier: 1
    source_domain: biology_ch43
  internal_fertilization:
    defines: Fertilization occurring inside the female's body, encompassing oviparity,
      ovoviviparity, and viviparity.
    composed_of:
    - fertilization
    tier: 1
    source_domain: biology_ch43
  male_reproductive_anatomy:
    defines: The structures that produce, store, and deliver sperm.
    composed_of:
    - gonads
    tier: 1
    source_domain: biology_ch43
  female_reproductive_anatomy:
    defines: The structures that produce eggs and support embryonic development.
    composed_of:
    - gonads
    tier: 1
    source_domain: biology_ch43
  gametogenesis:
    defines: The production of sperm and eggs through meiosis.
    composed_of:
    - meiosis
    - gonads
    tier: 1
    source_domain: biology_ch43
  hpg_axis_hormones:
    defines: The regulatory hormone cascade from hypothalamus and anterior pituitary
      that controls reproduction in both sexes.
    composed_of:
    - gonads
    tier: 1
    source_domain: biology_ch43
  acrosomal_reaction:
    defines: The biochemical process by which sperm digest the zona pellucida to fuse
      with and fertilize the egg.
    composed_of:
    - fertilization
    tier: 1
    source_domain: biology_ch43
  oviparity:
    defines: Reproductive strategy in which fertilized eggs are laid outside the body
      and develop using yolk nourishment.
    composed_of:
    - internal_fertilization
    tier: 2
    source_domain: biology_ch43
  ovoviviparity:
    defines: Reproductive strategy in which fertilized eggs are retained in the parent,
      nourished by yolk, and hatch fully developed.
    composed_of:
    - internal_fertilization
    tier: 2
    source_domain: biology_ch43
  viviparity:
    defines: Reproductive strategy in which young develop within the female and receive
      nourishment via a placenta.
    composed_of:
    - internal_fertilization
    tier: 2
    source_domain: biology_ch43
  spermatogenesis:
    defines: The process by which primary spermatocytes undergo meiosis to produce
      four haploid sperm cells.
    composed_of:
    - gametogenesis
    - male_reproductive_anatomy
    tier: 2
    source_domain: biology_ch43
  oogenesis:
    defines: The process by which a primary oocyte undergoes unequal meiotic division
      to produce one haploid egg and polar bodies.
    composed_of:
    - gametogenesis
    - female_reproductive_anatomy
    tier: 2
    source_domain: biology_ch43
  blastula_and_blastocyst:
    defines: The hollow ball of cells resulting from cleavage, which in mammals organizes
      into inner cell mass and trophoblast.
    composed_of:
    - cleavage
    tier: 2
    source_domain: biology_ch43
  male_hormonal_regulation:
    defines: The FSH/LH/testosterone/inhibin negative feedback system that controls
      spermatogenesis and male secondary sex characteristics.
    composed_of:
    - hpg_axis_hormones
    - spermatogenesis
    tier: 3
    source_domain: biology_ch43
  female_hormonal_regulation:
    defines: The FSH/LH/estrogen/progesterone system that controls follicle development,
      ovulation, and secondary sex characteristics.
    composed_of:
    - hpg_axis_hormones
    - oogenesis
    tier: 3
    source_domain: biology_ch43
  human_gestation:
    defines: The period of fetal development from fertilization to birth, divided
      into three trimesters.
    composed_of:
    - viviparity
    - fertilization
    tier: 3
    source_domain: biology_ch43
  ovarian_cycle:
    defines: The cyclic preparation of an egg for ovulation and conversion of the
      follicle into the corpus luteum.
    composed_of:
    - female_hormonal_regulation
    tier: 4
    source_domain: biology_ch43
  placenta_function:
    defines: The organ that mediates nutrient and waste exchange between parent and
      fetus during pregnancy.
    composed_of:
    - human_gestation
    tier: 4
    source_domain: biology_ch43
  menstrual_cycle:
    defines: The cyclic degradation and regrowth of the uterine endometrium coordinated
      with the ovarian cycle.
    composed_of:
    - ovarian_cycle
    tier: 5
    source_domain: biology_ch43
  neural_tube_formation:
    defines: The process by which the ectodermal neural plate rolls up into a tube
      that gives rise to the brain and spinal cord.
    composed_of:
    - germ_layers
    tier: 5
    source_domain: biology_ch43
  somites_and_notochord:
    defines: Mesodermal structures that give rise to vertebrae, muscle, and body axis.
    composed_of:
    - germ_layers
    tier: 5
    source_domain: biology_ch43
  vertebrate_axis_formation:
    defines: The establishment of the lateral-medial, dorsal-ventral, and anterior-posterior
      body axes during development.
    composed_of:
    - germ_layers
    tier: 5
    source_domain: biology_ch43
  levels_of_ecological_study:
    defines: The four general levels at which ecologists work — organism, population,
      community, and ecosystem.
    composed_of:
    - ecology
    tier: 1
    source_domain: biology_ch44
  organismal_ecology:
    defines: The study of the morphological, physiological, and behavioral adaptations
      that enable individual organisms to live in specific habitats.
    composed_of:
    - levels_of_ecological_study
    tier: 2
    source_domain: biology_ch44
  population_ecology:
    defines: The study of the number of individuals in a population and how and why
      population size changes over time.
    composed_of:
    - levels_of_ecological_study
    tier: 2
    source_domain: biology_ch44
  community_ecology:
    defines: The study of the interactions within and among the different species
      that make up a biological community.
    composed_of:
    - levels_of_ecological_study
    tier: 2
    source_domain: biology_ch44
  ecosystem_ecology:
    defines: The study of the biotic and abiotic components of an area and how nutrients
      and energy are stored and move among them.
    composed_of:
    - levels_of_ecological_study
    - abiotic_factors
    - biotic_factors
    tier: 2
    source_domain: biology_ch44
  biogeography:
    defines: The study of the geographic distribution of living things and the abiotic
      factors that affect their distribution.
    composed_of:
    - biosphere
    - abiotic_factors
    tier: 1
    source_domain: biology_ch44
  endemic_and_generalist_species:
    defines: Species distribution patterns ranging from endemic species restricted
      to a small geographic area to generalist species found across wide areas.
    composed_of:
    - biogeography
    tier: 2
    source_domain: biology_ch44
  ocean_upwelling:
    defines: The rising of deep, nutrient-rich ocean waters that occurs when prevailing
      winds blow along surface waters near a coastline.
    composed_of:
    - abiotic_factors
    tier: 1
    source_domain: biology_ch44
  lake_turnover:
    defines: Seasonal processes driven by a thermocline that recycle nutrients and
      oxygen from the bottom of a freshwater lake to the top.
    composed_of:
    - abiotic_factors
    tier: 1
    source_domain: biology_ch44
  net_primary_productivity:
    defines: An estimate of the organic matter available as food, calculated as the
      total carbon fixed per year minus that oxidized during cellular respiration.
    composed_of:
    - ecosystem_ecology
    tier: 3
    source_domain: biology_ch44
    also_in:
    - biology_ch46
  biome:
    defines: A large ecological community of plants, animals, and other organisms
      adapted to a characteristic set of environmental conditions, distinguished by
      temperature and precipitation.
    composed_of:
    - abiotic_factors
    - biotic_factors
    - biogeography
    tier: 2
    source_domain: biology_ch44
  terrestrial_biomes:
    defines: The eight major land-based biomes, distinguished by characteristic temperature
      and precipitation.
    composed_of:
    - biome
    tier: 3
    source_domain: biology_ch44
  aquatic_biomes:
    defines: Freshwater and marine biomes shaped primarily by light penetration, temperature
      stratification, and water movement.
    composed_of:
    - biome
    tier: 3
    source_domain: biology_ch44
  ocean_zones:
    defines: The division of the ocean into zones based on depth, distance from shore,
      and light penetration.
    composed_of:
    - aquatic_biomes
    tier: 4
    source_domain: biology_ch44
  global_climate_change:
    defines: Altered global weather patterns, especially a worldwide increase in temperature,
      due largely to rising levels of atmospheric carbon dioxide.
    composed_of:
    - climate_vs_weather
    tier: 1
    source_domain: biology_ch44
  natural_drivers_of_climate_change:
    defines: Pre-industrial factors affecting long-term climate, including Milankovitch
      cycles, variation in solar intensity, and volcanic eruptions.
    composed_of:
    - global_climate_change
    tier: 2
    source_domain: biology_ch44
  greenhouse_effect:
    defines: The warming of Earth caused by greenhouse gases trapping thermal radiation
      in the atmosphere.
    composed_of:
    - global_climate_change
    tier: 2
    source_domain: biology_ch44
  population_size_and_density:
    defines: Total number of individuals (N) in a habitat and the number of individuals
      per unit area or volume.
    composed_of:
    - population
    tier: 1
    source_domain: biology_ch45
  species_dispersion_pattern:
    defines: The spatial relationship between population members, classified as uniform,
      random, or clumped.
    composed_of:
    - population
    tier: 1
    source_domain: biology_ch45
  demography:
    defines: The statistical study of population changes over time, including birth
      rates, death rates, and life expectancies.
    composed_of:
    - population
    tier: 1
    source_domain: biology_ch45
  life_history:
    defines: The evolutionarily shaped pattern of how a species allocates resources
      over its lifetime to growth, maintenance, and reproduction.
    composed_of:
    - energy_budget
    tier: 1
    source_domain: biology_ch45
  species_diversity:
    defines: Species richness combined with relative abundance, describing a community's
      biological complexity.
    composed_of:
    - community
    tier: 1
    source_domain: biology_ch45
  interspecific_competition:
    defines: Competition between different species sharing an environment for the
      same resources.
    composed_of:
    - population
    - community
    tier: 1
    source_domain: biology_ch45
  symbiosis:
    defines: Close, prolonged interactions between individuals of different species
      (commensalism, mutualism, parasitism).
    composed_of:
    - community
    tier: 1
    source_domain: biology_ch45
    also_in:
    - biology_ch24
  predation_and_herbivory:
    defines: Interactions in which one organism consumes another, as animal prey or
      plant material.
    composed_of:
    - community
    tier: 1
    source_domain: biology_ch45
  foundation_and_keystone_species:
    defines: Species that structurally or functionally underpin a community's biodiversity.
    composed_of:
    - community
    tier: 1
    source_domain: biology_ch45
  ecological_succession:
    defines: The sequential appearance and disappearance of species in a community
      over time following disturbance.
    composed_of:
    - community
    tier: 1
    source_domain: biology_ch45
  innate_behavior:
    defines: Instinctual, genetically based behavior largely independent of environmental
      influence.
    composed_of:
    - behavior
    tier: 1
    source_domain: biology_ch45
  learned_behavior:
    defines: Behavior shaped by environmental conditioning that can change with experience.
    composed_of:
    - behavior
    tier: 1
    source_domain: biology_ch45
  life_table:
    defines: A table dividing a population into age groups showing mortality rate
      and life expectancy at each interval.
    composed_of:
    - demography
    tier: 2
    source_domain: biology_ch45
  age_structure:
    defines: The proportion of a population's members at specific age ranges, used
      to predict growth.
    composed_of:
    - population_size_and_density
    - demography
    tier: 2
    source_domain: biology_ch45
  fecundity_and_parental_care_tradeoff:
    defines: The inverse relationship between offspring number and parental care investment.
    composed_of:
    - life_history
    tier: 2
    source_domain: biology_ch45
  reproductive_timing:
    defines: The tradeoff between reproducing early (favoring offspring number) versus
      late (favoring size and fecundity).
    composed_of:
    - life_history
    tier: 2
    source_domain: biology_ch45
  semelparity_and_iteroparity:
    defines: Reproducing once then dying versus reproducing repeatedly across a lifetime.
    composed_of:
    - life_history
    tier: 2
    source_domain: biology_ch45
  exponential_growth:
    defines: Accelerating population growth under unlimited resources, producing a
      J-shaped curve.
    composed_of:
    - population_size_and_density
    tier: 2
    source_domain: biology_ch45
  carrying_capacity:
    defines: The maximum population size an environment can support (K).
    composed_of:
    - population_size_and_density
    tier: 2
    source_domain: biology_ch45
  intraspecific_competition:
    defines: Competition between members of the same species for limited resources.
    composed_of:
    - population_size_and_density
    tier: 2
    source_domain: biology_ch45
  antipredator_defense_mechanisms:
    defines: Mechanical, chemical, physical, and behavioral adaptations to avoid predation
      or herbivory.
    composed_of:
    - predation_and_herbivory
    tier: 2
    source_domain: biology_ch45
  competitive_exclusion_principle:
    defines: Two species cannot indefinitely occupy the same niche competing for identical
      resources without one outcompeting the other.
    composed_of:
    - interspecific_competition
    tier: 2
    source_domain: biology_ch45
  communication_and_mating_behavior:
    defines: Signal-based interactions including pheromones, displays, and mating
      systems.
    composed_of:
    - innate_behavior
    tier: 2
    source_domain: biology_ch45
  migration_and_foraging:
    defines: Long-range seasonal movement and optimal food-searching behavior.
    composed_of:
    - innate_behavior
    tier: 2
    source_domain: biology_ch45
  altruistic_behavior_and_kin_selection:
    defines: Behaviors lowering individual fitness while benefiting others, explained
      via kin selection and reciprocal altruism.
    composed_of:
    - innate_behavior
    tier: 2
    source_domain: biology_ch45
  survivorship_curve:
    defines: A graph of individuals surviving at each age interval, classified into
      Type I, II, and III patterns.
    composed_of:
    - life_table
    tier: 3
    source_domain: biology_ch45
  intrinsic_rate_of_increase:
    defines: The per capita growth rate (r) and maximal growth rate (rmax, biotic
      potential) under ideal conditions.
    composed_of:
    - exponential_growth
    tier: 3
    source_domain: biology_ch45
  logistic_growth:
    defines: Exponential growth that slows and levels off as population approaches
      carrying capacity, producing an S-shaped curve.
    composed_of:
    - exponential_growth
    - carrying_capacity
    tier: 3
    source_domain: biology_ch45
  density_dependent_and_independent_regulation:
    defines: Population regulation via factors that scale with density (e.g. predation)
      versus factors independent of it (e.g. weather).
    composed_of:
    - carrying_capacity
    - intraspecific_competition
    tier: 3
    source_domain: biology_ch45
  r_and_k_selected_species:
    defines: A continuum from r-selected (many offspring, little care) to K-selected
      (few offspring, extensive care) species.
    composed_of:
    - life_history
    - carrying_capacity
    tier: 3
    source_domain: biology_ch45
  primary_producer:
    defines: The trophic level that obtains energy from sunlight, inorganic chemicals,
      or dead/decaying organic material, forming the base of a food chain.
    composed_of:
    - trophic_level
    - autotroph
    tier: 1
    source_domain: biology_ch46
  primary_consumer:
    defines: A herbivore trophic level that consumes primary producers.
    composed_of:
    - trophic_level
    - heterotroph
    - primary_producer
    tier: 2
    source_domain: biology_ch46
  secondary_consumer:
    defines: Usually a carnivore that eats primary consumers.
    composed_of:
    - trophic_level
    - heterotroph
    - primary_consumer
    tier: 3
    source_domain: biology_ch46
  tertiary_consumer:
    defines: A carnivore that eats other carnivores.
    composed_of:
    - trophic_level
    - heterotroph
    - secondary_consumer
    tier: 4
    source_domain: biology_ch46
  apex_consumer:
    defines: The organism at the top of the food chain, fed on by no higher trophic
      level.
    composed_of:
    - tertiary_consumer
    tier: 5
    source_domain: biology_ch46
  food_chain:
    defines: A linear sequence of organisms (primary producers, primary consumers,
      and higher-level consumers) through which nutrients and energy pass.
    composed_of:
    - primary_producer
    - primary_consumer
    - secondary_consumer
    tier: 3
    source_domain: biology_ch46
  food_web:
    defines: A graphic, holistic, nonlinear representation of the feeding interactions
      among primary producers, primary consumers, and higher-level consumers in an
      ecosystem.
    composed_of:
    - food_chain
    tier: 4
    source_domain: biology_ch46
  grazing_food_web:
    defines: A food web with plants or phytoplankton at its base, followed by herbivores
      and carnivores.
    composed_of:
    - food_web
    tier: 5
    source_domain: biology_ch46
  detrital_food_web:
    defines: A food web based on decomposers/detritivores that feed on decaying organic
      matter and recycle it back into the ecosystem.
    composed_of:
    - food_web
    - heterotroph
    tier: 5
    source_domain: biology_ch46
  ecosystem_dynamics:
    defines: The study of changes in ecosystem structure caused by environmental disturbances
      or internal forces.
    composed_of:
    - ecosystem
    - food_web
    tier: 5
    source_domain: biology_ch46
  equilibrium:
    defines: The steady state of an ecosystem where all organisms are in balance with
      their environment and each other.
    composed_of:
    - ecosystem_dynamics
    tier: 6
    source_domain: biology_ch46
  resistance:
    defines: The ability of an ecosystem to remain at equilibrium despite disturbances.
    composed_of:
    - equilibrium
    tier: 7
    source_domain: biology_ch46
  resilience:
    defines: The speed at which an ecosystem recovers equilibrium after being disturbed.
    composed_of:
    - equilibrium
    tier: 7
    source_domain: biology_ch46
  holistic_ecosystem_model:
    defines: A model that attempts to quantify the composition, interaction, and dynamics
      of an entire ecosystem in its natural state, such as a food web.
    composed_of:
    - food_web
    - ecosystem_dynamics
    tier: 6
    source_domain: biology_ch46
  mesocosm:
    defines: A partitioned portion of a natural ecosystem used for controlled experiments.
    composed_of:
    - ecosystem
    tier: 1
    source_domain: biology_ch46
  microcosm:
    defines: A re-creation of a natural ecosystem entirely within a laboratory environment
      for experimentation.
    composed_of:
    - ecosystem
    tier: 1
    source_domain: biology_ch46
  conceptual_model:
    defines: An ecosystem model using flow charts (compartments) to show interactions
      of living and nonliving components and energy/nutrient transfer.
    composed_of:
    - ecosystem
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  analytical_model:
    defines: An ecosystem model using simple mathematical formulas to predict effects
      of environmental disturbances on ecosystem structure and dynamics.
    composed_of:
    - ecosystem_dynamics
    tier: 6
    source_domain: biology_ch46
  simulation_model:
    defines: An ecosystem model using complex computer algorithms to holistically
      model ecosystems and predict effects of disturbances.
    composed_of:
    - holistic_ecosystem_model
    tier: 7
    source_domain: biology_ch46
  gross_primary_productivity:
    defines: The rate at which photosynthetic primary producers incorporate energy
      from the sun.
    composed_of:
    - primary_producer
    tier: 2
    source_domain: biology_ch46
  trophic_level_transfer_efficiency:
    defines: The measurement of energy transfer efficiency between two successive
      trophic levels.
    composed_of:
    - trophic_level
    - second_law_of_thermodynamics
    tier: 1
    source_domain: biology_ch46
  net_production_efficiency:
    defines: A measure of how efficiently organisms at a trophic level convert received
      energy (net consumer productivity) into biomass, after assimilation losses.
    composed_of:
    - biomass
    - trophic_level_transfer_efficiency
    tier: 2
    source_domain: biology_ch46
  ecological_pyramid:
    defines: A graphical model showing the relative numbers of organisms, biomass,
      or energy across the trophic levels of an ecosystem.
    composed_of:
    - trophic_level
    - biomass
    - trophic_level_transfer_efficiency
    tier: 2
    source_domain: biology_ch46
  residence_time:
    defines: A measure of the average time an individual molecule (e.g., water) stays
      in a particular reservoir.
    composed_of:
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  water_cycle:
    defines: The biogeochemical cycle by which water moves among the atmosphere, land,
      and oceans via evaporation, condensation/precipitation, runoff, and subsurface
      flow.
    composed_of:
    - biogeochemical_cycle
    - residence_time
    tier: 2
    source_domain: biology_ch46
  ammonification:
    defines: The process converting nitrogenous waste or dead organism remains into
      ammonium (NH4+) by bacteria and fungi.
    composed_of:
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  nitrification:
    defines: The bacterial conversion of ammonium into nitrites and then nitrates.
    composed_of:
    - ammonification
    tier: 2
    source_domain: biology_ch46
  denitrification:
    defines: The bacterial conversion of nitrates back into nitrogen gas, returning
      it to the atmosphere.
    composed_of:
    - nitrification
    tier: 3
    source_domain: biology_ch46
  phosphorus_cycle:
    defines: The biogeochemical cycle of phosphorus, moving as phosphate ions between
      rock, soil, water, and living organisms, largely without an atmospheric phase.
    composed_of:
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  sulfur_cycle:
    defines: The biogeochemical cycle of sulfur between oceans, land, and atmosphere
      via decomposition, volcanic activity, weathering, and fossil fuel combustion.
    composed_of:
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  nonrenewable_resource:
    defines: A resource, such as fossil fuel, that regenerates very slowly or not
      at all relative to its rate of use.
    composed_of:
    - biogeochemical_cycle
    tier: 1
    source_domain: biology_ch46
  genetic_diversity:
    defines: The variety of genes within a species or higher taxonomic group, providing
      raw material for evolution and adaptation.
    composed_of:
    - biodiversity
    tier: 1
    source_domain: biology_ch47
  ecosystem_diversity:
    defines: The number of different ecosystems present on the planet or within a
      given geographic area.
    composed_of:
    - biodiversity
    tier: 1
    source_domain: biology_ch47
  chemical_diversity:
    defines: The variety of metabolic compounds produced by different species, a measurable
      proxy for genetic diversity with value to human medicine.
    composed_of:
    - genetic_diversity
    tier: 2
    source_domain: biology_ch47
  endemic_species:
    defines: Species found in only one location, making them particularly vulnerable
      to extinction.
    composed_of:
    - biodiversity
    - extinction
    tier: 1
    source_domain: biology_ch47
  adaptive_radiation:
    defines: A rapid branching through speciation of a phylogenetic clade into many
      closely related species that radiate into different habitats and niches.
    composed_of:
    - speciation
    tier: 1
    source_domain: biology_ch47
  mass_extinction:
    defines: A sudden and dramatic loss of biodiversity, with 25-55% of genera and
      more than half of species disappearing, observed five times in Earth's history.
    composed_of:
    - extinction
    - biodiversity
    tier: 1
    source_domain: biology_ch47
  extinction_rate:
    defines: The number of species becoming extinct over time, often measured in extinctions
      per million species-years (E/MSY).
    composed_of:
    - extinction
    tier: 1
    source_domain: biology_ch47
  species_area_relationship:
    defines: The rate at which new species are encountered as the area surveyed increases,
      used to estimate extinction rates from habitat loss.
    composed_of:
    - extinction_rate
    - habitat_loss
    tier: 2
    source_domain: biology_ch47
  latitudinal_diversity_gradient:
    defines: The pattern in which species biodiversity increases as latitude declines,
      with the greatest diversity found near the equator.
    composed_of:
    - biodiversity
    tier: 1
    source_domain: biology_ch47
  ecosystem_services:
    defines: Beneficial processes, such as nutrient cycling, pollination, and pest
      control, that arise from the diverse metabolic activities of organisms within
      ecosystems and support human welfare.
    composed_of:
    - ecosystem_diversity
    tier: 2
    source_domain: biology_ch47
  secondary_plant_compounds:
    defines: Toxins produced by plants to defend against herbivores that also serve
      as sources of medicinal drugs.
    composed_of:
    - chemical_diversity
    tier: 3
    source_domain: biology_ch47
  agricultural_diversity:
    defines: The variety of bred crop varieties and their wild relatives, which underpins
      disease resistance and food security.
    composed_of:
    - genetic_diversity
    tier: 2
    source_domain: biology_ch47
  keystone_species:
    defines: A species instrumental in maintaining diversity in an ecosystem, whose
      removal can cause a collapse in biodiversity and whose reintroduction can restore
      it.
    composed_of:
    - biodiversity
    tier: 1
    source_domain: biology_ch47
  island_biogeography:
    defines: The theory that biodiversity on an island is a function of migration,
      speciation, and extinction rates, which depend on the island's size and distance
      from a mainland source.
    composed_of:
    - speciation
    - extinction
    - biodiversity
    tier: 1
    source_domain: biology_ch47
applications:
  bioethics:
    defines: An evolving field establishing guidelines to ensure life-science research
      treats humans, animals, and the environment ethically.
    needs:
    - applied_science
    - natural_science
    tier: 3
    source_domain: biology_ch01
  phylogenetic_tree:
    defines: A diagram showing evolutionary relationships among biological species
      based on similarities and differences in traits.
    needs:
    - evolution
    tier: 3
    source_domain: biology_ch01
  three_domain_system:
    defines: Carl Woese's classification of life into three domains based on genetic
      sequence comparison.
    needs:
    - phylogenetic_tree
    - cell
    tier: 5
    source_domain: biology_ch01
  branches_of_biology:
    defines: The many biology subdisciplines, each focusing on a specific aspect or
      scale of life.
    needs:
    - biology
    - levels_of_biological_organization
    tier: 14
    source_domain: biology_ch01
  carbon_dating:
    defines: A technique that uses the known half-life and decay of carbon-14 to determine
      the age of formerly living materials.
    needs:
    - half_life
    - radioisotope
    tier: 5
    source_domain: biology_ch02
  electrolytes:
    defines: Salts, such as sodium, potassium, and calcium ions, necessary for nerve
      impulse conduction, muscle contraction, and water balance.
    needs:
    - ion
    - dissociation
    tier: 12
    source_domain: biology_ch02
  capillary_action:
    defines: The rise of water within a narrow tube caused by adhesive forces between
      water and the tube's charged surface exceeding water's cohesive forces.
    needs:
    - adhesion
    - cohesion
    tier: 10
    source_domain: biology_ch02
  blood_ph_buffering:
    defines: The carbonic acid/bicarbonate/carbon dioxide system that maintains near-neutral
      blood pH in the body.
    needs:
    - buffer
    - ph_scale
    tier: 15
    source_domain: biology_ch02
  trans_fat:
    defines: A fat formed by artificial hydrogenation of oils that converts cis double
      bonds to the trans configuration.
    needs:
    - saturated_unsaturated_fatty_acids
    - triacylglycerol
    tier: 2
    source_domain: biology_ch03
  denaturation:
    defines: The loss of a protein's shape and function due to changes in temperature,
      pH, or chemical exposure, without necessarily altering its primary sequence.
    needs:
    - protein_structure_levels
    - protein
    tier: 4
    source_domain: biology_ch03
  plant_vs_animal_cell_structures:
    defines: The application of eukaryotic cell components to explain structural differences
      between plant cells (cell wall, chloroplasts, central vacuole) and animal cells
      (centrosome, lysosomes).
    needs:
    - cell_wall
    - chloroplast
    - central_vacuole
    - centrosome
    - lysosome
    tier: 3
    source_domain: biology_ch04
  cell_communication_and_signaling:
    defines: The real-world process by which cells use the extracellular matrix and
      intercellular junctions to coordinate activities, such as blood clotting or
      coordinated muscle contraction.
    needs:
    - extracellular_matrix
    - intercellular_junctions
    tier: 3
    source_domain: biology_ch04
  medical_applications_of_cell_biology:
    defines: Real-world diagnostic and clinical uses of cell structure knowledge,
      such as Pap smear cytology, heart failure related to ER calcium storage, and
      Lowe disease from Golgi enzyme deficiency.
    needs:
    - microscope
    - endoplasmic_reticulum
    - golgi_apparatus
    tier: 4
    source_domain: biology_ch04
  sodium_potassium_pump:
    defines: An electrogenic primary active transport pump (Na+-K+ ATPase) that moves
      three sodium ions out and two potassium ions into the cell per cycle, using
      ATP.
    needs:
    - primary_active_transport
    tier: 4
    source_domain: biology_ch05
  phagocytosis:
    defines: A form of endocytosis in which a cell engulfs large particles, such as
      other cells, into a vesicle that merges with a lysosome.
    needs:
    - endocytosis
    tier: 5
    source_domain: biology_ch05
  pinocytosis:
    defines: A form of endocytosis in which a cell takes in small volumes of extracellular
      fluid and dissolved molecules via small vesicles.
    needs:
    - endocytosis
    tier: 5
    source_domain: biology_ch05
  receptor_mediated_endocytosis:
    defines: A targeted form of endocytosis using specific membrane receptor proteins
      and clathrin-coated pits to import particular substances.
    needs:
    - endocytosis
    - membrane_protein_types
    tier: 5
    source_domain: biology_ch05
  regulation_of_cellular_respiration:
    defines: Control of glucose catabolism via glucose transporters and allosteric
      feedback effectors (ATP, ADP, AMP, NADH, citrate) acting on rate-limiting enzymes
      at each stage of the pathway.
    needs:
    - glycolysis
    - citric_acid_cycle
    - oxidative_phosphorylation
    - atp
    - electron_carrier
    tier: 6
    source_domain: biology_ch07
  cellular_respiration:
    defines: The overall set of metabolic pathways (glycolysis, pyruvate oxidation,
      citric acid cycle, and oxidative phosphorylation) that extract energy from glucose
      and store it in ATP.
    needs:
    - glycolysis
    - pyruvate_oxidation
    - citric_acid_cycle
    - oxidative_phosphorylation
    tier: 6
    source_domain: biology_ch07
  cam_desert_adaptation:
    defines: A water-conserving adaptation, seen in plants like cacti, that temporarily
      fixes and stores CO2 at night so stomata can remain closed during the hot day.
    needs:
    - stoma
    - carbon_fixation
    - calvin_cycle
    tier: 8
    source_domain: biology_ch08
  photosynthesis_respiration_energy_cycle:
    defines: The complementary relationship in which photosynthesis stores solar energy
      in carbohydrates while cellular respiration releases that energy, cycling CO2
      and O2 between the two processes.
    needs:
    - photosynthesis
    - heterotroph
    tier: 9
    source_domain: biology_ch08
  gene_expression_response:
    defines: A signaling pathway outcome in which transcription or translation is
      regulated, as in the MAPK/ERK and NF-κB pathways.
    needs:
    - signaling_pathway
    tier: 5
    source_domain: biology_ch09
  cellular_metabolism_response:
    defines: A signaling pathway outcome, such as adrenaline-triggered cAMP signaling
      in muscle cells, that alters glycogen degradation and synthesis.
    needs:
    - signaling_pathway
    - second_messenger
    tier: 5
    source_domain: biology_ch09
  cell_growth_response:
    defines: A signaling pathway outcome in which growth factors bind receptor tyrosine
      kinases to activate RAS/MAP kinase pathways and stimulate cell division.
    needs:
    - signaling_pathway
    - receptor_dimerization
    tier: 5
    source_domain: biology_ch09
  apoptosis:
    defines: Programmed cell death triggered by internal checkpoints or external signals,
      allowing controlled removal of damaged, unneeded, or dangerous cells.
    needs:
    - signaling_pathway
    tier: 5
    source_domain: biology_ch09
  quorum_sensing:
    defines: A method of bacterial cell-cell communication using secreted autoinducer
      molecules to sense population density and coordinate gene expression, including
      biofilm formation.
    needs:
    - intercellular_signaling
    tier: 2
    source_domain: biology_ch09
  yeast_mating_signaling:
    defines: Signaling in budding yeast using secreted mating factor that binds cell-surface
      receptors on nearby yeast to initiate mating-related signaling cascades.
    needs:
    - cell_surface_receptor
    - signaling_pathway
    tier: 5
    source_domain: biology_ch09
  binary_fission:
    defines: The prokaryotic cell division process in which a single circular chromosome
      is replicated and segregated, and the cytoplasm is divided by an FtsZ ring without
      karyokinesis.
    needs:
    - ftsz
    - dna
    tier: 1
    source_domain: biology_ch10
  cancer:
    defines: A disease of uncontrolled cell growth resulting from accumulated mutations
      that disable cell-cycle checkpoint controls.
    needs:
    - proto_oncogene_oncogene
    - tumor_suppressor_gene
    - cell_cycle_checkpoints
    - apoptosis
    tier: 8
    source_domain: biology_ch10
  diploid_dominant_life_cycle:
    defines: A life-cycle strategy, used by animals, in which the only haploid cells
      are gametes produced by germ cells within gonads.
    needs:
    - life_cycle
    - gametes
    tier: 8
    source_domain: biology_ch11
  haploid_dominant_life_cycle:
    defines: A life-cycle strategy, used by most fungi and algae, in which the dominant
      multicellular body is haploid and the zygote immediately undergoes meiosis to
      form spores.
    needs:
    - life_cycle
    tier: 8
    source_domain: biology_ch11
  alternation_of_generations:
    defines: A life-cycle strategy, used by plants and some algae, involving both
      multicellular haploid (gametophyte) and diploid (sporophyte) stages.
    needs:
    - life_cycle
    tier: 8
    source_domain: biology_ch11
  evolutionary_advantage_of_sex:
    defines: The hypothesis that genetic variation produced by sexual reproduction
      enhances survival and reproductive success relative to asexual reproduction,
      including in coevolutionary contexts like the Red Queen hypothesis.
    needs:
    - genetic_variation_in_meiosis
    - sexual_reproduction
    tier: 7
    source_domain: biology_ch11
  test_cross:
    defines: A cross between a dominant-expressing individual of unknown genotype
      and a homozygous recessive individual, to determine the unknown parent's genotype.
    needs:
    - monohybrid_cross
    - homozygous_heterozygous
    tier: 4
    source_domain: biology_ch12
  forked_line_and_probability_methods:
    defines: Diagrammatic and calculation-based alternatives to the Punnett square
      for predicting offspring ratios in multi-gene crosses.
    needs:
    - dihybrid_cross
    - product_rule
    - sum_rule
    tier: 7
    source_domain: biology_ch12
  karyogram:
    defines: A photographic chart image of an individual's karyotype, used by clinicians
      to detect chromosomal abnormalities.
    needs:
    - karyotype
    tier: 1
    source_domain: biology_ch13
  sex_chromosome_aneuploidy_disorders:
    defines: Conditions such as Klinefelter syndrome (XXY) and Turner syndrome (X0)
      that arise from abnormal numbers of sex chromosomes, generally producing milder
      effects than autosomal aneuploidies due to X inactivation.
    needs:
    - aneuploidy
    - x_inactivation
    tier: 3
    source_domain: biology_ch13
  autosomal_aneuploidy_disorders:
    defines: Conditions such as Down syndrome (trisomy 21) that arise from an abnormal
      number of autosomes, often fatal or severely impactful due to gene dosage imbalance.
    needs:
    - aneuploidy
    tier: 3
    source_domain: biology_ch13
  gel_electrophoresis:
    defines: A technique for separating DNA fragments by size by migrating negatively
      charged DNA through an agarose gel under an electric field.
    needs:
    - nucleotide
    tier: 1
    source_domain: biology_ch14
  dna_sequencing_sanger_method:
    defines: A method for reading DNA sequence using dideoxynucleotides that terminate
      strand elongation.
    needs:
    - dna_polymerase
    - phosphodiester_bond
    tier: 2
    source_domain: biology_ch14
  meselson_stahl_experiment:
    defines: An isotope-labeling and density-gradient centrifugation experiment that
      confirmed semi-conservative DNA replication.
    needs:
    - semiconservative_replication
    tier: 4
    source_domain: biology_ch14
  protein_folding_targeting:
    defines: The post/co-translational processes by which a nascent polypeptide is
      chemically modified, folded into a functional three-dimensional structure, and
      directed to a specific cellular compartment via signal sequences.
    needs:
    - translation
    tier: 9
    source_domain: biology_ch15
  trp_operon:
    defines: A prokaryotic operon encoding tryptophan-synthesis genes that is switched
      off when tryptophan binds the repressor and blocks transcription.
    needs:
    - operon
    - repressor
    - inducer
    tier: 1
    source_domain: biology_ch16
  lac_operon:
    defines: A prokaryotic operon that is transcribed only when glucose is absent
      and lactose is present, regulated jointly by CAP and the lac repressor.
    needs:
    - operon
    - cap_protein
    - repressor
    - inducer
    tier: 2
    source_domain: biology_ch16
  cancer_gene_regulation:
    defines: The concept that cancer arises from changes to gene expression at epigenetic,
      transcriptional, post-transcriptional, translational, or post-translational
      levels.
    needs:
    - tumor_suppressor_genes
    - oncogenes
    - epigenetic_regulation
    - post_transcriptional_regulation
    - translational_regulation
    - post_translational_regulation
    tier: 2
    source_domain: biology_ch16
  targeted_cancer_therapy:
    defines: Drugs designed based on a tumor's specific gene expression pattern to
      target diseased cells, such as anti-EGFR medications.
    needs:
    - cancer_gene_regulation
    - oncogenes
    tier: 3
    source_domain: biology_ch16
  genetic_diagnosis_therapy:
    defines: Testing for disease-causing genes and using genetic engineering to introduce
      functional genes to cure inheritable disease.
    needs:
    - genetic_engineering
    - gene_targeting
    tier: 5
    source_domain: biology_ch17
  biotech_products:
    defines: Recombinant DNA technology used to mass-produce vaccines, antibiotics,
      and hormones such as insulin and human growth hormone.
    needs:
    - recombinant_dna
    - genetic_engineering
    tier: 4
    source_domain: biology_ch17
  transgenic_organisms:
    defines: Organisms modified to express recombinant DNA from another species, used
      to produce proteins or improve agricultural traits.
    needs:
    - genetic_engineering
    tier: 4
    source_domain: biology_ch17
  model_organisms_annotation:
    defines: Sequencing genomes of representative species and attaching biological
      information to gene sequences to support broader research.
    needs:
    - whole_genome_sequencing
    - genomics
    tier: 5
    source_domain: biology_ch17
  personalized_disease_risk:
    defines: Using whole-genome analysis of healthy individuals to assess propensity
      for polygenic and single-gene diseases.
    needs:
    - whole_genome_sequencing
    - genomics
    tier: 5
    source_domain: biology_ch17
  pharmacogenomics:
    defines: The evaluation of drug effectiveness and safety based on an individual's
      genomic sequence, also called toxicogenomics.
    needs:
    - whole_genome_sequencing
    - genomics
    tier: 5
    source_domain: biology_ch17
  metagenomics:
    defines: The study of the collective genomes of multiple species that grow and
      interact within an environmental niche.
    needs:
    - genomics
    - whole_genome_sequencing
    tier: 5
    source_domain: biology_ch17
  mitochondrial_genomics:
    defines: The study of mitochondrial DNA's rapid mutation rate and maternal inheritance
      to trace evolutionary relationships and genealogy.
    needs:
    - genomics
    tier: 2
    source_domain: biology_ch17
  agricultural_genomics:
    defines: The use of genomic data to link traits to genes and improve crop breeding,
      yield, and quality.
    needs:
    - genomics
    - genetic_engineering
    tier: 4
    source_domain: biology_ch17
  cancer_proteomics:
    defines: The use of biomarkers and protein signatures identified through proteomics
      to improve cancer screening, detection, and personalized treatment.
    needs:
    - proteomics
    - protein_analysis_techniques
    tier: 3
    source_domain: biology_ch17
  fossil_evidence:
    defines: The fossil record showing gradual evolutionary change in organismal form
      over millions of years.
    needs:
    - natural_selection
    tier: 2
    source_domain: biology_ch18
  biogeography_evidence:
    defines: Patterns in the geographic distribution of organisms, explained by evolution
      together with tectonic plate movement over geological time.
    needs:
    - gene_flow
    - natural_selection
    tier: 2
    source_domain: biology_ch18
  molecular_evidence:
    defines: Similarity of DNA sequences among organisms reflecting descent with modification
      from a common ancestor.
    needs:
    - mutation
    - heritable_variation
    tier: 1
    source_domain: biology_ch18
  adaptive_radiation:
    defines: Rapid speciation from a single ancestral species into many new species
      as populations adapt to varied niches.
    needs:
    - allopatric_speciation
    - adaptation
    tier: 4
    source_domain: biology_ch18
  sexual_dimorphism:
    defines: Phenotypic differences between males and females of a population, often
      resulting from sexual selection.
    needs:
    - sexual_selection
    tier: 4
    source_domain: biology_ch19
  handicap_principle:
    defines: A theory of sexual selection proposing that only the fittest individuals
      can afford costly ornamental traits, making such traits an honest signal of
      quality.
    needs:
    - sexual_selection
    tier: 4
    source_domain: biology_ch19
  good_genes_hypothesis:
    defines: A theory of sexual selection proposing that males develop impressive
      ornaments to signal efficient metabolism or disease resistance, which females
      select for to benefit their offspring.
    needs:
    - sexual_selection
    tier: 4
    source_domain: biology_ch19
  hardy_weinberg_application:
    defines: The practical use of the Hardy-Weinberg equation to detect whether a
      real population is evolving by comparing observed genotype frequencies to predicted
      equilibrium values.
    needs:
    - hardy_weinberg_principle
    - genetic_structure
    tier: 5
    source_domain: biology_ch19
  flu_vaccine_evolution:
    defines: The real-world application of evolutionary theory to predict rapidly
      mutating flu strains and design effective annual vaccines.
    needs:
    - mutation
    - natural_selection
    tier: 1
    source_domain: biology_ch19
  ring_of_life:
    defines: A phylogenetic model proposing that all three domains of life evolved
      from a single pool of gene-swapping primitive prokaryotes.
    needs:
    - horizontal_gene_transfer
    tier: 1
    source_domain: biology_ch20
  web_of_life:
    defines: A phylogenetic model proposing eukaryotes evolved from a pool of many
      species sharing genes via horizontal gene transfer, resembling a web rather
      than a single tree.
    needs:
    - horizontal_gene_transfer
    - phylogenetic_tree
    tier: 2
    source_domain: biology_ch20
  eukaryote_evolution_hypotheses:
    defines: Competing proposals for the order in which eukaryotic cell features arose.
    needs:
    - endosymbiont_theory
    - genome_fusion
    tier: 3
    source_domain: biology_ch20
  plant_virus_transmission:
    defines: The means by which plant viruses spread, either horizontally through
      mechanical damage and vectors or vertically from parent to offspring plants.
