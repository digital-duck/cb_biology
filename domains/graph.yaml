      million years ago
    needs:
    - geologic_time_periods
    - animal_clade_hierarchy
    tier: 9
    source_domain: biology_ch27
  mass_extinction:
    defines: Events eliminating most extant species within a short geological time,
      reshaping evolutionary diversification
    needs:
    - geologic_time_periods
    - cambrian_explosion
    tier: 10
    source_domain: biology_ch27
