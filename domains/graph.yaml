    - virus
    tier: 1
    source_domain: biology_ch21
  vaccination:
    defines: A preventive method that builds immunity to a virus using live, killed,
      or subunit vaccine preparations to stimulate a protective immune response.
    needs:
    - viral_attenuation
    tier: 2
    source_domain: biology_ch21
    also_in:
    - biology_ch42
  oncogenic_virus:
    defines: A virus capable of causing cancer by introducing oncogenes or disrupting
      normal host cell-cycle regulation.
    needs:
    - viral_replication_cycle
    tier: 3
    source_domain: biology_ch21
  antiviral_drug:
    defines: A medication that treats viral infection by selectively blocking the
      function of virus-encoded proteins without harming the host.
    needs:
    - viral_replication_cycle
    tier: 3
    source_domain: biology_ch21
  bacteriophage:
    defines: A virus that infects bacteria, often with a complex head-and-tail structure
      used to inject its genome across the bacterial cell wall.
