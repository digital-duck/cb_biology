    needs:
    - island_biogeography
    tier: 2
    source_domain: biology_ch47
  habitat_restoration:
    defines: Efforts to restore degraded ecosystems and biodiversity, such as reintroducing
      keystone species or removing dams.
    needs:
    - habitat_loss
    - keystone_species
    tier: 2
    source_domain: biology_ch47
  captive_breeding:
    defines: Zoo-based programs aimed at breeding endangered species for potential
      reintroduction to the wild, generally limited in effectiveness.
