    source_domain: biology_ch43
  contraception:
    defines: Methods used to prevent pregnancy by blocking fertilization or implantation.
    needs:
    - fertilization
    - female_hormonal_regulation
    tier: 4
    source_domain: biology_ch43
  menopause:
    defines: The loss of reproductive cycling due to decreased ovarian sensitivity
      to FSH and LH.
    needs:
    - menstrual_cycle
    tier: 6
    source_domain: biology_ch43
  coral_reefs:
    defines: Ocean ridges formed by marine invertebrates living in warm, shallow,
      photic-zone waters, often in mutualistic relationships with photosynthetic algae.
    needs:
    - ocean_zones
    tier: 5
    source_domain: biology_ch44
  estuaries:
    defines: Biomes where a source of fresh water meets the ocean, creating brackish
      water and important breeding grounds for many species.
    needs:
    - aquatic_biomes
    tier: 4
    source_domain: biology_ch44
  freshwater_biomes:
    defines: Standing-water and flowing-water biomes, including wetlands, that provide
      freshwater ecosystem resources.
    needs:
    - aquatic_biomes
    - lake_turnover
    tier: 4
    source_domain: biology_ch44
  human_drivers_of_climate_change:
    defines: Human activities, especially the burning of fossil fuels and deforestation,
      that release greenhouse gases and rapidly increase atmospheric carbon dioxide.
    needs:
    - greenhouse_effect
    tier: 3
    source_domain: biology_ch44
  consequences_of_climate_change:
    defines: Documented and past effects of climate change, including mass extinction
      events, glacier and ice sheet retreat, sea level rise, and shifts in species
      phenology.
    needs:
    - human_drivers_of_climate_change
    - natural_drivers_of_climate_change
    tier: 4
    source_domain: biology_ch44
  population_sampling_methods:
    defines: Techniques such as quadrat sampling and mark-and-recapture used to estimate
      population size and density.
    needs:
    - population_size_and_density
    tier: 2
    source_domain: biology_ch45
  human_population_growth:
    defines: The exponential growth of the human population, driven by technology-based
      increases in carrying capacity.
    needs:
    - exponential_growth
    - carrying_capacity
    - age_structure
    tier: 3
    source_domain: biology_ch45
  sociobiology:
    defines: An interdisciplinary science extending population biology and evolutionary
      theory to explain social organization and behavior.
    needs:
    - altruistic_behavior_and_kin_selection
    - communication_and_mating_behavior
    tier: 3
    source_domain: biology_ch45
  biomagnification:
    defines: The increasing concentration of persistent, toxic substances in organisms
      at each successive trophic level, from primary producers to apex consumers.
    needs:
    - food_chain
    - trophic_level_transfer_efficiency
    tier: 4
    source_domain: biology_ch46
  eutrophication:
    defines: A process whereby nutrient runoff causes excessive growth of microorganisms,
      depleting dissolved oxygen and killing ecosystem fauna.
    needs:
    - nitrogen_cycle
    - phosphorus_cycle
    tier: 5
    source_domain: biology_ch46
  dead_zone:
    defines: An area within a freshwater or marine ecosystem depleted of normal flora
