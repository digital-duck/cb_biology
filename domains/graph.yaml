    needs:
    - eutrophication
    tier: 6
    source_domain: biology_ch46
  acid_rain:
    defines: Corrosive rain formed when rainwater falls through sulfur dioxide or
      nitrogen oxide gas, turning it into weak sulfuric or nitric acid, damaging ecosystems
      and structures.
    needs:
    - sulfur_cycle
    - nitrogen_cycle
    tier: 5
    source_domain: biology_ch46
  biodiversity_hotspot:
    defines: A geographical area containing high numbers of endemic species and significant
      habitat degradation, identified as a priority for conservation.
    needs:
    - endemic_species
    - habitat_loss
    tier: 2
    source_domain: biology_ch47
  dna_barcoding:
    defines: A molecular genetic method using rapidly evolving gene sequences to identify
      and catalog species.
    needs:
    - genetic_diversity
    tier: 2
    source_domain: biology_ch47
  conservation_legislation:
    defines: International treaties and national laws, such as CITES, the Endangered
