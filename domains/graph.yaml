    - virus
    - lytic_cycle
    - lysogenic_cycle
    tier: 4
    source_domain: biology_ch21
  haart:
    defines: A combination drug therapy targeting HIV at multiple stages of its replication
      cycle simultaneously, reducing the likelihood of the virus developing resistance.
    needs:
    - retrovirus
    - antiviral_drug
    tier: 5
    source_domain: biology_ch21
  viral_medical_applications:
    defines: The use of viruses as tools in medicine, including gene therapy vectors,
      oncolytic viruses that kill cancer cells, and phage therapy against antibiotic-resistant
      bacteria.
    needs:
    - bacteriophage
    - oncogenic_virus
    tier: 5
    source_domain: biology_ch21
  host_associated_beneficial_microbes:
